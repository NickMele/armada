# The TypeScript half of the repo, beside the Cargo workspace rather than
# under it. Fleet and Bridge ship as a pair and version together, so they live
# in one repository and one commit moves both.
packages:
  - "apps/*"
  - "packages/*"

# Which packages may run install scripts. pnpm blocks them all by default and
# that default is right: an install script is arbitrary code from the registry,
# run before anything has been reviewed. These two need theirs — electron
# fetches its binary, esbuild its platform executable — and a package absent
# from this list runs nothing.
allowBuilds:
  electron: true
  esbuild: true
  # Arrived with electron-builder and builds the Windows installer. Armada is
  # macOS, `electron-builder.yml` declares a `mac` target and nothing else, so
  # its install script has nothing to prepare. `false` rather than absent
  # because pnpm refuses the install until the package is decided either way —
  # a blank line here fails `pnpm install` with the reason two screens up.
  electron-winstaller: false

# Refuse to install on a Node the repo does not support, rather than warn and
# carry on. `engines.node` in package.json is the floor; `.nvmrc` names the
# exact version. Without this the mismatch is a WARN line nobody reads, and the
# failure lands later as a stack trace from whichever tool broke first.
engineStrict: true
