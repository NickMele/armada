<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `default-src 'self'` and two additions, both for a frame a step's harness
      produced. An image is drawn from a `blob:` this window made itself, out of
      bytes that came over the preload from main.

      A recording is not: a two-minute capture cannot be held whole before it
      plays, so it is drawn from `armada-frame:`, a scheme main handles and
      forwards to Fleet a span at a time. What this window holds is a name, and
      main resolves it.

      Neither addition is `http://127.0.0.1:*`, which is refused here on
      purpose: it would let the renderer fetch from Fleet directly and make the
      surface that draws a file the surface that opens a port. `data:` would
      carry the bytes too, and costs a third more of them to say the same thing.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob:; media-src 'self' blob: armada-frame:"
    />
    <title>Armada</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
