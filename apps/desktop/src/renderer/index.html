<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      `default-src 'self'` and one addition: a frame a step's harness produced
      is drawn from a `blob:` this window made itself.

      The bytes come over the preload from main, which is the rule every read
      here follows — the renderer never opens a socket. So this widens to the
      one scheme that carries what this window already holds, and not to
      `http://127.0.0.1:*`, which would let the renderer fetch from Fleet
      directly and make the surface that draws a file the surface that opens a
      port. `data:` would do the job too and costs a third more bytes through
      the preload to say the same thing.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' blob:"
    />
    <title>Armada</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
