# packages/components/components.toml
#
# The Armada component registry. AUTHORED HERE, not generated — this file is
# the authority on which components exist, and nothing beyond that. Notion's
# "Armada Components" database is retired to history; a page there that
# disagrees with this file is stale, not right.
#
# One [components."<Name>"] table per component, keyed by the name the design
# project draws it under. Bridge builds from this roster: a surface composes
# components named here, and a component absent from it does not exist yet.
#
# How a component is drawn, and why, lives in the component sheet in the design
# project, beside the drawing it explains. No geometry, no reasoning and no
# notes belong in this file.
#
# Fields:
#   group    - the family the component belongs to: Bridge surface, Core,
#              Data, Forms, Navigation, Overlay
#   kind     - shadcn primitive | non-shadcn primitive | Composition |
#              Undecided
#   status   - In the kit | Proposed | Missing | Needs a contract decision
#   icons    - the glyphs it renders, each an entry in
#              packages/icons/icons.toml (absent where it renders none)
#   tokens   - the tokens it names, each defined in packages/tokens/src
#              (absent where none are recorded)
#   journeys - the journeys it appears in, each a document in docs/journeys
#              (absent where none are recorded)

