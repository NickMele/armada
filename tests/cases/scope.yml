subsystem: scope
source: check.py
note: >-
  Scope resolution and the five classifiers. Components are api (root services/api),
  ui (root services/ui) and tools (root tools). Inert path list is ["notes/"].
  Applications live at services/ui/apps/<name>, shared code at services/ui/pkg,
  suites at services/ui/e2e and services/ui/visual.

cases:

  # --- invocation parsing -------------------------------------------------

  - id: scope.args.again-rejects-scope-flags
    trap: SC-1
    note: a hand-written check outside the mutual-exclusion group
    given: { argv: ["--again", "--all-files"] }
    expect: { error: { class: bad_invocation } }

  - id: scope.args.all-and-changed-exclusive
    given: { argv: ["--all-files", "--changed"] }
    expect: { error: { class: bad_invocation } }

  - id: scope.args.changed-bare-is-distinct-from-explicit
    trap: SC-1
    note: >-
      Three states must be representable. The original used a sentinel string; a type
      that cannot express "present with no value" reintroduces the defect.
    given: { argv: ["--changed"] }
    expect: { changed: { present: true, value: null } }

  - id: scope.args.changed-explicit-is-untouched
    given: { argv: ["--changed", "release-2"] }
    expect: { changed: { present: true, value: "release-2" } }

  # --- default ref --------------------------------------------------------

  - id: scope.ref.prefers-local-default-branch
    trap: SC-2
    given:
      run:
        - { match: ["rev-parse", "--verify"], exit: 0 }
    expect: { ref: "main" }

  - id: scope.ref.falls-back-to-remote-tracking
    trap: SC-2
    note: the CI gate's own worktree has fetched but never branched
    given:
      run:
        - { match: ["rev-parse", "--verify"], exit: 128, stderr: "fatal: unknown revision\n" }
    expect: { ref: "origin/main" }

  - id: scope.ref.explicit-skips-resolution
    given:
      argv: ["--changed", "release-2"]
      run: []
    expect:
      ref: "release-2"
      invocations: { count: 0 }

  # --- changed set --------------------------------------------------------

  - id: scope.changed.union-committed-and-worktree
    given:
      run:
        - match: ["diff", "--name-only"]
          stdout: "services/api/models.py\nservices/ui/apps/app-a/page.tsx\n"
        - match: ["status"]
          stdout: " M services/api/views.py\n?? services/ui/apps/app-a/new.tsx\n"
    expect:
      files:
        - services/api/models.py
        - services/ui/apps/app-a/page.tsx
        - services/api/views.py
        - services/ui/apps/app-a/new.tsx

  - id: scope.changed.dedupes-preserving-first-seen-order
    trap: SC-12
    given:
      run:
        - { match: ["diff", "--name-only"], stdout: "services/api/models.py\n" }
        - { match: ["status"], stdout: " M services/api/models.py\n" }
    expect: { files: ["services/api/models.py"] }

  - id: scope.changed.rename-takes-destination
    trap: SC-10
    note: the source path no longer exists; passing it hard-errors the tool
    given:
      run:
        - { match: ["diff", "--name-only"], stdout: "" }
        - { match: ["status"], stdout: "R  services/api/old.py -> services/api/new.py\n" }
    expect: { files: ["services/api/new.py"] }

  - id: scope.changed.nul-delimited-survives-newline-in-name
    note: >-
      Not in the original, which reads line-oriented output and cannot express this.
      Added because PLAN.md §4.1 requires NUL-delimited reads; see harvest SC-11.
    given:
      run:
        - { match: ["diff", "-z", "--name-only"], stdout: "services/api/we\nird.py\0" }
        - { match: ["status", "-z"], stdout: "" }
    expect: { files: ["services/api/we\nird.py"] }

  # --- component classification ------------------------------------------

  - id: scope.classify.other-component-only
    given: { files: ["services/ui/apps/app-a/page.tsx"], all: false }
    expect: { components: ["ui"] }

  - id: scope.classify.own-component-only
    given: { files: ["services/api/models.py"], all: false }
    expect: { components: ["api"] }

  - id: scope.classify.unrecognised-path-schedules-everything
    trap: SC-5
    note: a root config file is not confined to any component and can affect any check
    given: { files: ["README.md"], all: false }
    expect: { components: ["api", "tools", "ui"] }

  - id: scope.classify.inert-path-runs-nothing
    trap: SC-4
    given: { files: ["notes/design.md"], all: false }
    expect: { components: [] }

  - id: scope.classify.inert-does-not-widen-a-real-scope
    trap: SC-4
    given: { files: ["notes/design.md", "services/api/models.py"], all: false }
    expect: { components: ["api"] }

  - id: scope.classify.root-prose-is-not-inert
    trap: SC-6
    note: only files inside a declared inert path are inert
    given: { files: ["CONTRIBUTING.md"], all: false }
    expect: { components: ["api", "tools", "ui"] }

  - id: scope.classify.tooling-uses-positive-membership
    trap: SC-7
    note: >-
      The engine's own component must not ride along on unrelated diffs, and must always
      run on its own. Without this rule the gate reported PASS having run zero of its tests.
    given: { files: ["tools/check.rs"], all: false }
    expect: { components: ["tools"] }

  - id: scope.classify.tooling-alongside-another-component
    trap: SC-7
    given: { files: ["tools/check.rs", "services/api/models.py"], all: false }
    expect: { components: ["api", "tools"] }

  - id: scope.classify.mixed-runs-both
    given:
      files: ["services/api/models.py", "services/ui/apps/app-a/page.tsx"]
      all: false
    expect: { components: ["api", "ui"] }

  - id: scope.classify.all-flag-with-non-empty-list
    note: >-
      Rewritten. The original paired the all-flag with an empty list, which shares a
      short-circuit with the empty case and therefore could not fail independently.
    given: { files: ["services/api/models.py"], all: true }
    expect: { components: ["api", "tools", "ui"] }

  - id: scope.classify.empty-scope-runs-everything
    trap: SC-12
    note: a branch with no diff must not report PASS having run nothing
    given: { files: [], all: false }
    expect: { components: ["api", "tools", "ui"] }

  # --- sub-scoping within a component ------------------------------------

  - id: scope.subscope.union-of-touched-directories
    given:
      files: ["services/api/billing/models.py", "services/api/accounts/views.py"]
      all: false
    expect: { subscope: ["accounts/", "billing/"] }

  - id: scope.subscope.root-file-forces-whole-component
    trap: SC-8
    note: shared infrastructure affects every sub-directory
    given: { files: ["services/api/billing/models.py", "services/api/manage.py"], all: false }
    expect: { subscope: whole }

  - id: scope.subscope.all-flag-uses-whole-component
    given: { files: ["services/api/billing/models.py"], all: true }
    expect: { subscope: whole }

  - id: scope.subscope.component-in-scope-with-no-files-of-its-own
    trap: SC-9
    note: >-
      Not covered by the original. Reachable when a component is in scope only because some
      other file was ambiguous. Without the fallback the tool receives an empty path list.
    given: { files: ["README.md"], all: false, component: api }
    expect: { subscope: whole }

  # --- suite scoping ------------------------------------------------------

  - id: scope.suites.single-application
    given: { files: ["services/ui/apps/app-a/page.tsx"], all: false }
    expect: { suites: ["app-a"] }

  - id: scope.suites.declared-order-not-input-order
    trap: SC-19
    given:
      files: ["services/ui/apps/app-c/x.tsx", "services/ui/apps/app-a/y.tsx"]
      all: false
    expect: { suites: ["app-a", "app-c"] }

  - id: scope.suites.application-without-its-own-suite
    trap: SC-18
    note: app-d's only coverage is the shared cross-cutting suite
    given: { files: ["services/ui/apps/app-d/page.tsx"], all: false }
    expect: { suites: ["shared"] }

  - id: scope.suites.editing-the-shared-suite-itself
    given: { files: ["services/ui/e2e/redirect.spec.ts"], all: false }
    expect: { suites: ["shared"] }

  - id: scope.suites.shared-package-falls-back-to-full-list
    trap: SC-16
    given:
      files: ["services/ui/apps/app-a/x.tsx", "services/ui/pkg/button.tsx"]
      all: false
    expect: { suites: ["shared", "app-a", "app-b", "app-c"] }

  - id: scope.suites.component-root-file-falls-back
    trap: SC-16
    given: { files: ["services/ui/package.json"], all: false }
    expect: { suites: ["shared", "app-a", "app-b", "app-c"] }

  - id: scope.suites.unknown-application-falls-back
    trap: SC-15
    note: >-
      Not covered by the original — the only fallback case with no test. A newly added
      application has no table entry and would otherwise contribute nothing.
    given: { files: ["services/ui/apps/app-new/page.tsx"], all: false }
    expect: { suites: ["shared", "app-a", "app-b", "app-c"] }

  - id: scope.suites.no-files-of-that-kind-falls-back
    trap: SC-17
    note: >-
      Reads backwards but is load-bearing. When the component is in scope only because
      something was ambiguous, returning empty skips the suite on exactly the change most
      likely to break it.
    given: { files: ["services/api/models.py"], all: false }
    expect: { suites: ["shared", "app-a", "app-b", "app-c"] }

  - id: scope.suites.empty-scope-falls-back
    given: { files: [], all: false }
    expect: { suites: ["shared", "app-a", "app-b", "app-c"] }

  # --- coverage-set scoping (the screenshot check) ------------------------

  - id: scope.covered.covered-application-in-scope
    given: { files: ["services/ui/apps/app-a/x.tsx"], all: false, covers: ["app-a"] }
    expect: { in_scope: true }

  - id: scope.covered.uncovered-application-only
    given: { files: ["services/ui/apps/app-b/x.tsx"], all: false, covers: ["app-a"] }
    expect: { in_scope: false }

  - id: scope.covered.mixed-covered-and-uncovered
    trap: SC-20
    note: >-
      The scan must continue past an uncovered application rather than returning false;
      an early return drops the covered one.
    given:
      files: ["services/ui/apps/app-b/x.tsx", "services/ui/apps/app-a/y.tsx"]
      all: false
      covers: ["app-a"]
    expect: { in_scope: true }

  - id: scope.covered.its-own-suite-directory
    given: { files: ["services/ui/visual/home.spec.ts"], all: false, covers: ["app-a"] }
    expect: { in_scope: true }

  - id: scope.covered.shared-package
    given: { files: ["services/ui/pkg/button.tsx"], all: false, covers: ["app-a"] }
    expect: { in_scope: true }

  # --- target resolution --------------------------------------------------

  - id: scope.target.dot-is-the-current-directory
    trap: SC-13
    note: >-
      Confirmed live against a programmatic caller. "." contains no separator, so without
      the special case it falls through to branch resolution and is rejected with a
      misleading not-a-branch error.
    given: { target: "." }
    expect: { resolved: cwd, invocations: { count: 0 } }

  - id: scope.target.empty-string-is-the-current-directory
    trap: SC-13
    given: { target: "" }
    expect: { resolved: cwd, invocations: { count: 0 } }

  - id: scope.target.trailing-slash-dot-is-the-current-directory
    trap: SC-13
    note: >-
      A trailing-slash dot does contain a separator, so without the special case it resolves
      only when the current directory happens to be a workspace root.
    given: { target: "./" }
    expect: { resolved: cwd, invocations: { count: 0 } }

  - id: scope.target.path-matches-a-registered-workspace
    given:
      target: "~/wk/feature-x"
      workspaces:
        - { path: "~/wk/main", branch: main }
        - { path: "~/wk/feature-x", branch: feature-x }
    expect: { resolved: "~/wk/feature-x" }

  - id: scope.target.symlinked-path-still-matches
    trap: SC-14
    note: >-
      Both sides are canonicalised for comparison, but the recorded spelling is returned —
      returning the canonical form makes every downstream comparison against git diverge.
    given:
      target: "/tmp/link/feature-x"
      canonical: { "/tmp/link/feature-x": "~/wk/feature-x" }
      workspaces: [{ path: "~/wk/feature-x", branch: feature-x }]
    expect: { resolved: "~/wk/feature-x" }

  - id: scope.target.branch-name-resolves
    given:
      target: "feature-x"
      workspaces: [{ path: "~/wk/feature-x", branch: feature-x }]
    expect: { resolved: "~/wk/feature-x" }

  - id: scope.target.unknown-path-errors
    given: { target: "~/wk/nowhere", workspaces: [{ path: "~/wk/main", branch: main }] }
    expect: { error: { class: bad_invocation } }

  - id: scope.target.unknown-branch-errors-differently
    note: the two errors must be distinguishable; each names how to list valid targets
    given: { target: "no-such-branch", workspaces: [{ path: "~/wk/main", branch: main }] }
    expect: { error: { class: bad_invocation } }

  - id: scope.target.detached-workspace-has-no-branch
    note: >-
      Not covered by the original. A record with no branch line must be tolerated by path
      lookup and simply never match a branch lookup.
    given:
      target: "no-such-branch"
      workspaces: [{ path: "~/wk/detached", branch: null }]
    expect: { error: { class: bad_invocation } }

excluded:

  - id: scope.classify.all-flag-with-empty-list
    reason: >-
      The classifier short-circuits on "all-flag OR empty list", so the all-flag row cannot
      fail unless the empty-list row also fails. It is a restatement of its neighbour.
    replaced_by: scope.classify.all-flag-with-non-empty-list

  - id: scope.suites.assert-against-the-modules-own-list
    reason: >-
      Five suite-fallback assertions in the original compare the result against the module's
      own declared suite list rather than against a literal. If the declared list is wrong
      they still pass.
    replaced_by: scope.suites.shared-package-falls-back-to-full-list

  - id: scope.changed.explicit-empty-file-list
    reason: >-
      The original tests the raw argument string for emptiness rather than the parsed list,
      so an explicit empty list silently becomes a full changed-file run. This is defect X-8
      in docs/harvest.md, not behaviour to pin. A case asserting the correct behaviour —
      empty means empty — belongs in the new suite instead.
