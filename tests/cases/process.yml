subsystem: process
source: _shared.py
note: >-
  The subprocess seam: deadlines, process groups, abort. The most directly portable area in
  the harvest, and the one that cross-checks docs/traps.md. Every case here needs real
  processes — ARCHITECTURE.md §1.1 forbids faking the filesystem and these forbid faking the
  process table for the same reason. Run them at the integration tier.

cases:

  # --- deadlines ----------------------------------------------------------

  - id: process.deadline.hung-command-is-killed
    given: { command: sleeps-forever, deadline_s: 1.0 }
    expect: { exit: 124, returns_within_s: 20 }

  - id: process.deadline.states-its-reason-rather-than-implying-it
    trap: PRO-6
    note: >-
      The consumer is usually an agent seeing only a parsed summary, and "timed out" versus
      "the tool failed" call for opposite next moves. In Armada the typed home is
      error.class = timeout, exit 4 (ARCHITECTURE.md §1.7), not in-band text.
    given: { command: sleeps-forever, deadline_s: 1.0 }
    expect: { error: { class: timeout }, message_names_the_budget: true }

  - id: process.deadline.fast-command-is-untouched
    given: { command: prints-and-exits, deadline_s: 30.0 }
    expect: { exit: 0, stdout_contains: ["hello"] }

  - id: process.deadline.real-failure-keeps-its-own-exit-code
    note: a timeout must never be confused with an ordinary non-zero exit, in either direction
    given: { command: exits-3, deadline_s: 30.0 }
    expect: { exit: 3 }

  - id: process.deadline.absent-means-no-deadline
    trap: PRO-4
    note: >-
      Two arities under one name. If the deadline becomes non-optional with a default, every
      call silently acquires one — a behaviour change that surfaces as flakiness under load
      rather than as a failing test.
    given: { command: prints-and-exits, deadline_s: null }
    expect: { exit: 0, no_deadline_armed: true }

  - id: process.deadline.partial-output-survives
    trap: PRO-5
    note: >-
      Often the only clue to where the tool hung. In Rust this must be explicit — accumulate
      into buffers owned by reader threads from spawn, rather than re-reading after the kill.
    given: { command: prints-then-hangs, deadline_s: 1.5 }
    expect: { exit: 124, stdout_contains: ["before-the-hang"] }

  - id: process.deadline.silent-hang-still-times-out-while-streaming
    trap: PRO-4
    note: >-
      A tool that has stopped emitting still holds its pipe open, so a line-driven loop
      blocks forever and never reaches a clock check. The deadline must be enforced by
      waiting on the process, never by the read loop.
    given: { command: prints-then-hangs, deadline_s: 1.5, streaming: true }
    expect: { exit: 124, returns_within_s: 20 }

  # --- process groups -----------------------------------------------------

  - id: process.group.kill-reaches-grandchildren
    trap: PRO-1
    note: >-
      The central regression case. Confirms docs/traps.md's measured killpg-reaches-
      grandchildren entry. Uses a cooperative child, so it proves the group mechanism and
      says nothing about the stop policy — which is the gap the next case closes.
    given: { command: spawns-grandchild-then-hangs, deadline_s: 2.0 }
    expect: { exit: 124, grandchild_alive_after: false }

  - id: process.group.leader-exits-while-a-member-survives
    trap: X-15
    note: >-
      Rewritten from an assertion that could not fail. Measured defect in the original: the
      group id is looked up at kill time, and for a child that exited but was not reaped the
      lookup fails and the entire kill is skipped. Record the group id at spawn instead —
      with setsid it is the child's pid and can never become unavailable.
    given: { command: leader-exits-grandchild-survives, deadline_s: 1.0 }
    expect:
      exit: 124
      grandchild_alive_after: false
      stdout_preserved: true
      returns_within_s: 20

  - id: process.group.escalation-is-unconditional
    trap: X-16
    note: >-
      Measured defect in the original: escalation is conditioned on the leader's exit rather
      than the group's emptiness, so a leader that dies on the soft signal while a member
      ignores it never triggers the hard one. docs/traps.md already prescribes unconditional
      escalation, because children inherit an ignored disposition and one uncooperative
      leader immunises its group. traps.md wins.
    given: { command: leader-dies-member-ignores-term, deadline_s: 1.0 }
    expect: { exit: 124, member_alive_after: false }

  - id: process.group.already-dead-group-does-not-raise
    trap: X-17
    note: >-
      docs/traps.md measured a different error condition on darwin than on Linux for a
      zombie-only group, and warns that branching on one specifically sees neither answer.
      On the abort path an escaping error is inside a signal handler with nothing to catch it.
    given: { command: exits-immediately, kill_after_exit: true }
    expect: { raises: false }

  - id: process.group.timeout-path-cannot-itself-hang
    trap: PRO-3
    note: >-
      An unreaped grandchild holds the write end of the pipe, so no end-of-file arrives and
      an unbounded drain blocks forever — the timeout mechanism becoming the hang it exists
      to prevent. Confirmed in the original by a deliberate reversion, which hung the suite.
    given: { command: grandchild-outlives-parent-shell, deadline_s: 1.5 }
    expect: { returns_within_s: 45 }

  # --- abort --------------------------------------------------------------

  - id: process.abort.reaps-commands-still-in-flight
    trap: PRO-7
    note: >-
      The unavoidable cost of session isolation: detached, a terminal interrupt reaches only
      the supervisor and every server it started sails on. Confirmed live — an interrupted
      run left a build shell and a job worker holding ports, so the next run failed to bind
      and blamed its own topology.
    given: { commands_in_flight: 1, deadline_s: null }
    expect: { reaped: 1, worker_finishes_within_s: 30, result_exit_non_zero: true }

  - id: process.abort.registry-is-empty-after-a-normal-completion
    trap: PRO-7
    note: >-
      A registry that only grows has abort signalling long-dead pids, which the OS recycles
      onto unrelated processes.
    given: { command: prints-and-exits }
    expect: { registry_empty: true, second_reap_returns: 0 }

  - id: process.abort.is-reentrant-for-the-thread-it-interrupts
    trap: ST-4
    note: >-
      A signal handler runs on the main thread, interrupting it between statements, and that
      thread may already hold the registry lock. Confirmed live — a run wedged during setup
      ignored the stop signal entirely, with every thread parked. In Rust the naive port is
      worse than the original: there is no re-entrant mutex in std. The structural fix is
      never to hold the lock while killing — snapshot, release, then kill.
    given: { reap_called_while_holding_the_registry_lock: true }
    expect: { finishes_within_s: 10 }

  - id: process.abort.restores-default-disposition-before-any-work
    trap: PRO-10
    note: >-
      Rewritten. The original asserted this by splitting the implementation file on a
      function signature and comparing substring indices. Send a real signal to a real child
      and assert a second signal is effective — everything after the restore acquires locks,
      and a handler that blocks while still installed swallows every further signal.
    given: { signal_twice: true }
    expect: { second_signal_terminates: true }

  - id: process.abort.kills-children-before-publishing
    trap: PRO-9
    note: publishing first tells a waiter the machine is clear while servers still hold ports
    given: { abort_with_children_running: true }
    expect: { order: ["children-killed", "state-published"] }

  - id: process.abort.re-raises-so-the-exit-status-reflects-the-signal
    trap: PRO-11
    note: >-
      Interacts with ARCHITECTURE.md §1.6's signal carve-out — re-raising after restoring the
      default disposition is how you get 128+N rather than a clean exit.
    given: { signal: INT }
    expect: { exit: 130 }

  # --- encoding -----------------------------------------------------------

  - id: process.encoding.invalid-bytes-do-not-crash-the-run
    trap: X-10
    note: >-
      Measured defect in the original: strict decoding raises out of the runner before any
      result exists — no exit code, no partial output, no timeout verdict. Real tools emit
      invalid UTF-8 in progress spinners and truncated escape sequences. Capture bytes;
      lossy-decode at the reporting boundary.
    given: { command: emits-invalid-utf8 }
    expect: { raises: false, exit: 0 }

  - id: process.encoding.streaming-does-not-merge-the-streams
    trap: X-11
    note: >-
      Defect in the original: the streaming runner redirects stderr into stdout, so a caller
      that parses them separately sees nothing under that mode. A verbose flag must not
      change the shape of what a check's parser sees.
    given: { command: writes-to-both-streams, streaming: true }
    expect: { stdout_contains: ["out-side"], stderr_contains: ["err-side"] }

  # --- prohibitions -------------------------------------------------------

  - id: process.prohibition.no-unsessioned-wait-with-timeout
    trap: PRO-13
    note: >-
      Rewritten. The original read the module's own source text and searched only for the
      presence of the correct construct, never for the forbidden one — it passed if only one
      of two runners was right. The prohibition covers any helper that spawns without a new
      session and then waits with a timeout: its timeout kills the direct child only, and its
      own cleanup read is unbounded, so a surviving grandchild blocks it forever.
    given: { spawn_tree: true, kill: true }
    expect: { nothing_survives: true }

  - id: process.prohibition.one-module-constructs-commands
    note: >-
      Structural companion to the case above, and cheap. Assert that the process adapter is
      the only module constructing a child process, and that every path through it sets a
      new session.
    given: { crate_graph: true }
    expect: { command_construction_confined_to: "adapters process module" }

excluded:

  - id: process.deadline.exits-just-before-the-deadline
    reason: >-
      Named for the already-dead-group guards but given a 30-second deadline against a
      command that exits at once, so the kill path is never entered. A regression in those
      guards passes it unchanged. This is the hole the group-id-lookup defect hid in.
    replaced_by: process.group.leader-exits-while-a-member-survives

  - id: process.prohibition.source-text-scan
    reason: >-
      Asserts the text following the first runner definition contains the correct spawn
      argument. It never searches for the forbidden call, passes if only the second runner is
      correct, and passes unchanged if the prohibition is violated.
    replaced_by: process.prohibition.no-unsessioned-wait-with-timeout

  - id: process.abort.handler-ordering-by-source-text
    reason: Splits the implementation file and compares substring indices.
    replaced_by: process.abort.restores-default-disposition-before-any-work

  - id: process.registry.global-singleton-semantics
    reason: >-
      Two original cases depend on the registry being process-global, and one asserts a
      count of at least one for that reason — they cannot run in parallel with any other
      case. ARCHITECTURE.md §1.4 forbids the global anyway; the registry belongs on the run
      adapter behind Ctx, which makes these per-instance and parallel-safe.
    replaced_by: process.abort.reaps-commands-still-in-flight
