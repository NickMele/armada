# The root holds the two things that describe the *whole* repository, and
# nothing that describes any one product in it. That is the shape a scan was
# blind to: it read here, found these two, and reported everything else absent.
services:

  # **A variable with a default, which is how a compose file supports both a
  # fixed port and a per-worktree override.** It is extremely common, and it is
  # the spelling that broke the scanner: splitting on every `:` cut inside
  # `${...}` and reported a host port of `-5432}`.
  postgres:
    image: postgres:16
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  # A bare entry publishes on an ephemeral host port until `up` rewrites it into
  # the claimed block. A scan reports what the file says, which is `9200`.
  search:
    image: opensearchproject/opensearch:2
    ports:
      - "9200"
