# rails-monolith — `setup:` as a sequence.
#
# Axis it owns (PHASES.md §8.1): a `setup:` that is four ordered steps rather
# than one string, including one that needs `shell: true`; two services with
# real dependency ordering; and `owns.release:` for a database on a shared
# server — something `clean` can never reach, so it is recorded and reported
# and never run (PLAN.md §6.1).
#
# The failures it catches: `setup:` modelled as a single string; `needs:`
# ordering that only works for one service; a setup step that errors when its
# resource already exists; and setup that creates something `clean` cannot
# reclaim.

manifest:
  version: 1

  components:

    postgres:
      run:
        driver: compose
        file: [docker-compose.yml]
        ports: { pg: 5432 }
        ready: { tcp: pg, timeout: 90 }

    redis:
      run:
        driver: compose
        file: [docker-compose.yml]
        ports: { redis: 6379 }
        ready: { tcp: redis }

    # No `root:` — a monolith's source is the repo. `match:` therefore has to be
    # written out, and is three globs rather than one subtree.
    app:
      match: ["app/**", "lib/**", "config/**", "db/**"]
      setup:
        - bundle install
        # Idempotence is the repo's to provide, not char's. `db:create` errors
        # when the database already exists, and `|| true` needs a shell — which
        # is why `shell:` is per step and visible in the diff.
        - { cmd: "bin/rails db:create || true", shell: true }
        - bundle exec rails db:migrate
        - bundle exec rails db:seed
      owns:
        files: [vendor/bundle, tmp/cache]
        # Postgres here is a shared server, not a char-managed container, so this
        # database outlives the workspace directory. char records the resolved
        # command at `init` and reports it from `status --all` when the workspace
        # is gone. It never executes it.
        release: psql -h db.internal -c 'DROP DATABASE app_${workspace.id}'
      run:
        driver: command
        cmd: bundle exec puma --port ${port.app}
        stop: bundle exec pumactl --pidfile tmp/pids/server.pid stop
        ports: { app: 3000 }
        ready: { http: "http://127.0.0.1:${port.app}/up", timeout: 120 }
        needs: [postgres, redis]
        env:
          RAILS_ENV: development
          REDIS_URL: redis://127.0.0.1:${port.redis}/0
      checks:
        lint:
          cmd: bundle exec rubocop ${files}
          fix: bundle exec rubocop --autocorrect ${files}
          timeout: 300
        # `shell: true` at check level, covering every command string in the
        # entry. Two commands joined by `&&` is a shell construct, and this check
        # declares no `fix:` — no fixture yet needs a shell for one of the two
        # strings and static argv[0] resolution for the other.
        boot:
          cmd: bin/rails zeitwerk:check && bin/rails runner 'Rails.application.eager_load!'
          shell: true
          scope: component
          timeout: 300
          needs: [postgres]
        test:
          cmd: bundle exec rspec ${files}
          env:
            RAILS_ENV: test
          needs: [postgres, redis]
          timeout: 900
          cost: 2

    # The second service, and the ordering that matters: it needs redis *and*
    # the app's own setup to have run, and it is fire-and-forget — no port, no
    # endpoint, nothing to probe.
    worker:
      run:
        driver: command
        cmd: bundle exec sidekiq
        ready: { none: true }
        needs: [redis, app]
        env:
          RAILS_ENV: development
          REDIS_URL: redis://127.0.0.1:${port.redis}/0
