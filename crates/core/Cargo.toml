[package]
name = "armada-core"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Armada's pure core: decisions as functions over data. No I/O, ever."

# ARCHITECTURE.md §1.5: pure data crates only. Nothing here may open a file, a
# socket or a process — parsing a string is not I/O, reading the file is, and
# reading it lives in `manifest`.
[dependencies]
serde = { workspace = true }
# The `--json` envelope is serialized here, from structs. Measured: a
# `serde_json::Value` sorts object keys while struct fields emit in
# declaration order, so routing a payload through one alphabetises it and
# every hand-regenerated golden snapshot stops matching (`docs/traps.md`).
# ARCHITECTURE.md §1.5 names serde_json as a pure data crate the core may
# take, which is what makes rendering here legal as well as correct.
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
# The two derived identities are `sha1(realpath(...))[..8]`. Chosen for having
# no dependencies of its own: hashing bytes is a pure function, and the core
# may not grow a transitive I/O crate by accident.
sha1_smol = "1"
# `armada manifest explain`'s failure signature, named by PLAN.md §3.4. Pure: it hashes
# bytes and opens nothing. It does use `unsafe` internally for SIMD, and
# `#![deny(unsafe_code)]` is per-crate and does not reach a dependency — the
# same trust decision `docs/traps.md` already records for the YAML parser.
blake3 = { workspace = true }
# Normalising a failure's output — stripping the paths, ids, timings and pids
# that differ between two runs of the same bug. ARCHITECTURE.md §1.5 names it as
# a pure data crate the core may take.
regex = { workspace = true }

[dev-dependencies]
# The JSON Schema validator the tests use to hold the schema and the structs to
# each other. Test-only on purpose: which validator `armada manifest config verify` embeds
# is phase 5's decision, and taking it here would make it phase 1's by default.
boon = "0.6"
