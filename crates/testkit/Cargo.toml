[package]
name = "testkit"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# testkit is allowed to depend on whatever a test needs. It is never a
# dependency of anything that ships.
[dependencies]
adapter-traits = { path = "../adapter-traits" }
config = { path = "../config" }
core-model = { path = "../core-model" }
# For `wreckage` only. A test that has to clear a row the store cannot rebuild
# has to make one first, and the making stays behind `store`'s own door.
store = { path = "../store", features = ["wreckage"] }
