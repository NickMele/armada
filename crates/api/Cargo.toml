[package]
name = "api"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# No `core-model`, and no `fleet`. This crate speaks the wire vocabulary only —
# a domain type it cannot name is a domain type it cannot leak.
ipc = { path = "../ipc" }
axum = { version = "0.7", features = ["ws"] }
serde = "1"
# `time`: one bounded wait, in `observing`, for the Drone a Job that advances
# spawns next. Nothing here is on a timer.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
# The tests drive the router with no socket at all: `tower` calls it as the
# service it is, and the WebSocket half runs over an in-memory duplex pipe. A
# loopback listener would be a smaller lie than a real network, but still a lie
# about what this crate needs in order to be exercised.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
