[package]
name = "armada-manifest"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Manifest module's imperative shell: the outside world, behind the three seams."

# Depends on core, never the other way round (ARCHITECTURE.md §1.5). `libc` is
# here and nowhere else: the four `unsafe` calls the design permits all live in
# this crate's POSIX module.
[dependencies]
armada-core = { path = "../core" }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"
