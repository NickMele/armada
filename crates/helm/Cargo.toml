[package]
name = "armada-helm"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "armada — one consistent vocabulary for managing a repo's tech stack."

# The only crate that depends on both, and the only one that wires them
# together (ARCHITECTURE.md §1.5).
# A library target as well as the binary, so the integration and golden suites
# can drive the verbs with fake seams instead of only through a subprocess.
# `ARCHITECTURE.md` §1.3 keeps the *public* contract to the CLI surface and the
# `--json` payloads — this crate is `publish = false`, so nothing here is a
# promise to anyone; it is how the tests reach `Ctx<FakeRun, FixedClock, …>`.
[lib]
name = "armada_helm"
path = "src/lib.rs"

# One binary, named for the suite rather than for this crate. There is no
# `Armada` shim: it was never published, so a clean break costs nothing
# (PHASES.md §8.3). There is deliberately no `helm` on PATH either — Kubernetes
# owns that name (`docs/glossary.md`).
[[bin]]
name = "armada"
path = "src/main.rs"

# `arm` is the same program under a shorter name, so that `cargo install` puts
# the short spelling on PATH rather than leaving every machine to carry a shell
# alias the next one will not have.
#
# **A second `[[bin]]` rather than a symlink or an alias**, for the reason the
# suite has one binary at all: a symlink is not installed by `cargo install`,
# and an alias lives in a shell rc that no `armada` verb can see or repair. Both
# names then behave identically by construction rather than by upkeep.
#
# **The name was checked before it was taken**, which is the rule `helm` set:
# nothing called `arm` ships on macOS or Linux, so this shadows nothing a person
# depends on. Shortening a name is never worth taking one that is already in use.
[[bin]]
name = "arm"
path = "src/main.rs"

[dependencies]
armada-manifest = { path = "../manifest" }
# Guild and Manifest are siblings that may not name each other
# (ARCHITECTURE.md §1.9); this is the crate where the two meet, which is what
# "Helm is the only crate that depends on both and wires them together" means
# in practice.
armada-guild = { path = "../guild" }
# Fleet sits above both of them and is the only module that may name both
# (ARCHITECTURE.md §1.9). Helm names all three, which is what "the only crate
# that depends on both and wires them together" means as the stack grows.
armada-fleet = { path = "../fleet" }
armada-core = { path = "../core" }
serde_json = { workspace = true }
# **The whole of M1.5's rendering dependency budget** (`docs/commands/render.md`):
# the standard library answers "is this a terminal" via `IsTerminal`, and this
# answers "how wide" via one `ioctl`. No curses, no terminfo database, and no
# colour crate — the palette is twelve escape literals in `render/palette.rs`,
# which is less code than a dependency's feature flags.
#
# Not done with `libc` — which `armada-manifest` already carries — because
# `ARCHITECTURE.md` §1 permits exactly four `unsafe` calls, all of them in that
# crate's POSIX module. A fifth would be a change to a design invariant, and a
# terminal's width is not worth one.
terminal_size = "0.4"

# **The one exception to the paragraph above, and it is not a rendering
# dependency.** The interview's three prose questions want paragraphs, and a
# single-line prompt that scrolls sideways is not where anyone writes one
# (`PLAN.md` §13.4). Drawing an editable box that handles resize, arrow keys and
# a bracketed paste is not interesting work and not what this repo is for.
#
# `ratatui` rather than something smaller because it is already the decided crate
# for the Bridge (`PHASES.md` §8.5) — one dependency doing two jobs rather than a
# second one — and `Viewport::Inline` is what lets the box sit in the terminal you
# are already in instead of taking the screen.
#
# Default features off: no `palette`, no `serde`, no calendar widget. The palette
# stays `render/palette.rs`'s, read through `Role::rgb`.
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "std",
    "layout-cache",
] }

# **The MCP server's whole dependency budget, and the only async in the repo**
# (`docs/commands/helm/mcp.md`). MCP is a wire protocol with a versioned
# specification, a lifecycle, and an extension — `io.modelcontextprotocol/tasks`
# — that `armada manifest check` needs because a real run lasts well past ten
# minutes. Hand-rolling JSON-RPC over stdio would be small; hand-rolling the
# Tasks extension's durable handles, TTL expiry and mid-flight input would not,
# and a bespoke polling protocol is the thing the specification exists to stop
# anyone inventing.
#
# **v3.1.2, verified on crates.io rather than taken from the doc.** `traps.md`
# recorded "v3.x, re-check before starting" because this SDK moves fast; the
# check found 3.1.2 current, `task_manager` present, and the base protocol
# stateless as of spec revision `2026-07-28` — which is why nothing here holds a
# session.
#
# Default features off. No `client` (Armada serves, it does not call), no
# `auth`, and no HTTP transport of any kind: `--stdio` is the transport Claude
# Code uses and the server lives as long as whatever registered it.
rmcp = { version = "3.1.2", default-features = false, features = [
    "server",
    "macros",
    "schemars",
    "transport-io",
] }
# `schemars` names the tool inputs' JSON Schema, and `rmcp` re-exports the same
# version — pinned here anyway so a derive in this crate cannot silently compile
# against a second one.
schemars = "1"
serde = { workspace = true }
# **The runtime `rmcp` is written against, and nothing more.** `rt` for the
# single-threaded executor `mcp serve` builds, `io-std` for the stdio transport,
# `sync`/`time` for what the Tasks extension's manager already uses. No
# `rt-multi-thread`: a stateless server handling one request at a time on stdio
# has nothing to schedule across cores, and the verbs underneath are blocking by
# design.
tokio = { version = "1", default-features = false, features = [
    "rt",
    "io-std",
    "sync",
    "time",
    "macros",
] }

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
