[package]
name = "armada-helm"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "armada — one consistent vocabulary for managing a repo's tech stack."

# The only crate that depends on both, and the only one that wires them
# together (ARCHITECTURE.md §1.5).
# A library target as well as the binary, so the integration and golden suites
# can drive the verbs with fake seams instead of only through a subprocess.
# `ARCHITECTURE.md` §1.3 keeps the *public* contract to the CLI surface and the
# `--json` payloads — this crate is `publish = false`, so nothing here is a
# promise to anyone; it is how the tests reach `Ctx<FakeRun, FixedClock, …>`.
[lib]
name = "armada_helm"
path = "src/lib.rs"

# One binary, named for the suite rather than for this crate. There is no
# `Armada` shim: it was never published, so a clean break costs nothing
# (PHASES.md §8.3). There is deliberately no `helm` on PATH either — Kubernetes
# owns that name (`docs/glossary.md`).
[[bin]]
name = "armada"
path = "src/main.rs"

[dependencies]
armada-manifest = { path = "../manifest" }
armada-core = { path = "../core" }
serde_json = { workspace = true }
# **The whole of M1.5's rendering dependency budget** (`docs/commands/render.md`):
# the standard library answers "is this a terminal" via `IsTerminal`, and this
# answers "how wide" via one `ioctl`. No curses, no terminfo database, and no
# colour crate — the palette is twelve escape literals in `render/palette.rs`,
# which is less code than a dependency's feature flags.
#
# Not done with `libc` — which `armada-manifest` already carries — because
# `ARCHITECTURE.md` §1 permits exactly four `unsafe` calls, all of them in that
# crate's POSIX module. A fifth would be a change to a design invariant, and a
# terminal's width is not worth one.
terminal_size = "0.4"

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
