[package]
name = "charkit-adapters"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "charkit's imperative shell: the outside world, behind the three seams."

# Depends on core, never the other way round (ARCHITECTURE.md §1.5). `libc` is
# here and nowhere else: the four `unsafe` calls the design permits all live in
# this crate's POSIX module.
[dependencies]
charkit-core = { path = "../core" }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = { version = "1", default-features = false, features = ["parse"] }
