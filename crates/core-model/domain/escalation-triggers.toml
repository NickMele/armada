# Why a Job stopped and a person is being asked. The vocabulary the
# `escalated` status stores its reason from, and the one `last_verdict`
# draws its `failed(<reason>)` payload from.
#
# Authored here. Carried across from the design workspace's Escalation
# Triggers database, which is the record of the decision and the reasoning
# that produced it, not the authority on the current set — a page there that
# disagrees with this file is stale, not right.
#
# The table key is the wire value, so a rule can compare this set against the
# enum `core-model` will hold without a mapping in between.
#
# `kind` is what keeps this honest: a row here may be a sub-kind of another
# rather than a trigger of its own, and the argument for why it is a sub-kind
# rather than a peer is on that row.
#
# `job_transitions` is the edge a trigger fires where it has one of its own.
# A trigger with none fires `running -> escalated`, which that edge's own row
# in job-transitions.toml names as the default.
#
# A row that names one names a *second* edge and not its only one: the default
# admits every trigger, so what a declared edge adds is a `from` no other
# trigger may reach `escalated` from. Read as the only one it made
# `interrupted`'s meaning unreachable, which is what [interrupted-transition-set]
# asked about until 2026-08-31.
#
# Fields:
#   kind            - Trigger | Sub-kind
#   level           - Step | Job. Empty on a sub-kind, which takes its parent's.
#                     `last_verdict` admits step-level triggers only, so a
#                     step-level row is one that can name which step stopped
#   meaning         - the condition, in one sentence
#   job_transitions - the edge this trigger fires. A "from -> to" pair whose
#                     ends are keys in job-statuses.toml. Absent ordinarily
#                     means the default edge below; on a row that says it names
#                     a step and never a Job, it means there is no Job edge at
#                     all, and the row is where that is stated
#   in_code         - what the source recorded, and provenance rather than fact.
#                     It recorded "In code" for evidence_suspect, fan_out,
#                     gate_failure, stalled, thrashing — that was v1, and v1 is
#                     deleted, so as a claim about this repository it was false;
#                     every row carried across says "Not yet" instead. A row
#                     authored here has no source value to carry and leaves it
#                     empty. Which triggers Fleet actually produces is answered
#                     by reading Fleet, never by this field.
#   open_questions  - questions the source left open against this row
#   notes           - the reasoning the row's page carried
#   why             - why the row exists at all, and what was refused in its
#                     place. Carried by the rows argued in this repository

[triggers.blocked_by_policy]
kind = "Trigger"
level = "Step"
meaning = "The Drone was refused a tool or command it needed and finished having submitted no evidence. Distinct from silent, which is a Drone that called nothing at all: this one tried and was stopped. The remedy differs — a rephrase cannot help, and the fix is a configuration change."
in_code = "Not yet"
open_questions = ["What does Fleet accept as proof a Drone did the work, given the result envelope reports success for a run that did nothing?"]

[triggers.check_timeout]
kind = "Trigger"
level = "Step"
meaning = "A Check hit its own bound — a config row narrowed by an optional per-Check field."
in_code = "Not yet"
notes = "Distinct from `gate_failure`: the Check did not fail, it did not finish, so retrying would reproduce the same hang. Distinct from the Drone/Job timeout, which bounds the whole Job rather than one command."

[triggers.dependency_failed]
kind = "Trigger"
level = "Job"
meaning = "An upstream Job this one depends on reached a terminal status other than completed_success."
job_transitions = ["queued -> escalated"]
in_code = "Not yet"
notes = """
Fires on a Job in `queued` whose upstream reaches `completed_failed`, `rejected`, or `killed`. `superseded` is the exception: it unblocks the dependent and surfaces it with the dependency marked unsatisfied, since superseding means the work landed outside the Job rather than failing to land.

Job-level: a `queued` Job has no current step, so the payload's step field carries nothing here — the same reason `interrupted` and `resource_exhausted` are Job-level.
"""
why = """
Cascading the failure would write `completed_failed` onto work that never ran, against a diff and worktree that don't exist. Fleet writes that terminal without a person, so one failure could silently terminate an arbitrarily deep dependency chain; escalating stops at the first dependent and asks instead.

Leaving the Job queued under a new readiness reason fails differently: CPU headroom self-clears, but a failed upstream never does, so the Job would wait indefinitely behind a label with no action attached. Every escalation trigger names a malfunction, and a failed upstream is one — which is why `awaiting_attestation` has no home under `escalated` and this trigger does.
"""

[triggers.drone_killed]
kind = "Trigger"
level = "Step"
meaning = "A person ended the Drone working this step, so the step stopped where it stood."
in_code = ""
notes = """
**It names a step and never a Job, which no other row does.** Every other trigger answers "why did the Job stop"; this one answers "what became of the step underneath". A person ending a Drone is already acting on a Job that has stopped or is about to, and what it stopped *for* — `stalled`, `interrupted`, `silent`, `blocked_by_policy` — is the ending's own classification and stays on the Job's transition. This is what the step carries so that a person can restart it. `job_transitions` is absent for that reason rather than the usual one, and the field's own description says so.

Not `interrupted`, and the two are the pair that must not merge. That one is a process that was there and is not, found by Fleet, and it is Job-level because nobody chose it. This is a person taking the process away, on purpose, from a step they intend to run again — which is exactly what makes it step-level. Borrowing `interrupted` would send whoever read the badge hunting for a dead Drone that a person had just ended deliberately.

Not `stalled` or its `silent` sub-kind either, though one of them is usually the reason a person reaches for the kill. Those are the liveness clock's readings of a Drone, they are Job-level for the reason `stalled`'s own row gives, and the Job keeps whichever of them applied.

Not `gate_failure` and not `thrashing`: nothing weighed the work. No evidence was submitted, no Check ran and no Judge was asked, so there is no verdict here for a person to disagree with — `overrulable` is false, and `Recourse::OverrideVerdict` is withheld on a step nothing ruled on.

`in_code` is empty rather than "Not yet" for `gate_undecided`'s reason — the row was authored here and has no source value to carry.
"""
why = """
`kill_drone` moved the Job and cleared the Drone and never moved the step, so the step and its attempt sat `running` beneath a Job that was `escalated` with no Drone on it. `restart_step` reads a `stopped` row and `redirect_drone` needs a live session, so both had nothing to land on, and the only act a person was offered was redispatching the whole Job — which throws away every step that already advanced, its verdicts and its deliverable. `#313` is 6m29s of passed work discarded to recover from a stall on the step after it.

Stopping the step with no verdict at all was the alternative, and it is the honest shape of what happened: nothing was weighed. It is refused because a person opening the Job a week later would read an absence where the record could have carried a reason, and because `Job::stopped_on` answers the step and the trigger together — four acts and one classification make that reading, and a `stopped` row saying nothing would be one they all find and none can explain.

Re-levelling `interrupted` or `stalled` to Step was the other, and is refused on those rows' own reasoning: both are facts about a Drone rather than about a step, and both are raised by Fleet noticing something rather than by a person deciding something.
"""

[triggers.evidence_suspect]
kind = "Trigger"
level = "Step"
meaning = "Mechanically passed, semantically flagged as likely gamed."
in_code = "Not yet"
notes = """
Distinct from `gate_failure`: resubmission under the same instructions would likely reproduce the same gaming, so the retry flow is the wrong destination and a person needs to look. Raised by `judge_check.gaming_check`, optionally against an earlier step's evidence named by `baseline_ref`; Judge owns the routing.

Step-level, because evidence is submitted per step: evidence suspected of gaming is suspect on the step that submitted it, and that step is the one whose gate was gutted. So it may appear in `last_verdict`, which admits step-level triggers only — that is what lets a gaming finding say which step's evidence is not to be trusted.

Renders as "evidence disputed," with Judge in the verification-source field rather than the headline.
"""
why = "\"Judge rejected the evidence\" would be wrong twice: `rejected` is already a Job state."

[triggers.evidence_too_large]
kind = "Trigger"
level = "Step"
meaning = "Evidence exceeded max_context_size."
in_code = "Not yet"
open_questions = ["Does exceeding max_context_size hard-fail or soft-warn?"]
notes = """
Escalates rather than hard-failing the step or warning past it. A hard fail would route to the retry flow, whose only re-scope for a combined diff is a smaller one — and a Convoy cannot be split, so retries would burn budget on something the Drone cannot fix. A soft warning would let the Judge grant on partial sight, showing an ordinary pass in the record.

Not fully closed: the cap is authored per step by someone who cannot know how wide a Convoy will be, and a loop workflow breaches it by construction unless prior-iteration context is trimmed.
"""

[triggers.fan_out]
kind = "Trigger"
level = "Job"
meaning = "A Job tripped the sub-dispatch cap or the sub-dispatch rate threshold."
in_code = "Not yet"
notes = "Volume itself is the signal, not any single dispatch: it escalates rather than gating each sub-dispatch, and sub-dispatches inside an already-approved Job need no separate approval. It counts Jobs only — a Judge call is not a sub-dispatch, since it has no worktree, no rail, and no Job Board row.

Job-level: fan-out is about the Job's shape rather than about whichever step the dispatches happened under, so there is no step for it to attach to."
why = "Counting Judge calls would make \"2 of 5\" meaningless, since one step at `panel_size: 3` would burn three of five on its own; `spawned_jobs` and `judge_calls` are counted separately for that reason. Judge owns the argument."

[triggers.gate_failure]
kind = "Trigger"
level = "Step"
meaning = "Evidence was submitted, honestly did not pass, and the retry limit is exhausted."
in_code = "Not yet"
notes = """
The ordinary failure: nothing is wrong with the Drone, the evidence, or the machinery — the work did not clear the bar within the attempts allowed.

`loop_cap` is not this, because nothing failed. `check_timeout` is not this, because the Check did not fail, it did not finish. `evidence_suspect` is not this, because the evidence passed mechanically and resubmitting would reproduce the same gaming.
"""

[triggers.gate_undecided]
kind = "Trigger"
level = "Step"
meaning = "Fleet could not read what it needed in order to rule — the Job's diff, its changed files, the step's patch, or an answer the Judge never gave. The step neither passed nor failed."
in_code = ""
notes = """
Not `gate_failure`, and the two are opposites about the same step: that one is the ordinary failure, where nothing is wrong with the Drone, the evidence or the machinery and the work did not clear the bar. Here the machinery is what is wrong and the step's criteria were never reached at all.

Not `check_timeout`: a Check that did not finish is a Check that ran. This fires where the gate could not obtain an artifact at all, which happens before the Checks and again after them.

Step-level, and it has to be: the artifact belongs to one step's gate, and only a step-level trigger reaches `last_verdict` and leaves a `stopped` row a person can redirect or restart from.

Fires on the first occurrence and is never retried. A worktree momentarily unreadable and a Judge that cannot be handed a patch look identical from where the gate stands, and the second is not fixed by trying again — so the artifact and the cause are written down and a person decides which it was.

`in_code` is empty rather than "Not yet": there is no source value to carry, because this row was authored in this repository rather than moved from the design workspace's database.
"""
why = """
No existing row covered it. `Ruling::CouldNotDecide` was written into `crates/fleet/src/gate.rs` naming its own absence — a Job that landed there stayed `running` and was reached, if at all, by the liveness clock, which knows nothing about why it is stuck. A Job sat on one step for eight minutes with a one-line log, and the truthful answer to the person watching was that the gate had already tried, failed to read something, and told nobody.

A verdict was the alternative and is refused: a machine that cannot answer must not produce one, in either direction. So the Job stops and names the artifact instead of failing the work.
"""

[triggers.hatch_unbidden]
kind = "Trigger"
level = "Job"
meaning = "The Drone called `escape_hatch` on a Job Fleet had not marked for the handoff. The pull is refused and the Job surfaces, because a Drone reaching for the hatch unbidden is a Drone struggling."
in_code = "Not yet"
notes = """
Not `thrashing`: the hatch on its own stands in place of thrashing, so one trigger for both would erase the distinction this one enforces. Nothing mechanical has to fire first and no forced report has to fail — the tool call is the whole detection.

Job-level, like `interrupted` and `resource_exhausted`: the pull is a fact about the Drone rather than about the step it happened to be on.

Fires the default edge. What Fleet answers the Drone names no mark, and Pilot owns why.
"""
why = """
The pull is the most reliable stuck signal Armada gets: v1 proved a Drone will report a success it did not reach rather than admit a dead end. Refusing it and saying nothing spends that signal on a denied tool call and leaves the Drone working a Job it has just said it cannot finish.

Allowing it instead would keep the two meanings of one tool call indistinguishable — an engineer taking over a Drone that may be fine, and a Drone with nothing left to try.
"""

[triggers.interrupted]
kind = "Trigger"
level = "Job"
meaning = "Crash recovery. A Job marked running has no matching OS process."
job_transitions = ["awaiting_review -> escalated"]
in_code = "Not yet"
notes = """
Set by Fleet's restart reconciliation. Behaviourally identical to any other escalation — the Job is paused and surfaced for a human decision; the distinction is in what happened, not in what the system does about it.

**"No matching OS process" is asked, not assumed.** A Drone is spawned into a session of its own and outlives the Fleet that started it, so reconciliation probes the pid and start time it recorded at the spawn: a process that is still the same one is adopted and the Job stays where it was, and only a pid that is vacant or has come round as something else reaches this trigger. A probe that will not run reaches it too, and the Job's log says the process may still be there — that is the one reading here that is a floor rather than a finding.

**A process that was there and is not, and nothing else.** Two sites in Fleet raise it, both from `running` and both on that fact: a Drone that ended without reporting, and a submission arriving for a Job the slot no longer holds. Nine other failures borrowed it until 2026-08-31 — every one of them upstream of a spawn that had not happened — and they are `not_prepared`, `no_worktree`, `not_configurable` and `would_not_start` now. The verb is the whole reason it mattered: it sends a person hunting for a dead Drone, which is the right instruction only when there was one.

The declared edge is a *second* edge, not the only one. `running -> escalated` is the default and admits every trigger, which is how the meaning above is reached and what both live sites use. `awaiting_review -> escalated` is the one this trigger owns and no other may take: the liveness clock is suspended at a human gate, so `stalled` cannot fire there and reconciliation is the only thing left that reads the gate. The edge was written for a Drone dying while a person read, and the gate holds no Drone now — one ends when its step's work passes the machine gates, so an ordinary wait has no process to be missing. What reaches it is the restart reconciliation, which asks about a Job at the gate exactly as it asks about one that was running.
"""

[triggers.loop_cap]
kind = "Trigger"
level = "Step"
meaning = "A loop workflow's step hit its iteration_cap."
in_code = "Partly"
open_questions = ["Is there an aggregate attempt bound on a looping step, given retry_count resets each iteration?"]
notes = """
Nothing failed — the loop simply did not converge, which is why the count that tripped it is `iteration_count` rather than `retry_count`: an iteration is the step being redone as designed, and must never consume the retry budget. It escalates the way a stuck gate does.

Because `retry_count` resets on each loop return, a looping step can burn `retry_limit × iteration_cap` attempts before this fires, and `completed_failed` is unreachable on such a step — `loop_cap` always gets there first. The aggregate attempt cap in `default_gate_policy` bounds that.

**The arithmetic exists and nothing raises the trigger yet.** `ResolvedStep::may_return` is the one place a spent cap is decided, exactly as `may_hand_back` is the one place a spent retry budget is; `crates/fleet/src/gate.rs` is what raises `gate_failure` off the first and is what will raise this off the second. The cap counts *passes* — with a cap of five the fifth pass is the last — which is the reading `retry_limit × iteration_cap` above and the canvas's "iteration 3 of 5" both compute against. #263.

**Where the cap lives is settled and no longer asked here**: on the step that emits the routing verdict, beside the `verdict_routing` that declares the loop, because a cap split from the count it bounds never fires.
"""

[triggers.no_report]
kind = "Trigger"
level = "Step"
meaning = "A step found not to be converging was told to stop and report where it stood, and no report arrived."
in_code = ""
notes = """
**Said nothing back, and never did nothing.** `stalled` is the Drone that produced nothing at all, and its `silent` sub-kind is the Drone that called no tool — both belong to the liveness clock and both are Job-level. This is the opposite Drone: the one this was minted for wrote five files in the ninety seconds after the directive and answered none of it. A reader who collapses the two has erased the trigger, and the badge would send a person hunting for a dead process instead of an ignored instruction.

Not `thrashing`, which is the finding this follows rather than the thing this records. The mid-step look finds a step not converging and injects the directive; that is the whole of `thrashing` now. This fires one stage later and on a different fact — silence against the directive — and the two want opposite responses: a Drone that ignored an instruction while still doing the work can be redirected, a Drone that has run out of road cannot. `hatch_unbidden`'s notes hold the same principle, that a trigger standing in place of `thrashing` gets a row of its own.

A Drone still writing inside its declared plan is not this. `crates/fleet/src/converging.rs` re-reads the declared paths when the grace expires and re-arms the deadline where they have grown, so a late answer is not silence. What this names is the Drone that has neither answered nor moved.

Step-level, like `thrashing`: the grace is measured against one step, and the finding quoted on that step's `forced_report` row is that step's work product.

`in_code` is empty rather than "Not yet" for `gate_undecided`'s reason — the row was authored here and has no source value to carry.
"""
why = """
Both cases badged as `churning`, and a person reading `churning` on a step whose Drone was still writing is being told the work was going nowhere. That was the one thing the record could not support: the mid-step finding was minutes old by the time the step stopped and nothing re-checked it, so what the step was stopped for was the silence and not the finding.

A sub-kind under `thrashing` was the alternative and is refused for `silent`'s reason read backwards. A sub-kind renders as its parent, so `escalation_reason` would still say `thrashing` on the wire and `churning` on the badge, which is the whole of what is being fixed.
"""

[triggers.no_worktree]
kind = "Trigger"
level = "Job"
meaning = "Git or the filesystem could not put the Job in a worktree work could start in. Nothing was spawned and no process is missing."
in_code = ""
notes = """
Four paths and one state. `create_worktree` failed; the Job's attachments would not copy into the worktree that was made; the worktree an earlier step used has been reclaimed and a readmitted Job has nothing to go back onto; the branch would not come up to its base, so a Drone put on the tree would start from a state nobody has read. The meaning names the state rather than any one of them, which is `gate_failure`'s lesson: a verb naming the act stops being true the moment a second act produces it. Which one it was is in the `Adrift` on the Job's log — `NoWorktree`, `AttachmentUnreadable`, `WorktreeGone`, or a delivery failure.

They are one trigger because **the same person fixes all four**, and that is what a trigger is for. The disk is full, the repository is in a state git will not work from, or somebody reclaimed a worktree a Job still needed. None of it is answered by reading a Drone's transcript, because there is no Drone.

Told apart from `not_prepared` by the same question. There the checkout is real and a command the *Manifest* names failed inside it, so the answer is a line in `armada.yml`; here git never produced a checkout to run anything in. The two verbs were made to say so — "the worktree was unusable" against "a required command did not succeed" — after the first draft gave them both the word *worktree* and made them a pair a reader could not separate at a glance.

Job-level. No step is the reason: the worktree is a fact about the Job, and on the readmit path no step has been re-entered at all. Nothing was weighed, so there is nothing for `last_verdict` to hold.

Fires the default edge from `running`, and on one path it cannot: a readmitted Job is `queued`, and `queued -> escalated` belongs to `dependency_failed` alone. `crates/fleet/src/dispatch.rs` says what it does about that and why.

`in_code` is empty rather than "Not yet" for `gate_undecided`'s reason — the row was authored here and has no source value to carry.
"""
why = """
It was raised as `interrupted` from the day dispatch shipped until 2026-08-31. `interrupted` means a Job marked running has no matching OS process, so the badge sent whoever read it looking for a dead Drone, and there had never been a Drone — the failure is upstream of the spawn on every one of the four paths.

Not folded into `not_prepared`, which is the nearest existing row and would have been the cheap answer. Preparation runs *inside* a worktree that exists; this is the worktree not existing. One trigger over both would have made the badge unable to say whether to look at `armada.yml` or at the disk, which is the only thing the badge is for.
"""

[triggers.not_configurable]
kind = "Trigger"
level = "Job"
meaning = "The values a Drone's spawn is built from would not resolve, so no process was ever asked to start."
in_code = ""
notes = """
Two paths. The opening brief would not render, or `DroneSpawnConfig` refused what it was given — a model name no roster row carries, an MCP config path that is not usable, an environment variable that is not a name. `crates/adapters`' `SpawnConfigRefused` carries which, and `crates/config/src/roster.rs` names the model typo as the case it expects most.

**The remedy is a line somebody wrote**: the Manifest, or the model roster. That is what separates it from `would_not_start`, where the values were all good and the machine refused anyway. The order is the order of the code — configure, then start — and the two triggers keep it, so a reader knows which half to look at.

Job-level. The step is `running` by the time a spawn is attempted, but no step is the *reason* and nothing about the work was weighed; the same is true of `interrupted` at a Drone that vanished, which is Job-level for the same reason.

Fires the default edge, `running -> escalated`.

`in_code` is empty rather than "Not yet" for `gate_undecided`'s reason — the row was authored here and has no source value to carry.
"""
why = """
It was raised as `interrupted`, and `crates/config/src/roster.rs` had written the defect into its own module doc: a model typo "fails at the spawn — where `fleet::spawning` turns a `SpawnConfigRefused` into an interrupt… and reports the Job as `Interrupted`, which names the wrong cause". A typo in `armada.yml` presented as a crashed process.

A payload on `interrupted` is refused for the reason `silent` is a sub-kind rather than a field: what a person reads first is the trigger, and a distinction carried only in a payload is a distinction the badge does not make.
"""

[triggers.not_prepared]
kind = "Trigger"
level = "Job"
meaning = "A command the Manifest's setup.requires names did not succeed, so the worktree is not one work can be run in. Nothing had been spawned and no step had been entered."
in_code = ""
notes = """
Job-level, and it could not be anything else: preparation runs immediately after the worktree is made and before the first step is entered, so there is no step for the trigger to attach to and nothing for `last_verdict` to hold. That is the same reason `dependency_failed` is Job-level, arriving from the other end of the Job.

Not `no_worktree`, which is the row a reader reaches for once both exist and is the pair this file most has to keep apart. Preparation runs *inside* a worktree that is a real checkout; `no_worktree` is git or the disk never producing one. The question that separates them is who fixes it: a line in `armada.yml` here, the disk or the repository there. Both verbs said *worktree* on the day the second one was minted and were changed in the same breath — this row's is "a required command did not succeed", which is the first clause of the meaning above.

Not `gate_failure` and not `check_timeout`, which are the two rows a reader reaches for. Both are about a step: one is work that was submitted and did not clear the bar, the other is a Check that gates a step and did not finish. Preparation gates nothing. `crates/fleet/src/preparing.rs` shares only the process runner with the Checks, and the module says why.

Every path into it — a non-zero exit, a signal, a budget overrun, a program not on the path, a worktree that has gone — leaves the same fact behind, which is why the meaning names the worktree rather than any one of them. Which one it was is on the Job's log, with the `setup.requires` entry and the line that ran.

Fires the default edge, `running -> escalated`: the Job is `running` by the time the worktree exists.

`in_code` is empty rather than "Not yet" for `gate_undecided`'s reason — the row was authored here and has no source value to carry.
"""
why = """
It was raised as `interrupted` from the day preparation shipped until 2026-08-31, which is a lie of the same shape `gate_failure` told an hour earlier: `interrupted` means a Job marked running has no matching OS process, and a person reading it goes looking for a dead Drone. There was never a Drone. The remedy is a line in `armada.yml` or a missing tool on the path, and neither is anywhere near where that verb sends them.

A payload on `interrupted` was the alternative and is refused for the reason `silent` is a sub-kind rather than a field: what a person reads first is the trigger, and a distinction carried only in a payload is a distinction the badge does not make.
"""

[triggers.resource_exhausted]
kind = "Trigger"
level = "Job"
meaning = "A running Job exhausted CPU or memory."
in_code = "Not yet"
notes = "Fleet's pre-spawn headroom poll covers only Jobs that have not started; this is what lets a Job that exhausts CPU or memory while already running say so. Job-level, like `interrupted` — the condition belongs to the process, not to any step it happened to be on."

[triggers.run_ended]
kind = "Trigger"
level = "Step"
meaning = "The Drone's own run ended with nothing submitted, so Fleet took the process away and the step stopped where it stood."
in_code = ""
notes = """
**`drone_killed`'s sibling, and the pair is the whole of why this row exists.** That one is a person taking the process away; this is Fleet taking it away because the Drone said its run was over. Both answer "what became of the step underneath" rather than "why did the Job stop", both are therefore step-level, and both leave what the Job stopped *for* — `stalled`, `silent`, `blocked_by_policy` — on the Job's own transition where the reaping road already puts it. A person restarts the step off this row.

Not `interrupted`, for the opposite half of `drone_killed`'s argument. That one is a process that was there and is not, found by Fleet after the fact. Here the process was still there when Fleet acted: `DroneEvent::Ended` is the Drone's own word that its run is over, and Fleet ends a process it can still see rather than discovering one that has gone.

Not `stalled` or `silent`, which is the trap this row is minted to avoid. Those are Job-level by their own rows' reasoning and they name the *classification of the ending* — what the run reported on its way out. This names the ending itself. Collapsing them would put a Job-level trigger on a step, which `StepLevelTrigger::of` refuses, and would leave the step with nothing to carry.

Not `no_report`. That is a Drone that was told to stop and report and answered nothing — still running, still writing. This one has stopped on its own and said so.

**A Drone that reports its run has ended and then keeps working loses that work.** The reap is what makes the record true, and it is not free: anything a Drone does after its own terminating event is outside what it told Fleet, so a Drone that emits `Ended` and carries on has its process ended and whatever it wrote after that point goes unsubmitted. The alternative was leaving the step `running` and waiting, which is the defect this row closes.

`in_code` is empty rather than "Not yet" for `gate_undecided`'s reason — the row was authored here and has no source value to carry.
"""
why = """
The record should say what is true, and a step marked `running` beneath a Drone whose run has ended is false. It is `drone_killed`'s defect one status over: `#313` found a `running` step under an `escalated` Job with no Drone, and corrected the registry rather than sanctioning the state.

Leaving the step `running` was the alternative and it shipped that way for an hour, on the argument that an idle process is still reachable so a redirect is the cheaper recourse and `restart_step` refuses while a Drone holds the slot. It is refused because it buys the cheap act with a false row: the Drone had already said it was done, so what a redirect reaches is a process outside its own contract, and the step it lands on is one the record claims is being worked. Reaping the Drone frees the slot and makes the `stopped` row honest, which is what gives `restart_step` a target.

Stopping the step with no trigger at all was the other, and is refused on `drone_killed`'s own reasoning: a person opening the Job a week later should find a reason rather than an absence, and `Job::stopped_on` answers the step and the trigger together.
"""

[triggers.silent]
kind = "Sub-kind"
meaning = "Sub-kind of stalled. The Drone process exited normally having called no tool at all. A Drone that did call tools and had every one of them refused is blocked_by_policy instead — the two look identical in the result envelope and take opposite remedies, so the boundary is the tool call and not the empty result."
open_questions = ["What does Fleet accept as proof a Drone did the work, given the result envelope reports success for a run that did nothing?"]
notes = """
No `fleet.verdict`, no `fleet.report`, no question raised — the Drone ran to completion and said nothing. It is a sub-kind of `stalled` rather than its own trigger because the two behave identically: both pause the Job and surface it the same way, differing only in the suggested action.

`stalled` recommends redispatch; `stalled(silent)` recommends rephrase and redispatch, since the brief itself needs work — redispatching it unchanged would reproduce the same silence. A Drone OOM-killed forty seconds into `fix` gives Fleet no signal at all, and redispatch is right; a Drone that runs to completion, finds the brief ambiguous, and stops without calling anything needs the brief rewritten instead.
"""

[triggers.stalled]
kind = "Trigger"
level = "Job"
meaning = "Fleet has no signal despite the Job having been active — the Drone process died mid-work, or the relay never fired."
in_code = "Not yet"
notes = "Detected by the heartbeat/liveness timer, which runs only while the Job is `running` — Drone owns that decision and the reasoning behind it. The response is a poke, then escalation once `poke_limit` is spent. Carries a `silent` sub-kind, which pauses the Job identically and differs only in what the payload recommends.

Job-level: a Drone that stopped producing anything at all is a fact about the Drone, not about the step it happened to be on. `silent` takes its parent's level, since a sub-kind pauses the Job exactly as its parent does."

[triggers.thrashing]
kind = "Trigger"
level = "Step"
meaning = "Active but not converging, as the mid-step look found it."
in_code = "Not yet"
notes = """
Detected mechanically — turn count against the step norm, wall-clock against an expected ceiling, and where `declare_plan_at: step_start` is set, a file-plan-versus-live-diff check. No model judgement is needed to *detect* it.

A mid-step Judge pass runs only once a mechanical trigger fires, never on a schedule. It judges the work product so far, never the Drone's turns. If it finds thrashing, the Drone is force-interrupted with a "stop, report current state now" directive, and this trigger is the finding that directive is injected on.

**Whether the directive was answered is a second detection and a second row.** It read "and the forced report also failed" while one detection produced both; a report that never arrives is `no_report` now, and the two take opposite responses.

Step-level: it is measured against a step's turn count and a step's wall-clock, and the mid-step Judge look judges that step's work product.

Judge owns the routing.
"""

[triggers.would_not_start]
kind = "Trigger"
level = "Job"
meaning = "Everything the spawn needed resolved and the machine still would not start it. No Drone ever ran."
in_code = ""
notes = """
Two paths, both the environment the daemon is running in rather than anything anybody wrote: the transcript would not open on disk, or the harness refused to launch the process. The transcript is opened *before* the Drone deliberately — `crates/fleet/src/spawning.rs` says why — so a disk that will not hold a record stops the spawn instead of losing the record quietly behind a process already producing one.

**The opposite end of `interrupted`, and the pair is worth reading together.** `interrupted` is a process that was there and is not; this is a process that never was. They were one trigger until 2026-08-31 and the verb belonged to the other one.

Not `not_configurable`: there the values were wrong and nothing was asked to start. Here everything resolved and the answer came back no. Configure, then start — the two triggers keep the order the code has, so a reader knows which half to look at.

Job-level, for `not_configurable`'s reason: a step is `running`, and no step is the reason.

Fires the default edge, `running -> escalated`.

`in_code` is empty rather than "Not yet" for `gate_undecided`'s reason — the row was authored here and has no source value to carry.
"""
why = """
`interrupted` sent a person to look for a Drone. There was no Drone, and the two things that produce this — a full or unwritable disk, and a harness that will not launch — are both answered on the machine rather than in the record. A person who trusted the badge would have gone through a transcript that was never opened.
"""
