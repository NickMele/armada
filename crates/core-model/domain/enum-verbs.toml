# The word, the glyph and the colour each enum variant renders as. The
# vocabulary Bridge's generated TypeScript module is built from: codegen joins
# `core-model`'s enum names to this file and emits one module the renderer
# imports, so no surface holds a verb list, a badge map or a copy of the enum
# of its own.
#
# Authored here. This file is the authority on how a variant reads; a page in
# the design workspace that disagrees with it is stale, not right.
#
# Tables nest one level: `[verbs.<enum>.<variant>]`. The inner table key is the
# wire value, so a rule can compare a set here against the Rust enum without a
# mapping in between, and the outer key names which enum that is. A flat map
# could not — `evidence_suspect` is a variant of two enums at once, on two
# different axes, and it is the one collision the nesting exists to hold.
#
# The enums, which `xtask`'s `VOCABULARIES` holds the same list of:
#   job_status                 - where a Job is. Keys match job-statuses.toml
#   queued_reason              - why a queued Job has not started
#   admission_hold             - which one thing is holding the next Drone
#                                back. The finer half of
#                                `queued_reason.waiting_on_resources`, read
#                                fleet-wide rather than per Job
#   resumption                 - which act a person took to put a `queued` Job
#                                back in the queue. Absent on a Job that was
#                                approved and has never run
#   escalation_reason          - why a Job stopped and asked. Keys match
#                                escalation-triggers.toml
#   step_verdict               - the outcome of one workflow step
#   step_state                 - where one step of the frozen WorkflowDef is.
#                                Keys match step-states.toml, and it is the
#                                inner half of the two-level machine
#                                `job_status` is the outer half of
#   advance_gate               - what it takes to advance past one step. No
#                                registry file of its own: the set is three of
#                                the WorkflowDef schema's four, the fourth
#                                being refused where a definition is parsed
#   check_outcome              - how one declared Check ended. Keys match
#                                check-outcomes.toml
#   criterion_verdict_check    - one criterion, as a mechanical Check saw it
#   criterion_verdict_judge    - one criterion, as the Judge saw it
#   criterion_verdict_attested - one criterion, as a person attested it
#   gaming_pattern             - which shape of evidence gaming one flag found.
#                                No registry file of its own either: the set is
#                                what a workflow's `flag_if` may name, and
#                                whether it is fixed at all is open
#   evidence_type              - what one step produces as its work product. No
#                                registry file of its own: the values in use
#                                are named as prose on job-fields.toml's
#                                `evidence_type` row
#   change_kind                - what happened to one file in a Drone's
#                                worktree, as of one reading
#   movement_kind              - what one row of a Job's log says moved: the
#                                Job's own machine, one step of it, or a Drone
#   drone_presence             - whether a Drone arrived on a step or left it.
#                                Presence, not a machine — `assigned_drone` is
#                                a pointer that is set or null
#   silence                    - why the transcript socket closed, told apart
#                                from a transport close, which carries its own
#                                words
#   origin                     - where a Job came from. Keys match the `origin`
#                                row of job-fields.toml, which has no registry
#                                file of its own
#
# **Five of these have no `PAIRINGS` entry in `xtask/src/rules_enums.rs`, so
# the set is declared here and compared against nothing.** `step_verdict` and
# the two unpaired criterion verdicts were already in that position;
# `change_kind`, `movement_kind` and `silence` join them because the enums are
# `crates/ipc`'s and carry a serde derive rather than the `ALL` and `as_wire`
# pair the rule reads. `advance_gate`, `evidence_type`, `step_state` and
# `drone_presence` are paired.
#
# Fields:
#   verb         - what a person reads. Never the enum name
#   icon         - the lucide glyph, keyed to packages/icons/icons.toml
#   status_token - the CSS custom property, defined in packages/tokens/src
#   vocabulary   - the enum this variant belongs to, as the source names it.
#                  Redundant against the outer table key and carried anyway,
#                  for the reason `transitions_in` is: declared intent checked
#                  against what was wired
#   in_code      - whether an implementation exists, as the source recorded it.
#                  Provenance, not fact: it describes v1, which is deleted, so
#                  every "In code" here is false as a claim about this
#                  workspace
#   notes        - the reasoning the row carried
#   verb_and_icon_from
#                - names the enum a variant borrows both from, where it has
#                  neither of its own
#
# An empty `verb`, `icon` or `status_token` is a gap, not a default. The build
# fails where a variant lacks one; the gaps are carried so they are countable.
#
# `verb_and_icon_from` is how a deliberate blank says so. `escalated` renders
# its reason rather than its own name, and declaring that here keeps the
# codegen rule exceptionless — an exception living inside the generator is
# invisible to whoever adds the next variant.
#
# `origin` is the one vocabulary that renders as text rather than as a badge,
# so its rows carry neither glyph nor token by decision and each says so. A
# chip is a status, and where a Job came from is not one —
# `docs/concepts/job-board.md` settled that, and it is also why those verbs are
# capitalised where a badge word is not: the row draws the string as written.
#
# One verb carries a slot. `sub_dispatched` reads `Sub-dispatched by
# job_2d90bb`, and the parent's id is part of what a person reads rather than a
# decoration around a word — so the form lives here whole, spelled `{field}`
# for the Job field it is filled from. `step_verdict.pass` carries a form of an
# older shape and names no field.

