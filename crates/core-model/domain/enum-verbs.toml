status_token = "--status-escalated"
vocabulary = "Escalation reason"
in_code = "Not yet"
notes = "Takes no verb of its own, and shares stalled's badge for the reason silent does. A Drone that reached for the escape hatch unbidden has said it has nothing left to try: the Job stops and waits for a person, which is what a stall does. What differs is the payload — the Drone's own narrative, which is why the reason is worth reading — and a badge of its own would say the Job behaves differently when it does not."

