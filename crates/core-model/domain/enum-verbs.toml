icon = ""
status_token = "--status-escalated"
vocabulary = "Escalation reason"
in_code = "In code"
notes = "Says the one thing a reader has to know before anything else: no process ran, so there is no transcript to go through. That is the whole distance from `interrupted`, whose verb sent people to look for one. `would not` rather than `could not` because both paths are a refusal the machine gave back — a disk that would not hold the transcript, a harness that would not launch — and because `could not start` reads as a diagnosis nobody has made yet. No glyph, for `no_worktree`'s reasons; `unplug` is `interrupted`'s and lending it here would put the same picture on the two states this work exists to separate."

