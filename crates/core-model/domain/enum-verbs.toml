# The word, the glyph and the colour each enum variant renders as. The
# vocabulary Bridge's generated TypeScript module is built from: codegen joins
# `core-model`'s enum names to this file and emits one module the renderer
# imports, so no surface holds a verb list, a badge map or a copy of the enum
# of its own.
#
# Authored here. This file is the authority on how a variant reads; a page in
# the design workspace that disagrees with it is stale, not right.
#
# Tables nest one level: `[verbs.<enum>.<variant>]`. The inner table key is the
# wire value, so a rule can compare a set here against the Rust enum without a
# mapping in between, and the outer key names which enum that is. A flat map
# could not — `evidence_suspect` is a variant of two enums at once, on two
# different axes, and it is the one collision the nesting exists to hold.
#
# The enums, which `xtask`'s `VOCABULARIES` holds the same list of:
#   job_status                 - where a Job is. Keys match job-statuses.toml
#   queued_reason              - why a queued Job has not started
#   escalation_reason          - why a Job stopped and asked. Keys match
#                                escalation-triggers.toml
#   step_verdict               - the outcome of one workflow step
#   check_outcome              - how one declared Check ended. Keys match
#                                check-outcomes.toml
#   criterion_verdict_check    - one criterion, as a mechanical Check saw it
#   criterion_verdict_judge    - one criterion, as the Judge saw it
#   criterion_verdict_attested - one criterion, as a person attested it
#
# Fields:
#   verb         - what a person reads. Never the enum name
#   icon         - the lucide glyph, keyed to packages/icons/icons.toml
#   status_token - the CSS custom property, defined in packages/tokens/src
#   vocabulary   - the enum this variant belongs to, as the source names it.
#                  Redundant against the outer table key and carried anyway,
#                  for the reason `transitions_in` is: declared intent checked
#                  against what was wired
#   in_code      - whether an implementation exists, as the source recorded it.
#                  Provenance, not fact: it describes v1, which is deleted, so
#                  every "In code" here is false as a claim about this
#                  workspace
#   notes        - the reasoning the row carried
#   verb_and_icon_from
#                - names the enum a variant borrows both from, where it has
#                  neither of its own
#
# An empty `verb`, `icon` or `status_token` is a gap, not a default. The build
# fails where a variant lacks one; the gaps are carried so they are countable.
#
# `verb_and_icon_from` is how a deliberate blank says so. `escalated` renders
# its reason rather than its own name, and declaring that here keeps the
# codegen rule exceptionless — an exception living inside the generator is
# invisible to whoever adds the next variant.

[verbs.job_status.awaiting_approval]
verb = "needs approval"
icon = "user-check"
status_token = "--status-awaiting-approval"
vocabulary = "Job status"
in_code = ""
notes = "Carried over from needs_approval when the approval axis became a status. The verb did not move to awaiting approval for symmetry with awaiting review: the badge means a person must act, not that time is passing, and needs is the word that says so."

