notes = "No glyph. The shield-* family is reserved to gates and checks, so the natural candidate sits there."

[verbs.escalation_reason.dependency_failed]
verb = "an upstream failed"
icon = ""
status_token = "--status-escalated"
vocabulary = "Escalation reason"
in_code = "In code"
notes = "Filed as a trigger Aug 2026 with neither a verb nor a glyph, and unreachable until `crates/fleet/src/coupling.rs` began raising it. The verb names what happened to the Job this one waited on rather than anything this Job did, because it did nothing — which is the whole of what a person needs to read here. The article follows `a check timed out`. No glyph: the `shield-*` family is reserved to gates and Checks, so the natural candidate is not this row's to take, and the glyph stays owed beside `blocked_by_policy` and `check_timeout`."

