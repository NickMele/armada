icon = ""
status_token = ""
vocabulary = "Gaming pattern"
in_code = ""
notes = "The enum's word is the one a reader is least likely to know, so the verb spells out what tautological means here instead of shortening it. It also holds the line against `assertion_weakened`: this is a test that cannot fail, not an assertion that asks for less. Neither glyph nor token, for `assertion_weakened`'s reason."

[verbs.gaming_pattern.test_skipped]
