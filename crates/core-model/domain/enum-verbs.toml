[verbs.step_state.advanced]
verb = "advanced"
icon = "check"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "The inner machine's word for what the outer one calls `done`, and it stays the enum's own spelling because the enum's own spelling is already plain English — the same reason `running` and `rejected` keep theirs. `check` is the borrowing `packages/icons/icons.toml` sanctions under `[conventions.step_activity_borrowing]`: the Job glyph that means the same thing one level down, and a rail row that showed a different mark from the badge above it is the collision that convention exists to prevent. No token: the hue is `--step-advanced` in `packages/tokens/src/status.css`, which is its own axis and not a `--status-` stem, so it lands in GAPS the way the two Judge verdicts do. `in_code` is empty because there is no source value to carry: the row was authored here."

[verbs.step_state.awaiting_human]
verb = "awaiting review"
icon = "eye"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "The same words as `job_status.awaiting_review`, because it is the same claim one level down: `step-states.toml` sees this state beneath that status and beneath no other. `awaiting a human` would be a second phrase for one fact, and `waiting on you` would be a third. `eye` for the same reason the words are the same, and it is one of the five glyphs `[conventions.step_activity_borrowing]` names. Iconography's prose says `waiting (clock)` in the paragraph above the one that defers to that convention for the full mapping — `clock` is `queued`'s and the convention does not list it, so the convention is read as the authority and the prose as stale. Reported. No token, for `advanced`'s reason: the hue is `--step-waiting`."

[verbs.step_state.not_started]
verb = "not started"
icon = "circle-dashed"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "Written at Job creation for every step of the frozen WorkflowDef, so it is the state most rail rows are in and the one that must read as ordinary rather than as something withheld. The enum's spelling with its underscore taken out. `circle-dashed`, minted rather than borrowed — see `packages/icons/icons.toml` for the full argument against `circle-dot` and rule 3. It is the fallback `StepActivityMark` draws only where no ordinal reaches it; the ordinal keeps the mark's slot wherever `WorkflowRail` or `StepRow` supplies one, and this glyph must not be read as a reason to take that away. No token by decision rather than by omission — `packages/tokens/src/status.css` says outright that not-started takes no hue and renders in `--fg-subtle`, which `circle-dashed` inherits unchanged."

[verbs.step_state.retrying]
verb = "retrying"
icon = "rotate-cw"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "`rotate-cw` is the single-arrow glyph, deliberately not `refresh-cw`, which `packages/icons/icons.toml` reserves to churning alone. The registry's own note on that row already calls it the proposed step-level retrying mark, so this is the assignment being taken up rather than made. No token: `status.css` says retrying takes no hue and renders in `--fg-muted`."

[verbs.step_state.running]
verb = "running"
icon = "circle-dot"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "The Job glyph one level down, from `[conventions.step_activity_borrowing]`. No token, for `advanced`'s reason: the hue is `--step-running`."

[verbs.step_state.stopped]
verb = "stopped"
icon = "flag"
status_token = ""
vocabulary = "Step state"
in_code = ""
notes = "Retries spent, and neither retrying nor waiting on a person — folding it into either would make a designed human gate and a dead stop render alike, which is `step-states.toml`'s own `why`. The verb stays `stopped` rather than becoming `retries spent`: the count of attempts is on the row beside it, and a verb that stated a cause would say twice what the badge above already says once. `flag` is reserved to this state alone and to nothing else in Armada. No token, and this row is the one place that is a real loss: the state's whole treatment is a surface, `--step-stopped-bg`, rather than a glyph hue, and a `--status-` stem cannot carry it."

