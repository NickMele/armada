status_token = "--status-escalated"
vocabulary = "Escalation reason"
in_code = ""
notes = "Takes no verb of its own. A sub-kind of stalled: the difference is entirely in the suggested action on the payload, rephrase and redispatch rather than plain redispatch. A badge distinguishing them would imply the Job behaves differently, and it does not."

[verbs.escalation_reason.stalled]
