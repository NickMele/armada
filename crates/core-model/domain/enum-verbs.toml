[verbs.escalation_reason.gate_failure]
verb = "stopped at the gate"
icon = "circle-x"
status_token = "--status-escalated"
vocabulary = "Escalation reason"
notes = "Read `failed a check` on `shield-x` until the Judge existed, then `refused by the judge` while `Ruling::Refused` was the only thing that produced it. It is not: `crates/fleet/src/dispatch.rs` raises it from `Ruling::Failed` too — a mechanical Check that failed with its retries spent, which the Judge never saw. A person reading `refused by the judge` on a step whose `judge` row says `not reached` goes looking for a verdict that does not exist, and that was measured on a real Job. The verb names the gate rather than which tier of it, because one trigger carries both and the step's own rows say which tier stopped it. The `meaning` was always right: \"honestly did not pass\" is a refusal rather than gaming, which is `evidence_suspect`."
in_code = "In code"

[verbs.escalation_reason.gate_undecided]
verb = "the gate could not decide"
icon = "circle-minus"
status_token = "--status-escalated"
vocabulary = "Escalation reason"
in_code = ""
notes = "The verb says the gate could not decide rather than that the work failed, which is the whole distinction the trigger carries: `stopped at the gate` is `gate_failure`'s and says the opposite about the same step: that one ran and answered. What could not be read is on the Job's log as `artifact`, and the badge does not try to hold it. `circle-minus`, registered for this trigger on 2026-08-31 and wired here. The shield-* family is reserved to gates and Checks, so the natural candidate sat there — `packages/icons/icons.toml` took the circle-* name back into the Judge family instead, where this is a third outcome beside met and not_met: the Judge could not read the artifact at all, which is neither verdict rendered badly. Drawn in `--fg-subtle` rather than either verdict hue, because the criterion went unjudged rather than judged. `in_code` is empty because there is no source value to carry: the row was authored here."

