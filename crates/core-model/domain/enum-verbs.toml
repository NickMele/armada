[verbs.escalation_reason.blocked_by_policy]
verb = "blocked by policy"
icon = ""
status_token = "--status-escalated"
vocabulary = "Escalation reason"
in_code = "Not yet"
notes = "Names the thing to change rather than what went wrong, because nothing went wrong with the work — the Drone was refused something it needed. The payload carries the refused commands and their inputs, since the fix is a configuration change and the reader needs to know which line to edit. No glyph."

[verbs.escalation_reason.check_timeout]
