notes = "Neither glyph nor token, and that is the vocabulary's decision rather than this row's. A flag is not a status: the Job is escalated with `evidence_suspect` on it, and that badge already carries the hue and the mark, so nine more silhouettes would draw one claim nine times over. `flag` is the obvious candidate and cannot be lent — packages/icons/icons.toml reserves it to a stopped step and says nothing else in Armada may use it. The verb says what happened to the assertion rather than naming the pattern, because the reader is looking at the cited line beside it."

[verbs.gaming_pattern.test_scope_narrowed]
