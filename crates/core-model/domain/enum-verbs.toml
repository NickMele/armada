icon = ""
status_token = ""
vocabulary = "Gaming pattern"
in_code = ""
notes = "`is now skipped` rather than `was skipped`, which reads as the runner having passed over it. The change added the marker, and that a test used to run is the whole finding — one skipped before this change is not flagged. Neither glyph nor token, for `assertion_weakened`'s reason."

[verbs.gaming_pattern.test_deleted]
