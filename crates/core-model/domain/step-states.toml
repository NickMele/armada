# The state of one step of a Job's frozen WorkflowDef.
#
# Authored here. Carried across from the design workspace's Step States
# database, which is the record of the decision and the reasoning that
# produced it, not the authority on the current set — a page there that
# disagrees with this file is stale, not right.
#
# The table key is the wire value, so a rule can compare this set against
# the enum `core-model` will hold without a mapping in between. Job's `state`
# column on `job_steps` takes its values from here, and nothing else does.
#
# `seen_under` names the Job statuses a step in this state is observed under.
# Every name in it must be a key in job-statuses.toml, and the set must be the
# transpose of `step_states` there — one relation written twice, read as one by
# `cargo xtask verify-foundations`. Both halves had gone stale before anything
# read either. Why nearly every state is seen beneath nearly every status is on
# job-statuses.toml's own header: a frozen step crosses an unguarded edge
# holding what it held. `completed_success` is absent from four of these rows
# because every edge arriving there is guarded on `every_step_advanced`, so a
# step in any other state cannot be carried across one. `awaiting_repair` is
# absent from exactly one — `running` — for the mirror-image reason: its single
# inbound edge is guarded on `no_step_running`, so a step still being worked
# cannot be carried into it. #208.
#
# Fields:
#   meaning    - what the state asserts about the step
#   seen_under - the Job statuses this state appears beneath
#   in_code    - whether an implementation exists, as the source recorded it
#   notes      - the reasoning the row's page carried

[states.advanced]
meaning = "The step passed its advance gate"
seen_under = ["awaiting_approval", "awaiting_attestation", "awaiting_repair", "awaiting_review", "completed_failed", "completed_success", "escalated", "killed", "piloted", "queued", "rejected", "running", "superseded"]
in_code = "Not yet"
notes = """
Reached a second way, from `stopped`, when a person overrules the gate that refused it. The state is the same and the verdict is not: an overridden step keeps `failed(<trigger>)`, so a step the gate cleared and a step a person cleared over the gate are told apart by the pair and never by the state alone.

**Left a second way too, and it is the only backward move in the machine.** `advanced -> running` is a loop return: a later step's `verdict_routing` sends the work back here and the step is redone as the workflow designed. Not a retry — nothing failed — so it moves `iteration_count` and never the retry budget. `StepTarget::Returned` is the only target that walks the edge; a plain dispatch across it is the redispatch `fleet::resume` refuses, and it is refused here too. #263.
"""

[states.awaiting_human]
meaning = "The step's advance gate is a human gate, and it is open"
seen_under = ["awaiting_review"]
in_code = "Not yet"

[states.not_started]
meaning = "Written at Job creation for every step of the frozen WorkflowDef"
seen_under = ["awaiting_approval", "awaiting_attestation", "awaiting_repair", "awaiting_review", "completed_failed", "escalated", "killed", "piloted", "queued", "rejected", "running", "superseded"]
in_code = "Not yet"

[states.retrying]
meaning = "The step failed and is being reattempted inside its retry budget"
seen_under = ["awaiting_approval", "awaiting_attestation", "awaiting_repair", "awaiting_review", "completed_failed", "escalated", "killed", "piloted", "queued", "rejected", "running", "superseded"]
in_code = "Not yet"
notes = "This row said `running` alone until the transpose was read against the machine. A Job does not stop moving because a step is between attempts: whatever freezes it — a kill, an escalation, an approval sent back — freezes the step mid-retry, and a frozen step is never cleared. See job-statuses.toml's header."

[states.running]
meaning = "The step is being worked"
seen_under = ["awaiting_approval", "awaiting_attestation", "awaiting_review", "completed_failed", "escalated", "killed", "piloted", "queued", "rejected", "running", "superseded"]
in_code = "Not yet"
notes = "**The one row narrowed by a guard other than `every_step_advanced`.** `running -> awaiting_repair` is admitted only where no step is being worked, so a Job held for repair never holds a `running` step — the gate stops it first, which is #179's finding and #208's edge."

[states.stopped]
meaning = "Retries spent"
seen_under = ["awaiting_approval", "awaiting_attestation", "awaiting_repair", "awaiting_review", "completed_failed", "escalated", "killed", "piloted", "queued", "rejected", "running", "superseded"]
in_code = "Not yet"
notes = "The step's retries are spent; it is neither retrying nor waiting on a person."
why = "Folding it into `retrying` or `awaiting_human` would make a designed human gate and a dead stop render alike."
