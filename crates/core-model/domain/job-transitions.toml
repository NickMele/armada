# Every legal edge of the Job status machine, and what fires it.
#
# Authored here. Carried across from the design workspace's Job Transitions
# database, which is the record of the decision and the reasoning that
# produced it, not the authority on the current set — a page there that
# disagrees with this file is stale, not right.
#
# An array of tables rather than one table per edge, because an edge has no
# name of its own that a Rust identifier could carry — `from` and `to` are
# the whole identity. That is also what makes this file checkable without
# heuristics: `from` and `to` are each a key in job-statuses.toml, verbatim,
# and `escalation_trigger` is a key in escalation-triggers.toml. A rule needs
# a set lookup and nothing else.
#
# Fields:
#   from               - the status the Job leaves. A key in job-statuses.toml
#   to                 - the status it arrives at. A key in job-statuses.toml
#   on                 - what fires the edge. Absent where the source left it so
#   escalation_trigger - the named trigger, where the edge belongs to one.
#                        A key in escalation-triggers.toml
#   guard              - the condition the edge is admitted under, where it
#                        carries one. A key in transition-guards.toml. Absent
#                        is unconditional, which every edge was before #189
#   in_code            - whether an implementation exists, as the source recorded it
#   notes              - the reasoning the row's page carried

[[transitions]]
from = "awaiting_approval"
to = "killed"
on = "Cleared from the Board — an operator act, carrying no verdict"
in_code = "Not yet"

[[transitions]]
from = "awaiting_approval"
to = "queued"
on = "Dispatch approved, including a re-approved widening"
in_code = "Not yet"

[[transitions]]
from = "awaiting_approval"
to = "rejected"
on = "Approval denied — a verdict on the work"
in_code = "Not yet"

[[transitions]]
from = "awaiting_attestation"
to = "completed_failed"
on = "The outside action cannot be done"
in_code = "Not yet"

[[transitions]]
from = "awaiting_attestation"
to = "completed_success"
on = "Attested"
guard = "every_step_advanced"
in_code = "Not yet"

[[transitions]]
from = "awaiting_attestation"
to = "killed"
in_code = "Not yet"

[[transitions]]
from = "awaiting_attestation"
to = "piloted"
in_code = "Not yet"

[[transitions]]
from = "awaiting_review"
to = "awaiting_attestation"
on = "approve, with a criterion still owed outside"
in_code = "Not yet"

[[transitions]]
from = "awaiting_review"
to = "completed_success"
on = "approve on the final gate"
guard = "every_step_advanced"
in_code = "Not yet"
notes = "The step at a human gate stays `running`, so approving advances it and then moves the Job. The guard is why that order is the only one: the inner machine freezes the moment the Job leaves the gate."

[[transitions]]
from = "awaiting_review"
to = "escalated"
on = "The Drone dies during the gate"
escalation_trigger = "interrupted"
in_code = "Not yet"

[[transitions]]
from = "awaiting_review"
to = "killed"
in_code = "Not yet"

[[transitions]]
from = "awaiting_review"
to = "piloted"
in_code = "Not yet"

[[transitions]]
from = "awaiting_review"
to = "queued"
on = "approve, with a step still to run"
in_code = "Not yet"
notes = "Approving does not resume in place. The gate holds no Drone and freed the working slot when it opened, so the slot may be another Job's by the time a person answers — the approved Job goes back in the queue and waits its turn. `queued`'s own row already allows for it: the step machine is frozen where it stood, not initialised. The step at the gate is advanced and the next one entered before this move, because the inner machine freezes the moment the Job leaves the gate."

[[transitions]]
from = "awaiting_review"
to = "rejected"
on = "reject"
in_code = "Not yet"
notes = "The only gate verdict that writes a terminal Job status."

[[transitions]]
from = "awaiting_review"
to = "running"
on = "approve, advancing; or request_changes, routing to a step"
in_code = "Not yet"
notes = "`request_changes` increments `iteration_count` on the gate step. The three gate verdicts and what each does are defined on Workflow under Advance Gate; where each lands on this record is on the `last_verdict` field row."

[[transitions]]
from = "escalated"
to = "completed_failed"
on = "A person accepts the failure as the outcome"
in_code = "Not yet"

[[transitions]]
from = "escalated"
to = "killed"
in_code = "Not yet"
notes = "Includes rephrase-and-redispatch, which kills this Job and creates a new one carrying `redispatched_from`. This row said **there is no edge back to `queued`** until #50 made `concurrency-cap` a real bound: a restart and an override each put a Drone back on a Job, and doing that from here spent no slot and consulted no cap. The edge below is that reversal — the two acts re-queue, and admission is the only thing that starts a Drone."

[[transitions]]
from = "escalated"
to = "piloted"
on = "Pilot — the primary action on an escalated Job"
in_code = "Not yet"

[[transitions]]
from = "escalated"
to = "queued"
on = "restart_step, or override_verdict with a step left to run"
in_code = "Not yet"
notes = "**A person decides here and Fleet chooses the moment**, which is the shape `awaiting_review -> queued` already has: the act is accepted whether or not `concurrency-cap` has room, the Job waits at `queued` with `waiting_on_resources` as its reason, and admission spawns. It is not `running`, for the reason `awaiting_review -> running` is not taken by `request_changes`: a Job put back to `running` with no process on it escalates as `interrupted` a moment later. The step machine moves differently for the two acts. An override records `stopped -> advanced` **here**, beneath `escalated`, because that move is the person's verdict and nothing else can make it for them — the one exception `step_machine.rs` names to the freeze rule. A restart records no step move at all: entering `running` is what `store::attempt` counts as a run of a step, so it is deferred to the spawn, and the step reads `stopped` while it waits."

[[transitions]]
from = "escalated"
to = "running"
on = "A redirect: context injected mid-step, without a step restart"
in_code = "Not yet"
notes = "**A redirect only**, since #50's follow-on. It is the one act on an escalated Job that spawns nothing — the Drone is there holding its session — so it needs no slot and consults no bound. A restart and an override take the `queued` edge above."

[[transitions]]
from = "piloted"
to = "completed_success"
on = "Attest complete, under the human-attested verification source"
guard = "every_step_advanced"
in_code = "Not yet"
notes = "Attesting is a verdict on the work and not a way past the steps. A pilot whose steps have not all advanced submits for verification — `piloted -> running` — and advances them there."

[[transitions]]
from = "piloted"
to = "killed"
in_code = "Not yet"

[[transitions]]
from = "piloted"
to = "running"
on = "Submit for verification. Fleet runs the step's gates with no Drone"
in_code = "Not yet"
notes = "Fleet invokes Checks itself and the Judge reads the diff, so `assigned_drone` is null. See the `running` status row."

[[transitions]]
from = "piloted"
to = "superseded"
on = "Close as superseded"
in_code = "Not yet"

[[transitions]]
from = "queued"
to = "awaiting_approval"
on = "A widening declared before dispatch"
in_code = "Not yet"

[[transitions]]
from = "queued"
to = "escalated"
on = "An upstream reached a terminal status other than completed_success"
escalation_trigger = "dependency_failed"
in_code = "Not yet"
notes = "`superseded` is the exception: an upstream reaching it unblocks the dependent and surfaces it, rather than escalating."

[[transitions]]
from = "queued"
to = "killed"
in_code = "Not yet"

[[transitions]]
from = "queued"
to = "running"
on = "A Drone spawns: headroom free, dependencies satisfied"
in_code = "Not yet"

[[transitions]]
from = "running"
to = "awaiting_approval"
on = "A widening"
in_code = "Not yet"
notes = "Narrowing proceeds unchallenged and stays `running`. Only a widening returns to the gate."

[[transitions]]
from = "running"
to = "awaiting_attestation"
on = "The work landed; a criterion needs an action outside Armada"
in_code = "Not yet"

[[transitions]]
from = "running"
to = "awaiting_review"
on = "The current step's advance gate is a human gate"
in_code = "Not yet"

[[transitions]]
from = "running"
to = "completed_failed"
on = "Retries exhausted. At M1, a failed Check"
guard = "no_step_running"
in_code = "Not yet"
notes = "The step that failed is stopped and carries its verdict before the Job ends — #156 made `gate_undecided` do that and #179 found the failure path had not. The guard is on this edge alone: `escalated -> completed_failed` is a person accepting a `stalled` Job's failure and legitimately holds a `running` step, so `completed_failed`'s `step_states` does not narrow behind it."

[[transitions]]
from = "running"
to = "completed_success"
on = "Last step advanced, every criterion verified"
guard = "every_step_advanced"
in_code = "Not yet"
notes = "`on` says \"last step advanced\" and the guard says every step, which is the same claim made checkable: the steps are worked in order, so the last one advances only after the ones before it did, and \"every\" is the form a predicate over the rows can hold."

[[transitions]]
from = "running"
to = "escalated"
on = "Any escalation trigger fires"
in_code = "Not yet"
notes = "The default edge for the escalation trigger enum. A trigger with no edge of its own fires this one."

[[transitions]]
from = "running"
to = "killed"
in_code = "Not yet"

[[transitions]]
from = "running"
to = "queued"
on = "The step just advanced is one that dispatched Jobs, and the next step waits for them"
in_code = "Not yet"
notes = "The reversal of `queued -> running`, and it exists for the working slot rather than for the work. A Job whose next step rolls up its children cannot hold a slot while it waits, because the children need the slot to finish at all — at a concurrency bound of two, a parent and one child fill it. So the parent's Drone stands down, the Job goes back in the queue, and admission holds it there until every child is terminal. `#215`. It is not an escalation: nothing is wrong and nobody is being asked for anything. It is not `awaiting_review` either, which would put the Job on a person's list for a wait that resolves on its own."

[[transitions]]
from = "running"
to = "piloted"
on = "escape_hatch, on a Job Fleet marked for the handoff"
in_code = "Not yet"
notes = "An unmarked pull does not fire this edge. Fleet refuses it and the Job escalates as `hatch_unbidden`, on the default edge."
