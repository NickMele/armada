# The verb, the glyph and the binding every act in Bridge carries. The artifact
# `docs/contracts/design-system.md` promises under "One artifact, three
# columns", and the source the two key-map blocks under "Two tiers" are
# transcribed from.
#
# Authored here. This file is the authority on what an act is called and what
# it is bound to. The contract's blocks are the same map written for a design
# session to paste, and the gate fails where the two disagree.
#
# **The glyph is a reference, never a copy.** `icon` names a key in
# `packages/icons/icons.toml`, which stays the authority on what a silhouette
# may mean and what it may never be reused for; a second roster of glyphs here
# is the drift this repository has collected before. The same holds against
# `enum-verbs.toml`, which carries the word a *state* renders as. Nothing there
# is an act and no key is spelled in both files — `killed` is a badge, `kill`
# is this file's.
#
# The table key is the id an implementation binds to. `shortcut` is the binding
# spelled exactly as the contract spells it, so a rule compares the two with no
# mapping in between: `⌘1–⌘5` is one row rather than five because the contract
# makes the rule rail order rather than the digits, and five rows would fix an
# assignment it refuses to fix.
#
# Fields:
#   kind        - Action | Motion. A Motion moves the cursor, appears in no
#                 palette and so carries no glyph. Every other row is an act
#   tier        - Global | Contextual
#   verb        - what a person reads, in the lexicon's word. Never the id
#   icon        - a glyph key in packages/icons/icons.toml
#   icon_absent - why the glyph column is empty where it is. `undecided`, or
#                 `by design` where a document decided this act carries none.
#                 An Action with neither a glyph nor a reason fails the gate
#   shortcut    - the binding, as the contract's map spells it
#   scope       - where the binding is offered: anywhere | list |
#                 list and detail | detail | job board | piloted job
#   destructive - whether it ends or overrules a Job's record
#   confirms    - whether it takes a confirmation. Destructive implies it
#   unbuilt     - the issue that builds the act, on a row Bridge cannot answer
#                 yet. Absent means live. The gate refuses anything here that
#                 is not an issue reference, and the contract's map annotates
#                 the same rows `not built`
#   notes       - the reasoning the row carries
#
# `icon_absent = "undecided"` is a gap, not a default: no registered glyph
# means the act, and inventing one is a decision that belongs in the icon
# registry rather than here. The gate counts the rows carrying it; what a new
# action may not do is ship without either.
#
# **`unbuilt` is the other kind of blank, and it is not a gap.** This file was
# transcribed from a map settled by drawing the Board and the palette together,
# so it holds acts nobody has written — `p` and `s` when it landed, and job
# detail's bindings since. The palette displays a binding beside every entry,
# which makes a row nothing answers a key a person will press; the alternative
# to a column is a list of them in `apps/`, which is the second registry this
# file exists to prevent. A row loses the field in the change that builds it.

# ------------------------------------------------------------------ global

[actions.command_palette]
kind = "Action"
tier = "Global"
verb = "Command palette"
icon = ""
icon_absent = "undecided"
shortcut = "⌘K"
scope = "anywhere"
destructive = false
confirms = false
notes = "The palette is the discovery surface for every other row here, and it is the one row that cannot be discovered inside it. `search` was not taken: the registry gives it to the search control, and the palette is a superset of the UI rather than a search over a list."

[actions.bridge_surfaces]
kind = "Action"
tier = "Global"
verb = "Bridge surfaces"
icon = ""
icon_absent = "by design"
shortcut = "⌘1–⌘5"
scope = "anywhere"
destructive = false
confirms = false
notes = "One binding over the rail rather than five over five destinations — the contract's rule is rail order, not the numbers, and the digits shift if the rail does. They shifted on 2026-09-03: Held worktrees joined the rail as its fifth surface and took ⌘5, so this range grew by a digit and Helm moved off it. Each destination carries its own navigation glyph in the icon registry, so a glyph on this row would be a sixth one standing for all of them."

[actions.helm]
kind = "Action"
tier = "Global"
verb = "Helm"
icon = "message-square"
shortcut = "⌘6"
scope = "anywhere"
destructive = false
confirms = false
notes = "The digit after the last Bridge surface, and a sibling surface rather than a sixth Bridge one. It read ⌘5 until 2026-09-03, when Held worktrees became the fifth surface: the rail reads in order and the newest surface goes last, so the four surfaces used most keep the keys people know and this is the one key that moves. Moved now, while one person is using it, rather than left to be moved when more are — and the palette displays the binding beside every entry, which is how anyone would notice. The glyph is the registry's own assignment for Helm."

[actions.toggle_sidebar]
kind = "Action"
tier = "Global"
verb = "Toggle sidebar"
icon = ""
icon_absent = "undecided"
shortcut = '⌘\'
scope = "anywhere"
destructive = false
confirms = false
notes = "No panel glyph is registered. The 48px rail is reachable by ⌘-digit without labels, which is why hiding it costs little."

[actions.history]
kind = "Action"
tier = "Global"
verb = "Back / forward"
icon = ""
icon_absent = "undecided"
shortcut = "⌘[ ⌘]"
scope = "anywhere"
destructive = false
confirms = false
notes = "One row for a pair, because the two are one act with a direction. `chevron-left` is not registered and `chevron-right` is reserved to expand and collapse, so neither half has a glyph to take."

[actions.close]
kind = "Action"
tier = "Global"
verb = "Close"
icon = "x"
shortcut = "Esc"
scope = "anywhere"
destructive = false
confirms = false
notes = "Closes an overlay, or returns to the list from a detail route. `x` is the badge set's system-failure mark and the registry already carries its second reading: as chrome it is the dialog close, unchanged."

# -------------------------------------------------------------- contextual

[actions.move_focus]
kind = "Motion"
tier = "Contextual"
verb = "Move focus"
icon = ""
shortcut = "j / k / ↓ / ↑"
scope = "list and detail"
destructive = false
confirms = false
notes = "The two navigation keys the destructive-key rule is measured against. A list is a listbox and already roves on the arrows; j and k are here because nothing else claims them. The scope covers detail because the run tree and the activity log are listboxes too — moving between steps and moving between rows are one act, and a second pair of keys for it would be the ⌘F deletion made again. #265 builds the detail half."

[actions.open_focused]
kind = "Motion"
tier = "Contextual"
verb = "Open the focused job"
icon = ""
shortcut = "Enter"
scope = "list"
destructive = false
confirms = false
notes = "Acts on nothing, which is what makes it a motion rather than a second Open. Enter belongs to whatever holds focus first — a row, a button — and this is what it means when none of them does."

[actions.open]
kind = "Action"
tier = "Contextual"
verb = "Open"
icon = ""
icon_absent = "undecided"
shortcut = "o"
scope = "list"
destructive = false
confirms = false
notes = "The same act as Enter, named so the palette can display it — which is the whole reason it has a row of its own. `external-link` is not it: that hands a path to something outside Bridge."

[actions.review]
kind = "Action"
tier = "Contextual"
verb = "Review"
icon = "eye"
shortcut = "r"
scope = "list"
destructive = false
confirms = false
notes = "The most-pressed contextual key on the Board: review is on every needs-you row, which is why it holds `r` and redirect moved to `d`. The glyph is reserved to Review and to nothing else. Narrowed from \"list and detail\" by #624: the detail half was never built — nothing in packages/screens binds it — and Job detail's review sits inline in the panel once the Job is open, with no separate thing left for a key to open. Freed `r` at detail scope for `run`, below."

[actions.run]
kind = "Action"
tier = "Contextual"
verb = "Run"
icon = ""
icon_absent = "undecided"
shortcut = "r"
scope = "detail"
destructive = false
confirms = false
notes = "Opens the run sheet — Journey 9's *Running one inside a Job* — nothing selected. Also opened by **Run…** on the worktree row of *Where things are* and by **Run it here** on a refused Check's row, neither of which is this binding: a control that already reads as an act does not need a second one repeated on it. No glyph — the sheet is not a Check and not evidence, so nothing in the `shield-*` or `file-*` families reads for it, and inventing one is a decision for packages/icons/icons.toml."

[actions.attest]
kind = "Action"
tier = "Contextual"
verb = "Attest"
icon = "stamp"
shortcut = "t"
scope = "list and detail"
destructive = false
confirms = false
notes = "The glyph is the registry's awaiting-attestation badge, and the act is what the badge is waiting for. A stamp is literally what an attestation performs."

[actions.redirect]
kind = "Action"
tier = "Contextual"
verb = "Redirect"
icon = "corner-up-right"
shortcut = "d"
scope = "list and detail"
destructive = false
confirms = false
notes = "`d` rather than the initial, because `r` is spent on Review. The glyph is the registry's own assignment for Redirect."

[actions.approve]
kind = "Action"
tier = "Contextual"
verb = "Approve"
icon = ""
icon_absent = "undecided"
shortcut = "a"
scope = "dispatch card"
destructive = false
confirms = false
notes = "The one act that approves, and the only place it happens. Nothing on a list approves — the Board's needs-approval row carries Review, and #217 records that the held-key rule moved here with the act: `a` acts once and needs releasing, because a queue approved by holding one key is what the one-job-one-decision rule exists to prevent. Scoped rather than global for that reason: a binding that approves must not be live on a surface showing fourteen approvable rows."

[actions.restart_step]
kind = "Action"
tier = "Contextual"
verb = "Restart step"
icon = ""
icon_absent = "undecided"
shortcut = "s"
scope = "detail"
destructive = false
confirms = false
notes = "`rotate-cw` is Redispatch and `refresh-cw` is reserved to churning, so the two rotation glyphs are both spoken for. Restarting one step is neither. Carries no `unbuilt`: Bridge has this act — `Acts.tsx` fires `restart_step` from the step panel and has since #62. What it has no keyboard path to is a different thing from what it cannot do, and #233 read the missing binding as a missing act."

[actions.pilot]
kind = "Action"
tier = "Contextual"
verb = "Pilot"
icon = "terminal"
shortcut = "p"
scope = "list and detail"
destructive = false
confirms = false
unbuilt = "#250"
notes = "The glyph is reserved to Pilot. Once the terminal has focus every keystroke belongs to it and this tier is suspended; only Esc Esc releases it — a safety rule written against an act that does not exist yet, which is what #233 found. #250 is the control; the handover the exemption describes is #255's three exits."

[actions.copy_debug_info]
kind = "Action"
tier = "Contextual"
verb = "Copy debug info"
icon = ""
icon_absent = "by design"
shortcut = "c"
scope = "list and detail"
destructive = false
confirms = false
notes = "The contract decides the blank: nothing in the error treatment carries a glyph, and `triangle-alert` and `octagon-alert` are both spoken for. `copy` was not taken either — it means copy an id or a path, and a debug payload is an artifact rather than a value. Widening it is a decision for the icon registry."

[actions.report_job]
kind = "Action"
tier = "Contextual"
verb = "Report this job"
icon = ""
icon_absent = "undecided"
shortcut = "b"
scope = "detail"
destructive = false
confirms = true
notes = "`b` for bug, and never `r` or `t`, which review and attest hold. The act moves nothing — it records what a person concluded about a Job that already stopped, and leaves the Job exactly where it was — so it is not destructive; it confirms because `b` opens the filing dialog rather than filing anything. Bridge has had it since the reports surface landed, and it reached this registry late: `Report.tsx` renders it as a ghost control in the Job header on the stopped render, which is why the scope is detail and not the list. The glyph is undecided: `flag` reads as the stopped step's badge and `triangle-alert` and `octagon-alert` belong to the error treatment, so a silhouette for filing is a decision for packages/icons/icons.toml."

[actions.kill]
kind = "Action"
tier = "Contextual"
verb = "Kill"
icon = "power"
shortcut = "x"
scope = "list and detail"
destructive = true
confirms = true
notes = "`x` and never `k`, because `k` sits against `j` and a mistyped navigation keystroke must not end a running job. The glyph is the registry's deliberate-stop mark, which is what kill is against unplug's connection lost."

[actions.kill_and_redispatch]
kind = "Action"
tier = "Contextual"
verb = "Kill & redispatch"
icon = ""
icon_absent = "undecided"
shortcut = "X"
scope = "detail"
destructive = true
confirms = true
unbuilt = "#291"
notes = "Shifted `x`, because kill is `x` and this is the same act carried further — a spare letter would be one chosen for convenience, which is what the destructive-key rule refuses. **It is not `kill` followed by `redispatch`**: one confirmation, one outcome, and the Drone's learnings are captured in between. The journey record names it — 3.5 retired `Rephrase and redispatch` in favour of it, and Helm carries it as rung 2 — and nothing answers it yet. The glyph is undecided because `power` is kill's and `rotate-cw` is redispatch's, and a compound is a decision for packages/icons/icons.toml."

[actions.new_job]
kind = "Action"
tier = "Contextual"
verb = "New job"
icon = ""
icon_absent = "undecided"
shortcut = "n"
scope = "anywhere"
destructive = false
confirms = false
notes = "The one contextual key that acts on nothing on screen, which is why its scope is anywhere rather than the list it is pressed on. `send` is Dispatch and this composes rather than dispatches — the dispatch card is between them."

[actions.search]
kind = "Action"
tier = "Contextual"
verb = "Search"
icon = "search"
shortcut = "/"
scope = "list"
destructive = false
confirms = false
notes = "⌘F was deleted for this one: two bindings for one act break the one-artifact rule. A text match is not a state, so it reads every job whatever the state filter is set to."

[actions.state_filter]
kind = "Action"
tier = "Contextual"
verb = "State filter"
icon = "filter"
shortcut = "1–6"
scope = "job board"
destructive = false
confirms = false
notes = "One row for the six tabs, in tab order, for the reason ⌘1–⌘5 is one row. `1`–`6` and `⌘1`–`⌘5` are different acts on one row of keys, separated by the modifier and drawn that way deliberately. Cleared joined as the sixth tab on 2026-09-09, split out of Finished so a reclaim would not read as though it did nothing."

[actions.observe]
kind = "Action"
tier = "Contextual"
verb = "Observe"
icon = ""
icon_absent = "undecided"
shortcut = "v"
scope = "detail"
destructive = false
confirms = false
notes = "`eye` is the obvious glyph and is reserved to Review, so observing has none. The two acts are close enough that sharing a silhouette would be the collision the reservation exists to prevent."

[actions.submit_for_verification]
kind = "Action"
tier = "Contextual"
verb = "Submit for verification"
icon = ""
icon_absent = "undecided"
shortcut = "u"
scope = "piloted job"
destructive = false
confirms = false
notes = "Hands a piloted job back to the machinery that checks it. `file-check` is a badge for a submission that landed rather than a control that submits one, and `send` is Dispatch."

[actions.redispatch]
kind = "Action"
tier = "Contextual"
verb = "Redispatch as a new job"
icon = "rotate-cw"
shortcut = "e"
scope = "list and detail"
destructive = false
confirms = false
notes = "The glyph is the registry's own assignment for Redispatch — a single arrow, distinct from the two chasing arrows that mean churning. The long verb is deliberate: a redispatch makes a new Job with a new id, and the short form read as a retry of the Job in front of you. `Kill & Redispatch` is a different act and is not this row."

[actions.disclose]
kind = "Action"
tier = "Contextual"
verb = "Expand and collapse"
icon = "chevron-right"
shortcut = "h / l / ← / →"
scope = "detail"
destructive = false
confirms = false
notes = "One act, not two. A step's facts and a log entry's payload both open in place beneath the focused row, and giving each its own key would put two bindings on one gesture. The keys mirror `move_focus` on the other axis — a tree discloses sideways and roves vertically — and the glyph is the icon registry's own word for it, taken under the reservation's tree reading rather than its record reading: the run tree is a tree, and a Job row still does not grow a caret, which is why the scope is detail and not the list."

[actions.focus_chapter]
kind = "Motion"
tier = "Contextual"
verb = "Move between chapters"
icon = ""
shortcut = "[ ]"
scope = "detail"
destructive = false
confirms = false
notes = "A Motion: it lands somewhere and acts on nothing, which is what `j`/`k` cannot do here — those rove inside whichever chapter has focus. Unmodified brackets against ⌘[ ⌘] for back and forward, which is `1–5` against `⌘1–⌘5` again: one row of keys, two acts, separated by the modifier and drawn that way on purpose. Reading order, so `]` goes down the screen."

[actions.open_log]
kind = "Action"
tier = "Contextual"
verb = "Open the log"
icon = ""
icon_absent = "undecided"
shortcut = "L"
scope = "detail"
destructive = false
confirms = false
notes = "The step's activity log, opened to the layer that can hold it — 1676 entries on a real Job, which is not a longer version of anything the panel holds. `L` and not `Enter`, changed 2026-09-08. The old binding argued that every mnemonic letter was spent and that `Enter` already belonged to whatever holds focus; both were true of the lowercase set and neither is true of the shifted one, where `X` has held shifted-`x` since kill & redispatch landed. What `Enter` cost was that job detail grew a second chapter with a reading behind it — a Check's output — and one `Enter` cannot open both: which of them answered depended on which chapter `[` `]` happened to land on, a binding nobody can learn, drawn as `Enter` twice in one story. Shifted rather than plain, because lowercase `l` is `disclose` — the expand half of `h`/`l` — and a mistyped motion key must not open a layer. `open_focused` keeps `Enter` on the list, where nothing else holds focus. No glyph — `list` and `file-text` are not registered, and inventing one belongs in the icon registry rather than here."

[actions.open_output]
kind = "Action"
tier = "Contextual"
verb = "Open the output"
icon = ""
icon_absent = "undecided"
shortcut = "o"
scope = "detail"
destructive = false
confirms = false
notes = "A Check's own stdout, opened to the layer that can hold it — 2,180 lines on a real suite, which is the third reading on this screen with no end, after the activity log and the patch. Added 2026-09-08 with the Checks chapter: a chapter that opens a sheet gets a letter, which `open_diff` established with `f`, and this one had none. `o` rather than a spare letter because it is the mnemonic and it is free here — `open` holds `o` on the list, where this act does not exist, so the two never contend for one press. No glyph — the `shield-*` family is a Check's result rather than its output, and minting one belongs in the icon registry rather than here."

[actions.open_diff]
kind = "Action"
tier = "Contextual"
verb = "Open the diff"
icon = "file-diff"
shortcut = "f"
scope = "detail"
destructive = false
confirms = false
notes = "The focused Produced chip, opened to what the step actually wrote. `f` for the file, since `d` is Redirect and `o` is Open, which on a list means a Job — this opens a file inside one and the two must not read as the same key doing different things. The glyph was registered for this row."

[actions.raise_cost_cap]
kind = "Action"
tier = "Contextual"
verb = "Raise the cost cap"
icon = ""
icon_absent = "undecided"
shortcut = "B"
scope = "detail"
destructive = false
confirms = true
notes = "The first of two budget rows in this registry, added 2026-09-09 with the act; `raise_turn_cap` is the other ceiling. A job past its cost cap waits at `queued` reading `over_budget` until somebody raises the cap — the one reason a queued job carries that does not clear on its own — and there was no key, no route and no control for it. Shifted `B`, on `open_log`'s precedent: the lowercase mnemonic is spent, `b` being `report_job`, and a budget is the one thing on this screen where the mnemonic is worth reaching for. Shifted rather than a spare letter for the reason `kill_and_redispatch` takes `X`: a letter chosen for convenience is what the destructive-key rule refuses, and this one changes what a job may spend. Not destructive — nothing is ended or overruled, and the job stays exactly where it was — and it confirms because `B` opens a dialog that collects the figure, which is the field-collecting exception the safety rules name. No glyph: `arrow-up-to-line` is the escalation reason `loop_cap`, a ceiling that stopped something, which is the opposite reading, and the registry has no coin, wallet or currency silhouette at all. Minting one is a decision for packages/icons/icons.toml."

[actions.raise_turn_cap]
kind = "Action"
tier = "Contextual"
verb = "Raise the turn cap"
icon = ""
icon_absent = "undecided"
shortcut = "T"
scope = "detail"
destructive = false
confirms = true
notes = "The second budget row, added 2026-09-09 with the act, and the ceiling the row above did not cover. A job past its turn cap waits at `queued` reading `over_budget` exactly as one past its cost cap does — and until this there was no key, no route and no number below a compile-time constant, so pressing `B` on such a job raised a ceiling that was not holding it. `T` for turns, uppercase on `raise_cost_cap`'s precedent: `t` is Attest, and a ceiling is worth reaching for a mnemonic rather than taking a spare letter. Not destructive, and it confirms because `T` opens a dialog that collects the figure. No glyph, for the row above's reason and one of its own: `arrow-up-to-line` is the escalation reason `loop_cap`, which is a ceiling that stopped something, and drawing it on the control that clears one inverts it."

[actions.open_stage]
kind = "Action"
tier = "Contextual"
verb = "Open the stage"
icon = ""
icon_absent = "undecided"
shortcut = "g"
scope = "detail"
destructive = false
confirms = false
notes = "The phase strip's stages are controls: opening one says what that stage is, what it is waiting on and where it stands, so the explanation sits where the question is asked. `g` for the gate the strip draws. No glyph, and this one may never take a generic one — every stage already carries its own mark on its chip, so a silhouette standing for any stage would be a mark competing with the four beneath it. The obvious candidates are refused anyway: the circle-* family is the Judge's, and a question mark inside a circle is that family's outline whatever it is named."
