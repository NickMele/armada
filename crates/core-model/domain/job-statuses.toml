# Where a Job is. The status column on the `jobs` table, and the outer half
# of the two-level machine whose inner half is step-states.toml.
#
# Authored here. Carried across from the design workspace's Job Statuses
# database, which is the record of the decision and the reasoning that
# produced it, not the authority on the current set — a page there that
# disagrees with this file is stale, not right.
#
# The table key is the wire value, so a rule can compare this set against the
# enum `core-model` will hold without a mapping in between.
#
# `transitions_in` and `transitions_out` are derivable from
# job-transitions.toml and are carried anyway, for the reason WorkflowDef's
# own `structure` field is carried: declared intent checked against what was
# actually wired. A rule reads both and fails where they disagree.
#
# `step_states` is derived the same way and checked the same way, against the
# step machine rather than against this file's neighbour: STEP_EDGES walked
# beneath ADVANCING_STATUSES, carried across the status edges. A frozen step
# crosses an unguarded edge holding whatever it held, which is why most rows
# read alike — `escalated` is the row that made that concrete: it said
# `stopped`, and a Job escalated on `stalled` arrives holding a step that is
# `running`.
#
# **`retrying` crosses on that same reasoning, and these rows were written
# before it could.** `Running -> Retrying` and `Retrying -> Running` were wired
# into step_machine.rs when retries were built — `config::resolve` reads
# `retry_limit` onto the frozen step, and `store::attempt_now` counts a step's
# runs off its own log — and every row below still named `running` alone. A Job
# can freeze between one attempt and the next, so an unguarded edge that carries
# `running` carries `retrying` with it. It is not cleared on the way into a
# terminal status: job-fields.toml has the frozen step "never cleared, still
# rendered", and a Job killed mid-retry rendering as though it had merely
# stopped would be saying something untrue about where it stopped. The machine
# was extended and the registry was not; the rows below are the registry
# catching up.
#
# **A guarded edge is where a row can say more than that.** Since #189 an edge
# may carry a condition on the Job's step rows — transition-guards.toml — and
# only the states that condition admits cross it. `completed_success` is the
# first row to narrow on one: every edge arriving there is guarded on
# `every_step_advanced`, so the only state beneath it is `advanced`, and the
# row now says what `step_machine` beside it always claimed. A row still wide
# is a status whose inbound edges are unguarded, not a row nobody looked at.
# What a status is *characteristically* doing is `step_machine`, which is prose
# and is not checked.
#
# Fields:
#   terminal          - whether the Job is over here
#   mode              - Waited on | Working | N/A. What the Job is doing
#   who_is_acting     - Person | Drone | None
#   drone_process     - what happens to the Drone's OS process here
#   step_machine      - what the inner step machine is doing meanwhile
#   step_states       - the step states a Job can hold beneath this status
#   reason_storage    - Stored | Derived | None. Where a qualifying reason lives
#   reason_vocabulary - the set that reason is drawn from
#   transitions_in    - the edges that arrive, as "from -> to"
#   transitions_out   - the edges that leave, as "from -> to"
#   in_code           - whether an implementation exists, as the source recorded it
#   open_questions    - questions the source left open against this row
#   notes             - the reasoning the row's page carried

[statuses.awaiting_approval]
terminal = false
mode = "Waited on"
who_is_acting = "Person"
drone_process = "None"
step_machine = "Initialised at creation. Frozen where it stood on a re-approval"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["queued -> awaiting_approval", "running -> awaiting_approval"]
transitions_out = ["awaiting_approval -> queued", "awaiting_approval -> rejected", "awaiting_approval -> killed"]
in_code = "Not yet"
open_questions = ["How are a not-started Job's approval state and readiness state recorded?"]
notes = "A person must approve the dispatch before anything runs. Readiness is not a status of its own: the readiness values are `queued`'s reason, and `ready` is the null there rather than a value."
why = "A `needs_approval` / `pre_approved` pair is rejected — this status and `queued` say what that pair said, and combining approval state with readiness state computes to an unrenderable label."

[statuses.awaiting_attestation]
terminal = false
mode = "Waited on"
who_is_acting = "Person"
drone_process = "None"
step_machine = "Frozen, final step advanced"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "Stored"
reason_vocabulary = "The criterion_ids owed — a reference, not an enum"
transitions_in = ["running -> awaiting_attestation", "awaiting_review -> awaiting_attestation"]
transitions_out = ["awaiting_attestation -> completed_success", "awaiting_attestation -> completed_failed", "awaiting_attestation -> piloted", "awaiting_attestation -> killed"]
in_code = "Not yet"
notes = "The work landed; a criterion needs an action outside Armada. The UI renders the status verb plus the criterion's own frozen text, in the requester's words."
why = "Every status variant owes a generated UI verb and icon, and `criterion_id`s are a payload rather than a closed set — so no per-criterion or per-Job variant exists. The enum binds closed sets, not open references."

[statuses.awaiting_repair]
terminal = false
mode = "Waited on"
who_is_acting = "Person"
drone_process = "Alive and idle, holding the session that wrote the code. Clock suspended, for `awaiting_review`'s reason"
step_machine = "Frozen at the step whose budget was spent. That step is `stopped` and carries `failed(gate_failure)`, which is what it carried when this landed at `completed_failed` instead"
step_states = ["advanced", "not_started", "retrying", "stopped"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["running -> awaiting_repair"]
transitions_out = ["awaiting_repair -> running", "awaiting_repair -> queued", "awaiting_repair -> piloted", "awaiting_repair -> completed_failed", "awaiting_repair -> killed"]
in_code = "Not yet"
notes = """
A step spent its gate-failure retry budget and the work is unfinished. **The Job did not fail and no verdict is in dispute**, which is what `completed_failed` and `escalated` would each have said. `build` failing is not a matter of opinion — that is why a Check cannot be overruled, and it was never a reason to end the Job over one.

**Nothing here is a new act.** The Drone kept its session and its worktree, so a redirect costs no respawn and consumes no attempt; a restart, a Pilot and a redispatch reach it as they reach `escalated`. What is absent is the override: `Stuck` reads `checks_passed` off the store rather than off the trigger, and the Checks did not pass here, so the one act that would wave a red suite through is unreachable without a line saying so. #208.

**The narrow `step_states` is the guard, not a row nobody looked at.** `running -> awaiting_repair` is guarded on `no_step_running` — #179's guard, carried across from the edge it used to sit on — so the step is stopped before the Job moves and `running` cannot arrive. `awaiting_human` is a state nothing writes yet.
"""
why = "It joins the `awaiting_*` family because it carries that family's pair — waited on, by a person — and because it says what is owed rather than what went wrong. `stalled` was taken by a Drone gone silent and `stopped` is the step-level word."

[statuses.awaiting_review]
terminal = false
mode = "Waited on"
who_is_acting = "Person"
drone_process = "None. The work passed the step's machine gates, and that is what ends a Drone. Clock suspended"
step_machine = "Live, current step awaiting_human"
step_states = ["advanced", "awaiting_human", "not_started", "retrying", "running", "stopped"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["running -> awaiting_review"]
transitions_out = ["awaiting_review -> running", "awaiting_review -> queued", "awaiting_review -> completed_success", "awaiting_review -> awaiting_attestation", "awaiting_review -> rejected", "awaiting_review -> escalated", "awaiting_review -> piloted", "awaiting_review -> killed"]
in_code = "Not yet"
notes = """
A human advance gate is open. The step at the gate has submitted and cleared its machine gates; it has not advanced, and does not have to for its Drone to be over — a Drone ends when its step's work passes the machine gates, which Drone owns.

**The gate holds no session, and it holds no working slot.** This row read "Alive, idle. Clock suspended", and the sentence beneath it read "the gate costs no session context", which held only because one Drone spanned a whole Job. A Drone belongs to a workflow step now, and a session kept for a wait a person may take a day over is a working slot held against every other Job with nothing left to do on this one — measured on 30 Aug 2026, when one Job held the only slot from 13:42 to 18:38 doing nothing while a person read it. **A person's review costs no fleet time**, which is what ending the Drone here is for. The slot is freed, the next queued Job may take it, and approving therefore re-queues rather than resuming: `awaiting_review -> queued`.

**Sending work back across this gate re-queues too, and for the same reason.** `request_changes` has no Drone to give the note to, so the note waits on the Job's own record: the Job takes `awaiting_review -> queued`, and the fresh Drone re-admission puts on the same step opens with the note in its brief. It is delivered into that one brief and cleared there, whether or not the Drone acts on it — a note written about part two and surfacing during part four is advice about finished work, and is worse than losing it. The act still refuses where a Job's worktree has been reclaimed, because there is then no Drone to put it on and the note would wait for one that is never coming.

The liveness clock suspends here and in `escalated`. What bounds an indefinitely-open gate is Drone/Job timeout and worktree cleanup policy, owned by Drone — not the liveness timer.
"""
why = "Nothing at the gate is working, so an unsuspended clock would escalate every gate that outlasts the timeout as stalled. It held before the Drone belonged to a step too, when one waited the gate out with no activity by construction."

[statuses.completed_failed]
terminal = true
mode = "N/A"
who_is_acting = "None"
drone_process = "None"
step_machine = "Frozen at the failed step"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["awaiting_repair -> completed_failed", "escalated -> completed_failed", "awaiting_attestation -> completed_failed"]
in_code = "Not yet"
notes = "A person accepting the failure as the outcome, from `escalated` or from `awaiting_repair`, or an attestation that cannot be done. **Nothing arrives here from `running` any more** — a spent retry budget lands at `awaiting_repair`, and #208 took the edge away rather than leaving one nothing fires. So no Job reaches this status without a person saying so, which is the whole of what that issue changed. Redispatch creates a new Job — see `redispatched_from`. **`running` stays in `step_states` and is not a row waiting to be narrowed**: the edge from `escalated` is unguarded, a Job escalated on `stalled` holds a `running` step, and a person accepting its failure carries that step across. #179."

[statuses.completed_success]
terminal = true
mode = "N/A"
who_is_acting = "None"
drone_process = "None"
step_machine = "Frozen, every step advanced"
step_states = ["advanced"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["running -> completed_success", "awaiting_review -> completed_success", "piloted -> completed_success", "awaiting_attestation -> completed_success"]
in_code = "Not yet"
notes = """
Last step advanced, every criterion verified. The status is immutable once reached: a merge that later breaks main produces a new Job — a revert or a fix — linked back through `subject`, rather than reopening this one.

Armada does not watch what happens after a merge. Under `auto_merge: never`, a person merges and nothing observes, so a person raises any problem found later.
"""
why = "The record only needs to make raising a problem possible; detecting one automatically is out of scope. See Fleet."

[statuses.escalated]
terminal = false
mode = "Waited on"
who_is_acting = "Person"
drone_process = "Alive and idle where the step stopped mid-work, which is where escalation usually happens. None at a boundary, or where no step is running"
step_machine = "Frozen where the step stood — stopped where retries were spent, and running only while a Drone is still on it and still working. The poke ladder leaves the step running because that reading is true: the Drone is there and idle, and a redirect reaches it. The moment the process goes the reading stops being true, so both acts that take one away stop the step in the same breath — `kill_drone` under `drone_killed`, and Fleet's own reap of a Drone whose run has ended under `run_ended`. A step nothing owns and nothing can restart is not a state this row sanctions"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "Stored"
reason_vocabulary = "The escalation trigger enum, which Workflow owns"
transitions_in = ["queued -> escalated", "running -> escalated", "awaiting_review -> escalated"]
transitions_out = ["escalated -> piloted", "escalated -> queued", "escalated -> running", "escalated -> completed_failed", "escalated -> killed"]
in_code = "Not yet"
notes = "Fleet paused the Job; a person must decide, and nothing moves until they do — the worktree and port span are held as-is. A Job interrupted by a Fleet crash also lands here, holding those resources until a person answers; answering takes it terminal. See `piloted` for who holds the worktree, and `awaiting_review` for the liveness clock."
why = "A separate status for work holding resources is rejected: holding them is a consequence of `escalated`, not a different condition, and the two would differ only in what a surface chooses to say."

[statuses.killed]
terminal = true
mode = "N/A"
who_is_acting = "None"
drone_process = "Terminated"
step_machine = "Frozen where it stood"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["awaiting_approval -> killed", "queued -> killed", "running -> killed", "awaiting_review -> killed", "awaiting_repair -> killed", "escalated -> killed", "piloted -> killed", "awaiting_attestation -> killed"]
in_code = "Not yet"
notes = "Cleared from the Board — an operator act, carrying no verdict. Reachable from every non-terminal status."

[statuses.piloted]
terminal = false
mode = "Working"
who_is_acting = "Person"
drone_process = "Terminated. Parked under Assist"
step_machine = "Frozen where the Drone left it"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "Stored"
reason_vocabulary = "take_over / restart_step / assist"
transitions_in = ["running -> piloted", "awaiting_review -> piloted", "awaiting_repair -> piloted", "escalated -> piloted", "awaiting_attestation -> piloted"]
transitions_out = ["piloted -> running", "piloted -> completed_success", "piloted -> superseded", "piloted -> killed"]
in_code = "Not yet"
notes = "A person is working it: the Drone is gone, the worktree belongs to the engineer, and Fleet must not reclaim it. It is distinguished from `escalated` by who holds the worktree, not by whether anyone has acted — escalated is waited on, piloted is worked."
why = "Keeping the distinction in the state machine, rather than a UI label, keeps it authoritative over what a surface can say."

[statuses.queued]
terminal = false
mode = "Waited on"
who_is_acting = "Drone"
drone_process = "None"
step_machine = "Initialised at creation. Frozen where it stood on a re-approval"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "Derived"
reason_vocabulary = "blocked_by_dependency / over_budget / waiting_on_resources / none"
transitions_in = ["awaiting_approval -> queued", "awaiting_review -> queued", "awaiting_repair -> queued", "escalated -> queued", "running -> queued"]
transitions_out = ["queued -> running", "queued -> awaiting_approval", "queued -> escalated", "queued -> killed"]
in_code = "Not yet"
notes = "Approved, waiting for a Drone — on headroom, on a dependency, or on what the Job has already spent. The reason is computed from `dependencies`, from the Job's recorded spend and from live headroom at read time rather than stored: CPU, memory and disk all free without anything moving the Job, so a stored value would be wrong from the moment it was written. This is the one status where the recomputed-label rule is applied literally. `fleet::admitting::Room` is the predicate both admission and the label read for headroom, and `fleet::allowance::Fleet::overspent` is the one they share for the budget. `over_budget` is the only one of the three that does not clear on its own: it clears when a person raises the cap, which is why the Job waits here rather than escalating — nothing has gone wrong with the work."

[statuses.rejected]
terminal = true
mode = "N/A"
who_is_acting = "None"
drone_process = "None"
step_machine = "Frozen at the gate step"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["awaiting_approval -> rejected", "awaiting_review -> rejected"]
in_code = "Not yet"
notes = "A verdict on the work — approval denied, or `reject` at a human gate. `reject` is the only gate verdict that writes a terminal status. Redispatch creates a new Job — see `redispatched_from`."

[statuses.running]
terminal = false
mode = "Working"
who_is_acting = "Drone"
drone_process = "Alive, working — except between one step's Drone ending and the next one's starting"
step_machine = "Live, advancing"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["queued -> running", "awaiting_review -> running", "awaiting_repair -> running", "escalated -> running", "piloted -> running"]
transitions_out = ["running -> awaiting_review", "running -> escalated", "running -> piloted", "running -> awaiting_attestation", "running -> completed_success", "running -> awaiting_repair", "running -> awaiting_approval", "running -> queued", "running -> killed"]
in_code = "Not yet"
notes = "The work is being done, but this does not always imply a Drone: returning from `piloted` on Submit for verification leaves `assigned_drone` null, since Fleet invokes Checks itself and the Judge reads the diff. The liveness clock keys on the Drone, not the status, so a surface never renders a heartbeat for a process that is not there."

[statuses.superseded]
terminal = true
mode = "N/A"
who_is_acting = "None"
drone_process = "Terminated"
step_machine = "Frozen, and no longer describes the work"
step_states = ["advanced", "not_started", "retrying", "running", "stopped"]
reason_storage = "None"
reason_vocabulary = "None"
transitions_in = ["piloted -> superseded"]
in_code = "Not yet"
notes = """
The work landed outside the Job; the record has nothing left to say. A Job depending on it unblocks and surfaces, with the dependency marked unsatisfied — neither satisfied like `completed_success` nor blocking like the failures. Fleet's scheduler branches on this third case, making it a status rather than a reason.

See Pilot.
"""
