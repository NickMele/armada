[package]
name = "ipc"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
core-model = { path = "../core-model" }
serde = { version = "1", features = ["derive"] }
# The wire is JSON, and this is one of the two crates where bytes enter the
# process. Gate rule five names it by name for that reason.
serde_json = "1"
