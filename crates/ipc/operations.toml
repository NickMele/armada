# Every operation the Fleet/Bridge seam carries, with who may reach it.
#
# Authored here. This file is the authority on the operation set: which calls
# exist, which of them Helm may reach, and which travel the socket rather than
# HTTP. A page in the design workspace that disagrees with this file is stale,
# not right.
#
# It sits beside `ipc` because that is the crate the wire vocabulary lives in,
# and both readers of the seam read it. Fleet's hand-written route table is the
# HTTP half; the codegen step that emits Bridge's TypeScript is the other. The
# route table being hand-written is the accepted cost this file is the check
# against — a route that exists here and nowhere in the router is a runtime 500,
# and only a rule reading both catches it.
#
# The table key is the operation name as it appears on the wire, so a rule can
# compare this set against the routes and the event kinds without a mapping in
# between. An event's key carries the dotted form it is published under.
#
# `kind` decides `transport` and the source states both: who initiates is the
# whole rule, so a query and a command are alike request-response over HTTP and
# only an unsolicited push needs the socket. Both are carried, and a rule reads
# both and fails where they disagree.
#
# Fields:
#   kind        - query | command | event
#   transport   - HTTP | WebSocket
#   helm_access - Yes | No | Bridge only | Drafts only. What Helm may reach
#                 directly, which on a command is the Intervention Ladder rung
#   description - what the operation returns or does, in one line
#   notes       - the reasoning the row carried, where it carried any


[operations.get_activity_feed]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Completed Jobs, chronological"

[operations.get_diff]
kind = "query"
transport = "HTTP"
helm_access = "No"
description = "One Job's whole patch, with the file list beside it"
notes = """
The expensive half of the work product, and the one operation that spends it. `adapter-traits`' `WorkProduct` splits `changed_files` from `patch` because the bytes are large and most steps ask no semantic question, so a call returning both would pay for the patch on every gate. A person reading a diff to decide whether to take the work is the case those bytes are for, and this is the route that fetches them — not `get_job`, which is read on every open of a Job to draw a summary.

Not `job.files_changed` either. That event is the cheap half, published while a Drone works and only while somebody is watching; it carries a name and a kind and deliberately never bytes, because a stream carrying diffs at Drone speed is what the event channel's bound exists to keep off it. This is request-response, asked for once, by a person who opened a review.

`work` is absent where there was no worktree to read — a Job at the approval gate, or one whose worktree was reclaimed. An empty file list is a Drone that changed nothing, which is a different answer and fails a `diff_nonempty` check; one shape for both would report a Job that never ran as one that did nothing.

`helm_access` is `No` for the reason `observe_job` is: a whole patch pulled into a Helm session stays in that session for the rest of it, and the tokens are the cost `get_events_since` names.
"""

[operations.get_drone]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "One Drone, turn history, declared file plan"

[operations.get_events_since]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "A count plus one line per event kind since the cursor, not the events themselves"
notes = """
Helm's substitute for the event stream, called at the start of each turn; Bridge does not use it, having the socket. Helm fetches detail through the other queries only where it bears on what was asked — the query is cheap, the tokens are not, and every returned event stays in the session for its remainder. Fleet waking the session was rejected: it would make Helm a second notification channel alongside Alerts.
"""

[operations.get_evidence]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Per-step Evidence bundles"
notes = """
The claims, without the bytes. Its own route beside `get_diff` rather than folded into it: evidence is a handful of sentences per step and a patch is however large the work is, so a surface wanting only the claims would otherwise fetch a megabyte to read four lines.

A step that submitted none is absent from the list rather than present and blank, which is the shape the store already answers in — and it is what lets a reader tell a step that claimed nothing from one that has not claimed anything yet, since the step's state on `get_job` says which.

It carries no `source`. A Drone marking its own evidence human-attested is impossible on both sides of the write, and a field on the wire is a field somebody eventually lets a Drone set.
"""

[operations.get_health]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "All Doctor probes"
notes = """
The one call that must work when Fleet is down. The probe count is not stated here; it is Doctor's, in docs/concepts/doctor.md.
"""

[operations.get_job]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "One Job in full, including Facts, shape, and each step's declared gates with what they did"
notes = """
A step carries both what it declares and what ran: `checks` is the workflow's declaration and `check_runs` is what the gate found. Empty `checks` is an ungated step and an absent `checks` is Fleet unable to say — the Job named a workflow this Fleet does not hold, or holds one that no longer declares the step. Those are different sentences and a client that saw a gap either way could not tell them apart.

The declaration is read from the workflow and never from the Job's frozen rows, which carry where a step got to and nothing about what gates it. Two sources for one fact is how a registry drifts.

All three of a step's gates are declared here before any of them acts. `judge_checks` is the semantic tier's declaration, standing to `judged` exactly as `checks` stands to `check_runs`, and `advance_gate` is what says whether the tiers decide at all. Reading only what had already happened is how a step gated `human_always` — where the Job halts and waits for a person, which six of seven shipped workflows now do — rendered as a step with no check on it.

A judge criterion's question does not cross, and neither does a gaming pattern's. What crosses is how many criteria are asked, how many judges answer each where that is more than one, and whether a second look at the evidence rides along. The mechanical tier's `run` crosses because a person reproduces a failure by running it; a criterion's question is a prompt, and there is nothing a rail does with one.

`footprint` is here rather than on a read of its own, which is the opposite of what the history and the patch decided. Both of those are unbounded and this is a path and a word per file, and Fleet asks the store for it only where a Job has one — which is only once it is over — so an open of a running Job costs exactly what it did before. It is what the worktree held at the terminal transition, written down then because `armada clean` gives worktrees back and a reading taken later is a guess about a directory that may not exist. It carries no drift mark: a declared plan belongs to the step that declared it, and this is the Job's whole work since the branch was cut.

`redirect_waiting` is the note a person wrote at a human gate that no Drone has opened with yet, and it is the other half of `redirecting`: that one is an instruction with a session to go into, this one is an instruction with none. It carries the words rather than a flag, because a Job holding one sits at `queued` looking exactly like a Job nobody typed into, and "some note is waiting" would leave a person who wrote two of them no better off. It is not a new exposure — `request_changes` already refuses a second note by quoting the held one back. Present is waiting and absent is both never-written and already-delivered, because the record clears it the instant the next Drone's brief is built from it; there is no delivered flag and no instant, so no surface drawn from this can keep a badge for a note that has gone.

`stuck` is why the Job stopped and what moves it, and it is Fleet's to decide rather than a client's to derive. The trigger it carries is the registry's own spelling and nothing new is minted on top of it; what is added is `recourse`, the acts Fleet will take on this Job now, each spelled as the key of the operation that performs it. Deriving that from `status`, `current_step_id` and `assigned_drone` gets four of the five refusals right and cannot get the fifth — whether the worktree survived is a `path.is_dir()`, and a client that reads no filesystem offered a restart on a Job that had none. `worktree_on_disk` is that fact, beside the acts rather than only inside them, so a surface can say why an act is missing. Absent is a Job that has not stopped; empty `recourse` is a dead end, and the two are different sentences.
"""

[operations.get_job_events]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "One Job's whole transition history, oldest first — every status move, every step move, every Drone arriving and leaving"
notes = """
The audit trail, and the actor on every row is what makes it one: a move says whether a person, Helm or Fleet caused it, and nothing can reconstruct that afterwards.

`job_events` is the store's source of truth rather than a side record, append-only by database trigger, and validated on the way out — the fold puts every row back through `Job::transition` and refuses a history the machine would not admit. So what this serves is already ordered and already trustworthy; the operation exists because the fold's output is the current Job and the sequence was discarded.

**The rows are rendered and never replayed.** `crates/store/src/fold.rs` owns the machine and is the only thing that may put a recorded move back through `Job::transition`. A client that folded these would be a second machine, agreeing with the first until one of them changed.

Not on `get_job`. A detail view is fetched to draw a summary, on every open of a Job; a history has no bound — it grows for as long as the Job lives, and a retried step is a row per attempt plus the moves around it. A field on `JobDetail` would make the common read pay for the rare one. The surface is folded away by default and one interaction from open, so it is fetched when it is asked for.

Not the turn stream either. `observe_job` renders what a Drone said; this renders what Armada did. A Job that went wrong usually needs both, side by side rather than merged.

Helm may reach it for the reason it may reach the other queries: reading what happened is not doing anything about it. What that costs is the tokens `get_events_since` names — a long history stays in the session for the rest of it — so it is asked about one Job rather than swept.
"""

[operations.get_manifest]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Resolved config for a Manifest"
notes = """
The resolution chain across Kit, Machine and Manifest is not yet stated.
"""

[operations.get_usage]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Spend or quota against the Machine gate"

[operations.list_alerts]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Alerts by level — Blocked, Waiting"

[operations.list_drones]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Live Drones with worktree and Job"

[operations.list_job_board]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "The open queue — not-yet-started Jobs"

[operations.list_jobs]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Jobs with state and reason"

[operations.list_manifests]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "The Manifests Fleet holds, with the repository each was read from"
notes = """
Added because nothing joined a Job's `owner_manifest_id` to a Manifest. A proposal could name any ULID and it was stored, and Bridge could only render the ULID back. Fleet now refuses a proposal naming a Manifest it does not hold, and this is how a composer offers the one it does.

There is no name here because `armada.yml` declares none — `version`, `id`, `checks` and `commands` are the whole schema `crates/config` reads, and every other key is refused. The repository directory is carried instead, which is a fact rather than an invention. What a Manifest should be called is a schema decision and is open.

One Manifest at M1, and the row is still a list: Reach scopes the Board per Manifest, and a query that answered with one would have to be replaced rather than extended.
"""

[operations.list_models]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "The models a Job may name, and the one it gets when it names none"
notes = """
Added with the model picker. `crates/config/settings.toml` carries two rows that should answer this — `kit-level-allowed-default-models-list` and `default-model-per-job-type` — and neither has a `default` value, so nothing configured names a model. The values served are the adapter's, which is the boundary allowed to know a vendor's spellings; that is a stand-in and the settings rows are the answer.

Helm may reach it for the same reason it may reach the other queries: knowing what a model may be named is not choosing one.
"""

[operations.list_reports]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Every report a person has filed, newest first, with the Job record each carries and the counts they are read beside"
notes = """
The other half of `file_report`, and the half that makes a report worth filing: a record nobody can list is a record nobody triages.

**The bodies travel with the list.** A report is the rare artifact — one per verdict somebody disagreed with — and the rendered record is the payload the sentence is the finding about, so a second route per report would defer exactly the part every reader wants. The cost is that a store with hundreds of reports answers this with hundreds of bodies, which is stated rather than designed around: nothing has hundreds.

It is not scoped to a Job, and that is deliberate. A report outlives the Job it is about — `armada clean` forgets the Job and the report stays — so a listing reachable only through a Job would lose exactly the reports that most need reading.

`calibration` is four counts and not a rate. Dividing disputes by refusals would put every Job nobody read into the denominator, and an unread Job is not a pass; the gap stays unmeasured rather than divided away.

`helm_access` is `Yes` because reading what a person has already said is not saying it for them — which is exactly why `file_report` beside it is `No`.
"""

[operations.list_reviews]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "Jobs awaiting sign-off"

[operations.list_workflows]
kind = "query"
transport = "HTTP"
helm_access = "Yes"
description = "The workflows Fleet holds, with each step's declared Checks and the Manifest they resolved against"
notes = """
Added because nothing joined a Job's `workflow_id` to a workflow. `ResolvedWorkflow` carried a name and a version and no id, a proposal named one anyway, and the id was written onto the record unverified — so a Job could sit on the board claiming a workflow that does not exist. The refusal at creation is the fix; this is what lets a composer name a workflow that will not be refused.

It also makes the row readable. Bridge showed a ULID where it should have said `bug`, and resolving the id here is why the Job row does not have to carry a denormalised name.

One workflow at M1 — `Fittings` holds exactly one — and the row is still a list, because the reason there is one is that nothing could look a second one up, and that reason has now gone.

A step was a bare id until `mechanical_checks` was added to it. Bridge printed "No operation serves this step's checks" under every step because nothing on the wire could say otherwise, and for the `bug` workflow the truth is that none of its four steps declares one. `get_job` answers from these same values rather than a second copy.

**A step now carries its advance gate and what it asks the Judge, which is the whole of what this answers that `get_job` does not answer sooner.** This is where a person decides whether to approve a dispatch: afterwards the rail says what happened, and here they are agreeing to it. A workflow that will stop and wait for them at `handoff`, and spend Judge calls at `implement`, previewed as neither. Both are the shapes the rail already uses, and the criteria themselves stay off the wire — counts and states, never a question.
"""

[operations.observe_job]
kind = "query"
transport = "WebSocket"
helm_access = "No"
description = "One Job's turns, the history and then the live ones, on a socket of its own"
notes = """
The one query on the socket, and the row that makes `kind` decide `transport` a rule with an exception rather than a law. Who initiates is still the whole rule — a viewer opens this deliberately on one Job — but the answer does not end: it is the turns already taken followed by the ones that follow, which no request-response shape carries. A poll would have to choose between missing rows between calls and re-sending them.

It does not travel `/events`. That stream is one drop-oldest channel of fixed capacity carrying every Job, so transcript rows at Drone speed would evict the state changes Bridge draws the Board from — and an eviction there is not a lost row but a full resync of every Job, paid continuously for as long as anybody is watching anything.

`helm_access` is `No` for the reason `get_events_since` gives about tokens: a Drone's whole transcript streamed into a Helm session stays in that session for its remainder, and Helm has `get_drone` for the snapshot. The viewer this is for is a person.

Not `get_drone`, which is a snapshot of one Drone over HTTP. This is one Job across every Drone it has had, and it continues.

**The row a Drone ends on is what carries a spend.** It was withheld because the Job's rail was said to state the cost and the turn count; the rail states neither, and no other operation here answers with either — so this is the only place on the wire a Drone's cost appears. A Job that retried has one such row per Drone, and what the Job cost is the sum of them.
"""


[operations.approve_command]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Confirm-before-destructive"

[operations.approve_dispatch]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Releases a Job to spawn"
notes = """
The primary autonomy control.
"""

[operations.approve_review]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Advances past a human gate"
notes = """
The counterpart to `approve_dispatch`, at the other end: that one is the gate before a Job runs and this is the decision after it has. Both are human acts and neither is reachable by Helm.

**It goes through the machine like any other move.** The step advances on the inner machine — which is legal beneath `awaiting_review`, one of the two statuses a step moves under — and then the Job either goes back to `running` at the next step or, where the step that passed was the workflow's last, is committed, delivered and recorded `completed_success`. Nothing here writes a status directly.

Refused with a 409 on a Job that is not at `awaiting_review`. The three review acts share that refusal, and it is what keeps this from quietly becoming `approve_dispatch`: `awaiting_approval -> rejected` is a legal edge too, and it belongs to `deny_dispatch`.
"""

[operations.deny_dispatch]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Rejects a dispatch, feeds pattern learning"

[operations.file_report]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Files a report on a Job that failed, carrying the person's reason and the Job's own record"
notes = """
**`failures` is what Armada thinks went wrong; a report is what you know went wrong.** Every other operation here answers *did this fail*. None answers *did this fail correctly*, and the two sets do not contain each other: a Job that failed perfectly by its own lights and was wrong is `escalated` with a real trigger on it, and nothing anywhere records that the refusal was wrong. Twice now the owner disagreeing out loud has been the entire detection mechanism.

**The bundle is collection, not capture.** `get_job`, `get_job_events` and `get_evidence` already carry the record, so Fleet assembles this from operations that exist rather than capturing anything new. The one thing that does not exist until a person types it is `said` — why they think the machine was wrong — and it is required. A report that bundles the record and says nothing is the terminal-paste this exists to remove, automated.

**`claim` is a closed set because a count may not read prose.** The first override in this repository carries the reason `probe`, sent to find out whether the route was served, and `job_events` is append-only so it says that for ever. An override with a useless reason is indistinguishable from a considered one, and a required non-blank field does not make a reason meaningful — so what the count reads is the value a person picked, and the sentence is what a person reads.

**`helm_access` is `No`, and it is the strongest `No` in this file.** Filing on the owner's behalf without his sentence is the exact failure mode: the record is evidence and his reason is the finding, and an agent that could file one would be producing the bundle without the finding, at machine speed, into a tracker where a wrong claim survives as a fact.

Redaction happens on the way in. The record is rendered and scrubbed before it is stored, never at read time — scrubbing on the way out leaves a window the length of the file's life, and a store that has already written a credential cannot un-write it.

It creates no Job and dispatches nothing. Filing comes first; dispatching is the existing flow pointed at what this produced, and a Drone cannot reach the issue tracker, so the record has to travel in a Job's facts either way.
"""

[operations.kill_drone]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Kills a Drone, captures learnings, holds the worktree"
notes = """
Intervention Ladder rung 2.
"""

[operations.kill_job]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Ends a Job at `killed`, terminal, from any non-terminal status"
notes = """
Not on the Intervention Ladder, and not `kill_drone`. The ladder orders what a
person does about a Drone that is going wrong; this ends the unit of work
itself, carries no verdict, and is legal from every non-terminal status —
including the ones a Job reaches before anything spawns, where there is no Drone
for the ladder to act on.

`killed` is terminal, so the Drone goes with the Job where there was one. The
worktree is still held, until retention sweeps it — removal is driven by Job
retention and never by process exit, and a rephrase-and-redispatch may reuse it
from a Job that ended here. `reject_job` is the neighbour that carries a
verdict; this one says nothing about the work.

Helm does not reach it directly, because Helm access on a command is the ladder
rung and this has none.
"""

[operations.forget_job]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Deletes a terminal Job's whole record"
notes = """
Real deletion, and the only operation on this seam that is: every other act
moves a Job to a further status, and this removes the row and everything
beneath it through `Store::forget_job`. Refused on a Job that is not yet
terminal — there is no record to erase while a Drone might still write to it,
only a status to move, and `kill_job` is the act that ends one still in
flight.

Not on the Intervention Ladder, for `kill_job`'s reason: it is destructive
rather than an act on a Drone, and `helm_access` on a command is the ladder
rung.

**It does not reclaim the worktree or the branch.** `armada clean` already
owns that, on its own retention schedule and driven by disk rather than by a
person clearing a Board — folding it in here would give one call two
unrelated things to fail at, and a person deleting a finished Job's record
should not also have to think about a directory.
"""

[operations.propose_job]
kind = "command"
transport = "HTTP"
helm_access = "Drafts only"
description = "Drafts a Job onto the approval gate"
notes = """
The gate is unchanged.
"""

[operations.propose_from_request]
kind = "command"
transport = "HTTP"
helm_access = "Drafts only"
description = "Reads a request and drafts the Jobs it proposes onto the approval gate"
notes = """
The dispatch path a person describing work takes, and the only caller of the Job
proposer. What comes back is every Job the request became, all at
awaiting_approval, exactly as propose_job answers for one — this adds no gate and
removes none, and the person approves the same proposal at the same place.

It answers with a plan rather than a Job because one request can be several, and
approving is a different act depending on how many: one Job is dispatched by its
approval, several are a plan whose members each take their own in turn. A member
approved before the one it waits on stays queued until that one reaches
completed_success, which Fleet enforces at admission rather than trusting the
order approvals arrived in.

It does not propose write_targets. Which files the work touches is the first
step's, declared through declare_scope by a Drone that has read the code, and
checked against the real diff by the drift check that already exists. A Job
therefore reaches the gate with write_targets null — not empty — and its shape
underivable until that step runs.

Where no workflow resolves the request is refused and returned unchanged, on the
error envelope's `request` field, and no Job is created. Nothing here assigns a
workflow by default: the resolved definition is frozen into the Job and becomes
what the work is judged against, so a nearest fit would be the standard rather
than a guess somebody could correct.

A call that could not be made — the network, the quota, the timeout — is a
fault and not that refusal. The two answer different statuses because a person
does different things about them.
"""

[operations.pause_job]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Holds a healthy Drone with its worktree intact"
notes = """
Not on the Intervention Ladder, and not yet built. Pause only means something
on a healthy Drone: anything escalated is already held, because Fleet never
auto-kills.

Bridge offers it beside Redirect and Kill on a healthy Drone. Helm does not
reach it directly, because Helm access on a command is the ladder rung and
pause has none.
"""

[operations.redirect_drone]
kind = "command"
transport = "HTTP"
helm_access = "Yes"
description = "Structured instruction to a running Drone"
notes = """
Intervention Ladder rung 1. The one command Helm gets directly.

**What is kept is the worktree and every step so far.** A Drone belongs to a workflow step, so whether there is a session to speak to depends on where the Job stands. Mid-step there is one and the instruction is a turn injected into it, and the session is kept too. At a step boundary there is none: the instruction waits and opens the next step's Drone in its brief. **It never respawns to deliver itself** — a redirect that spawned would be a restart that lost the session for nothing, and it is `restart_step` that puts a second Drone on a step that stopped.

**Which act applies is decided by where the Job stands, not by whether a process exists** — `docs/concepts/job.md` has the table. Keying a surface on liveness instead would offer `restart_step` at every ordinary step boundary, because a Drone's absence stopped being evidence that anything went wrong.

The body carries the person's own words. It is the one string in the workspace that reaches a Drone without Fleet assembling it, and the Agent Prompt Contract gives the turn no wording of its own for that reason. Blank is refused.

Nothing bounds how often a Job may be redirected. Whether a cap belongs here is decided in no document, and none is invented.
"""

[operations.redispatch_job]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Fresh Drone with corrective context"
notes = """
Intervention Ladder rung 2.
"""

[operations.reject_job]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Hard stop"
notes = """
Reserved for hard stops only.

**Terminal, and that is what makes it a hard stop.** `rejected` is a verdict on the work — the registry's own line is "approval denied, or `reject` at a human gate" — and no terminal has an outbound edge, so the Job is over and nothing further runs against its worktree. The act for work that is nearly right is `request_changes`, which keeps the Job and the worktree.

Refused on a Job that is not at `awaiting_review`. `awaiting_approval -> rejected` is a legal edge and it belongs to `deny_dispatch`, which is a different act on a Job that has never run.
"""

[operations.request_changes]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Design Plan feedback loop"
notes = """
The third answer at a human gate, between taking the work and ending the Job. The Job goes back to `running` at the same step and the note reaches the work that was waiting — so the worktree and every step so far survive, which is what separates this from a redispatch.

**There is no Drone at the gate to take the note.** A Drone ends when its step's work passes the machine gates, so the step standing at a human gate has none — `docs/concepts/drone.md` has the rule. This act is therefore what `redirect_drone` is at a step boundary: words that open the next Drone's brief, not a turn injected into a session.

**The note waits on the Job and is delivered once.** It goes onto the record, the Job takes `awaiting_review -> queued` rather than straight to `running` — a Job put back to `running` with no process on it escalates as `interrupted` a moment later — and the Drone re-admission puts back on the same step opens with it. Delivered into that one brief and cleared there, whether or not the Drone acts on it: a note surfacing two steps later is advice about finished work. Where a Drone is somehow live, it is injected as a redirect is and nothing waits; whichever path runs, the other does not.

**409 where the Job's worktree has been reclaimed.** There is then no Drone to put the note on and none possible, which is the only case left where it has nowhere to go. What is being asked for there is a redispatch.

The body carries the person's own words and is a type of its own rather than a redirect's — a redirect steers a Drone whose step stopped, and this answers a gate. Blank is refused.
"""

[operations.restart_step]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "A fresh Drone on the surviving worktree, at the step that stopped"
notes = """
The second of the four acts that reach an escalated Job — `docs/concepts/job.md` has the table. The Drone is **gone**; the worktree, the branch and every earlier step's work survive, and a new Drone takes the step over where it stopped.

**Not a redispatch.** A redispatch mints a replacement Job and re-runs every step from the approval gate. This resumes the one step, on the branch the earlier steps' work is already on. Where the worktree has been reclaimed there is nothing to resume onto, and it refuses and says the act being asked for is a redispatch.

**Not a redirect.** A redirect keeps the work moving on what it already has; this ends an attempt and opens another. A restart mints a further `drone_id` under one `job_id`, which the log envelope already anticipates — and so does every step boundary, so the second id is no longer what tells a restart from an ordinary advance.

**It resolves nothing again.** The toolset, the model and the environment come from the snapshot taken when the Job was created, and a restart reads that same snapshot — `docs/concepts/drone.md` has the rule and why it is a rule. A scope revision is the one act that re-resolves, because a person approved the new Manifest set; permissions intersect there, so a widened scope can only produce a narrower toolset than the Drone that asked for it.

Helm does not reach it directly, because Helm access on a command is the ladder rung and this has none.
"""

[operations.override_verdict]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "A person overrules the machine that stopped a step and the step advances, keeping what was ruled on the record"
notes = """
The fifth act that reaches an escalated Job, and the only one that lets the work
already done stand. `docs/concepts/job.md` has the other four and none of them is
this: `approve_review` refuses anywhere but `awaiting_review` and a Job a gate
refused is `escalated`; `restart_step` re-runs the step, which throws away
everything the refused Drone did and may draw the same refusal again;
`redirect_drone` tells a Drone something new, and the Drone did nothing wrong;
`redispatch_job` starts a replacement from the top. So a verdict that was wrong
had no answer but discarding correct work or repeating it, and **a verdict that
cannot be appealed is worse than no Judge** — a verifier a person cannot overrule
is one they route around, by weakening criteria or by not dispatching.

**It lifts `gate_failure` and `evidence_suspect`, and nothing else.** Both are a
machine's decision, which is the owner's rule for what a person may overrule. The
first is the Judge refusing a criterion, a judgement about the work. The second is
the gaming check saying the evidence is not to be trusted — a claim about how the
step was satisfied rather than about whether it was, and a machine reading a diff
to infer intent, which is the call a person is most likely to be right about.
`last_verdict.trigger` is what tells an overruled flag from an overruled refusal
afterwards, and Bridge chooses its words off the same field. `gate_undecided` is
the gate never having weighed the work at all, so advancing on it would pass a
step nothing ruled on; whether that wants an act of its own is open. The
mechanical tier is unreachable by construction as well as by the check: a failed
Check is `completed_failed`, terminal, with no stopped step for any act to land
on. `build` failing is not a matter of opinion.

**Recorded as an override and never as a pass.** The step move is `stopped ->
advanced` carrying the trigger it overruled, with the person as the actor, so
`job_steps.last_verdict` still says `failed` beside a state that says
`advanced`, carrying whichever of the two triggers was overruled — what the
machine said, and the fact that it did not stand, in one row of the log that is
already append-only. `StepDetail.overridden` is that pair
read once at this boundary rather than by every surface that draws a rail. A rate
is countable off `job_events` alone: step moves from `stopped` to `advanced`,
against refusals. #154 is what does the counting and is not this.

**The reason is required and does not reach the Drone.** A person who overrules a
Judge is the best evidence there is that a criterion is mis-stated, and a count
with no reasons beside it gives the rate and never the cause. The Drone is told
only that the step was accepted, because it did nothing wrong.

It needs no Drone and refuses on neither presence nor absence, which is what
separates it from `redirect_drone` and `restart_step`. Where the session is still
there the acceptance is a turn injected into it; where it is gone a fresh Drone
takes the *next* step on the surviving worktree, and a worktree that has been
reclaimed is refused with the same sentence `restart_step` uses. Where the
overruled step was the workflow's last, the work is committed, delivered and the
Job recorded `completed_success`, exactly as `approve_review` ends one.

Helm does not reach it. Overruling a verifier is the act a verifier exists to
make somebody take deliberately, and it is not on the Intervention Ladder.
"""

[operations.rerun_gate]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "A person asks the gate again, on the evidence a step already submitted, where the first reading could not decide"
notes = """
The sixth act that reaches an escalated Job, and **the one `override_verdict` is
deliberately not**. `gate_undecided` says Fleet could not derive a gating
artifact — a worktree it could not read, a Judge it could not hand a patch to —
so `Ruling::CouldNotDecide` is the machine declining to produce a verdict in
either direction. There is nothing ruled to overrule, and advancing on it would
pass a step nothing ever weighed. `overrulable()` in
`crates/fleet/src/overruling.rs` refuses the trigger for that reason and keeps
refusing it; this admits exactly what that refuses, so the two acts partition the
triggers rather than overlapping.

**It re-runs, it does not retry.** The cause is usually transient and sometimes
permanent, and #156 recorded that the two arrive as the same value and are not
told apart — guessing would be the machine producing an answer it does not have.
So nothing loops: a person presses this, reads what came back, and presses it
again or does not. Where the cause is permanent the gate fails again and says so,
which is the honest outcome and is the case #153's blind Judge was.

**It takes no body.** An override carries a required reason because a person is
disagreeing with a machine and the count of overrides needs the cause beside it.
Nothing is being disagreed with here, so there is no sentence to record that the
second reading will not say for itself.

**It does not touch the retry budget #63 added.** That budget counts runs of the
step and hands a *failed Check* back to the Drone that produced it; a gate re-run
is not a run of the step, because no Drone works and nothing it did is redone. So
the run the gate is told it is reading is the one the Drone did, read off the
step's log before anything moves, and the second reading's records are filed under
that same run.

**Refused four ways, and each names the act that applies instead.** A Job that is
not `escalated`, an escalation that stopped no step, a step stopped on any trigger
but `gate_undecided` — that one is an override or nothing — and a Job Fleet is no
longer standing at. The last is the one that is not obvious: the baseline
`diff_nonempty` is decided against is what the worktree held when the step began,
it lives in the working slot, and a Fleet restarted since the escalation has none.
Reading without it would answer a different question from the first reading, so
`restart_step` is named instead.

A second reading that also could not decide **moves nothing**. The Job is already
`escalated` and the step already `stopped` on `gate_undecided`, which is where the
ruling would put them, and a press that changed nothing is written into the Job's
own log rather than into the record as a run the Drone never had.

Helm does not reach it, for `override_verdict`'s reason: it is not on the
Intervention Ladder.
"""

[operations.restart_fleet]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Restarts the daemon"
notes = """
An API command, not a recovery path. It cannot serve the case it is named for — a dead Fleet cannot restart itself, and that path is Bridge calling `launchctl kickstart -k` directly. It exists for the reachable case: Fleet is alive and answering, and something wants a clean restart.
"""

[operations.resume_interrupted_job]
kind = "command"
transport = "HTTP"
helm_access = "No"
description = "Restarts a Job after a Fleet crash"


