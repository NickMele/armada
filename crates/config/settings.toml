notes = """
Bounds every Check, narrowed by an optional per-Check field in armada.yml. Both, because a Check ranges from a seconds-long lint to a half-hour suite: one number has to accommodate the slowest and so never fires on the fast ones that hang, and a field alone means every repo writes it on every Check or gets no bound at all. A timeout escalates rather than failing the gate — the Check did not fail, it did not finish. Scope, Default, Merge strategy and Peer polarity are blank because the deciding question did not state them, and whether the per-Check field may raise this value or only lower it is open.
