Bounds criteria x panel_size per step, overridable per step. Cost is not the driver - twelve calls is cents - but the calls sit at a gate a person is waiting behind, and each is a chance to trip max_context_size, which escalates. Live because acceptance_criteria[] may be appended at an approved widening, so the left factor can climb mid-Job. What happens when the ceiling is hit is not yet stated. Same shape as the aggregate attempt cap and for the same reason: the product becomes stated rather than emergent.
