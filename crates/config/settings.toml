[settings.drone-silence-threshold-quiet-after]
name = "Drone silence threshold (quiet_after)"
scope = "Kit → Manifest"
default = "120 seconds"
lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "Lower is stricter"
owner = "Fleet"
read_by = "fleet"
notes = """
How long a Drone may say nothing before Fleet pokes it, and — once `poke_limit` is spent — escalates the Job as stalled. **Overridable per step, defaulted from `default_gate_policy.quiet_after_seconds`**, the same shape as `iteration_cap` and the two `default_gate_policy` caps below. That per-step tier is what `#60` is for: a formatting step and a large refactor were given the same patience, because there was one number and it was a constant.

**Called "Drone heartbeat/liveness timeout" until `#60`, and the old name is why nothing found this row.** `fleet::Liveness` carries both halves of the pair, cites `poke_limit`'s row for the count and cited no row at all for the duration, and `crates/armada/src/serve.rs` hard-codes both as `PROVISIONAL_LIVENESS`. The heartbeat half of the old name was split out into `drone-heartbeat-interval-heartbeat-interval-minutes` in Aug 2026 and the name was not corrected with it, so the row read as being about a beat Armada does not send.

**It is the silence, not the elapsed time.** `docs/spikes/009-how-long-does-a-step-take.md` measured the longest silence inside an honest step at 79s against a step wall clock whose p90 was 437s: every stuck step it saw was quiet, not long. A step's wall clock is a different dial and is `fleet::StepNorms`'s.

**Two rows and not one pair.** `poke-limit-poke-limit` holds the count that travels with this duration, and they stay separately overridable: a step that deserves more patience per poke does not thereby deserve more pokes, and a repository that wants to be asked more often wants to change one and inherit the other. `fleet::Liveness` is the pair the two resolve into, and no file states a tuple. The product is what must not fire routinely — at the defaults that is about six minutes of silence, four and a half times the longest any honest step produced.

**A step-level override is the watched step's own, and nothing aggregates.** The vigil watches one Drone and a Drone belongs to exactly one step, so the value in force is that step's, re-read at the step boundary. The poke budget resets with it, because the slot holding the count is per step already. A Job spanning four steps is four independent patiences, never a sum and never the strictest of them.

**All three tiers are wired, and there are three rather than the two this row's `scope` names.** There is no Kit; nothing in the workspace parses one. What exists is `crates/armada/src/serve.rs`'s constant, `armada.yml`'s `drone.quiet_after_seconds` — `#414` — and a step's `quiet_after_seconds`. `fleet::Liveness::at` is where all three meet and is the only place the order is written; the answer is held on the slot for as long as the Drone is.

**`lifetime = "Live"` governs this value and not a step's override**, which is the one place the two words could have collided. A step's number rides a WorkflowDef frozen at Job creation and stays what the Job froze; live is what an absent override falls back to, re-read at every step boundary, so a Job declaring nothing follows a change into its next step with no restart. `fleet::Liveness::at` carries the argument.

**The Manifest tier reaches the file, since `#430`.** It did not until then: `armada::Setup::at` read `armada.yml` once at daemon start and `Fleet` held it, so the resolution was redone at every boundary against a file frozen for the daemon's life, and editing it changed nothing until a restart. `armada::watching` now polls the file and `config::live` adopts this key and `poke_limit` from it — the two rows this file marks `Live` with a Manifest tier, and nothing else, because `manifest-checks-init-commands-named-checks` and `manifest-commands-registry` are `Frozen for the Job` and every workflow was resolved against them at start. A save that changes one of those is reported on the console as needing a restart rather than adopted.

**A save that will not parse changes nothing.** The last good numbers stay in force and the refusal is printed: a fleet that stopped because somebody mistyped a number would be worse than one that ignored the edit. And the read is still at the step boundary and only there — `fleet::working::Working` holds the resolved pair for as long as the Drone does, so an edit cannot move the terms a running step began under.

**Armada's own `armada.yml` sets it to 300, and that is a measurement rather than a preference.** Spike 009's 79s maximum was one repository, a warm cache and small changes, and it says so; the shipped 120 is one and a half times it. Measured in this workspace on 3 September 2026, into an empty target directory: `cargo build --workspace --locked` is 37.6s and `cargo nextest run --workspace --exclude acceptance` is 41s — each one tool call producing no Drone output, each already a third of the shipped threshold on its own, and this file's own `bridge_test` comment records 6s then 40s before a browser starts. A Drone that runs two of them before it says anything is silent past 120s on work that is going fine. 300 is the top of the band the spike named as separating every case it saw, so it is still a tripwire and not a switch.

Documented on Drone; Fleet is what notices the silence. Distinct from Fleet health-check / resource-poll interval, and from the heartbeat interval, which is how often a Drone is expected to speak rather than how long Fleet waits before speaking to it.
"""

