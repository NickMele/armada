The rounding unit a claim's width is raised to, giving a mid-Job widening headroom to extend in place. Machine-only knowingly against the tiering rule — a project-level version does parse, since a monorepo of compose stacks wants a larger granule than a repo of libraries, but the preference is unfelt: demand already drives width, and the headroom is spent on scope revision, which is rare. Recorded so it need not be re-derived if it moves: Convoy resolution is highest-wins, since most-restrictive would take the smallest granule, which is backwards for a floor. The signal to move it is a repo where mid-Job widenings routinely fail to extend in place and re-claim, changing port numbers under a running worktree.
