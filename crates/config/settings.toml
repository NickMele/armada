Added 2026-08-21 from the Run and edit a Manifest journey. How long a Check or Command run fired by hand from the Manifest surface keeps its log. Those runs write to ./.armada in their own run directory, one per run — the same tree as Job logs, a separate subtree, so a sweep can take them without touching Job history. Machine-scoped rather than two-tier because the logs are on your disk, and how long you keep them is a fact about your machine, not about a repo a teammate also clones. That reasoning is the Kit/Machine test stated before the split existed. 30 days rather than reusing the Job retention window, because the two age out for different reasons — a Job log is kept as long as its history is worth reading, a rehearsal only as long as you might still be debugging what you just ran.
