"""

[settings.notification-routing-in-app-vs-os-per-event-type]
name = "Notification routing (in-app vs OS, per event type)"
scope = "Machine"
lifetime = "Read at render"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Bridge"
read_by = "bridge (TS), fleet"
notes = """
Noise tolerance varies by machine; the adapter itself is in-app only until Phase 4+. Retagged Machine Aug 22 2026 — it was filed Guild → Manifest, which was a mis-tag: there is no project-level version of how loudly Armada notifies you. One value, no merge, no second tier. Bounded by Design System — UI & Voice as a product rule rather than a config tier: the loudness order is silent < in-app < OS < push, routing may move an event type down it but never up, and an approval may never be promoted to push. That holds because an escalation means work has stopped and nothing progresses until a person looks, while an approval means work is waiting to start and will keep. Orphan risk: no dependency path carries config to Bridge, so the Electron side reads its own copy or a hardcoded default.
"""

[settings.copy-lint-enforcement-mode-gate-vs-warning]
name = "Copy lint enforcement mode (gate vs warning)"
scope = "Kit → Manifest"
default = "Gate on commit messages and PR descriptions; warning on Judge summaries"
lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "Union (deny-shaped)"
read_by = "verification"
notes = """
Split by destination, not by surface. Text that leaves Armada and is read by people who did not ask for it earns a gate; text that stays inside does not. A gate failure gets one free correction round that does not consume the retry budget — without it a style bounce spends retry_count and a Job can escalate as gate_failure over an em dash, which is what made a hard gate look dangerous. It reuses the existing one-free-round mechanism for present-but-insufficient evidence. Voice cannot widen or narrow this in either direction. A block wins over a warning across a Convoy's Manifests. A repo asking for its own commit messages to be gated should not have that switched off by a peer repo that did not. Owner is empty on purpose: Agent Copy Contract is a Doc, not a Concept row, and the unit that enforces this is verification.
"""

[settings.copy-lint-scope-which-surfaces-are-linted]
name = "Copy lint scope (which surfaces are linted)"
scope = "Kit → Manifest"
default = "PR descriptions, commit messages, Judge summaries"
lifetime = "Live"
merge_strategy = "APPEND_AND_REMOVE"
peer_polarity = "Intersect (allow-shaped)"
read_by = "verification"
notes = """
New, undecided. Evidence summaries and Helm replies are deliberately not linted. Open whether a Manifest may change this scope, in either direction, and whether Voice/tone interacts with it. The question was previously framed as whether a Manifest may narrow it — that framing came from the config direction rule, withdrawn Aug 22 2026, and the question is wider than it was. Owner empty for the same reason as Copy lint enforcement mode.
"""

[settings.allowlist-safe-ops]
name = "Allowlist (safe ops)"
scope = "Kit → Manifest"
lifetime = "Live"
merge_strategy = "APPEND_AND_REMOVE"
peer_polarity = "Intersect (allow-shaped)"
owner = "Fleet"
read_by = "fleet"
notes = """
Two-tier, explicit in brief. Documented on Kit; enforced by Fleet. Kit holds the default allowlist and a Manifest may extend or restrict it — in either direction. The row previously carried the opposite rule, that an allow-shaped list merges by intersection and a Manifest addition is rejected at config load; that was the config direction rule and it was withdrawn Aug 22 2026. Peer polarity is unchanged: across a Convoy's gating Manifests the allowlist still intersects, because a Drone must hold only what every declared Manifest granted. Open finding, filed separately: the allowlist's value was never prevention but the denial record in the approvals table, and nothing now stops a Manifest removing entries and with them the record.
"""

[settings.destructive-op-list-confirm-before-drone-ops-only]
name = "Destructive-op list (confirm-before) — Drone ops only"
scope = "Kit → Manifest"
lifetime = "Live"
merge_strategy = "APPEND"
peer_polarity = "Union (deny-shaped)"
owner = "Fleet"
read_by = "fleet"
notes = """
Governs Drone-initiated operations that must stop and ask first (rm -rf, force-push, schema drops). Does not govern your own Bridge actions — those always confirm and are not configurable. Opposite polarity to Allowlist despite an identical Scope and an identical-looking strategy: here appending narrows and removing widens. Two rows that look the same in every column and resolve in opposite directions is why Peer polarity exists as a column. The row previously read that a Manifest may only add, which guaranteed a repo could never remove a confirmation Kit required; that was the config direction rule and it was withdrawn Aug 22 2026. Nothing now provides that guarantee — filed as an open finding. Peer polarity is unchanged: deny-shaped, so the list unions across a Convoy's gating Manifests.
"""

