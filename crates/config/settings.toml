notes = """
Resolves a workflow review step's manifest_rule:review_gate. Values: human_always (default) or auto_if_judge_passes. Referenced by the Bug reference sample since it was written and had no row until Aug 21 2026, so the gate resolved against nothing. TIER UNRESOLVED as of Aug 22 2026. The Scope was set to Manifest only deliberately, to avoid the config direction rule: a per-repo override from human_always to auto_if_judge_passes loosens the rule, and the direction rule forbade a Manifest widening what Guild set. That rule is withdrawn, so the reason for the tiering is gone, and Workflow's own prose called this a Kit default with a per-repo override. Filed as an open item. Auto-merge policy rides with it by this row's own same-shape-for-the-same-reason clause. Peer resolution is unaffected: most-restrictive-wins across a Convoy's gating Manifests, human_always beating auto_if_judge_passes.
"""

[settings.poke-limit-poke-limit]
name = "Poke limit (poke_limit)"
scope = "Kit → Manifest"
default = "2 pokes"
lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "Lower is stricter"
owner = "Fleet"
read_by = "fleet"
notes = """
How many nudge prompts a silent Drone gets before the Job escalates as stalled. A liveness counter — nothing arrived at all. Distinct from Drone evidence clarification-round cap, which is a content-sufficiency counter: something arrived via the Evidence MCP tool but was not enough. Both end in the stalled label; they track independently. Set in a WorkflowDef default_gate_policy since the schema was written; no row until Aug 21 2026.

**The count that travels with `quiet_after`, and the second of two rows rather than half of one value.** `#60` weighed folding the pair into a single setting and refused it: a step that deserves more patience per poke does not thereby deserve more pokes, no other row in this file states a tuple, and one key would make overriding either half mean restating both. `fleet::Liveness` is where the two meet, and it holds them as two numbers behind one constructor for that reason.

**Overridable per step, defaulted from `default_gate_policy.poke_limit`**, and the budget resets at each step boundary because the slot that counts spent pokes is per step. A Drone poked twice on step one starts step two with two pokes in hand.

**All three tiers are wired**, exactly as for the duration it travels with. `crates/armada/src/serve.rs` still names the number, as the second half of `PROVISIONAL_LIVENESS`, and that is now what an `armada.yml` and a step both fall back to rather than what every step gets. A repository or a step declaring `poke_limit` and nothing else keeps the duration it inherited, which is what two rows buy: `fleet::Liveness::at` resolves the halves separately at both overriding tiers.

**And the Manifest tier is live to the file, since `#430`**, exactly as for the duration it travels with — the row above carries what is watched, what a save that will not parse does, and why a change to `checks:` in the same file is not adopted with it. The two keys are adopted together because they are read together, and each still falls back on its own.

**`poke_limit: 0` is legal wherever it is written**, at `drone.poke_limit` in an `armada.yml` or on a step, and it is not an absent key. It says the Drone gets no nudge at all and the first silence past the threshold escalates — the one place the two keys disagree about zero, since a `quiet_after_seconds: 0` is refused where it is written.

**This repository sets neither key**, and the row above says why it sets the duration and not this. Two nudges is what Armada's own Drones get.
"""

