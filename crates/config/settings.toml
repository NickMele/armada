peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet, verification"
notes = """
Work-machine billing mode. Documented on Machine; enforced by Fleet at every gated checkpoint, which is why the owner is Fleet.

**The slash in the name used to join two spellings of one span and now joins two different ones.** A Drone belonged to a Job, so per Job and per Drone were the same cap counted twice. A Drone belongs to a workflow step, so a four-step Job has four Drones and the two readings differ by a factor of the step count. Which one this cap counts is undecided — `[budget-cap-per-job-or-per-drone]` in `docs/contracts/configuration.md`. The row previously recorded a collision: a Manifest could select an expensive model against a cap the tiering rule forbade it to raise, so every Job of that type halted mid-worktree and the fix was illegal. Aug 22 2026: the collision dissolves rather than reverses. The direction rule was withdrawn, so raising the cap is legal and the fix is available. Note this row and Manifest budget cap are two independent caps with no stated precedence, which is separately open — and budget is the one place the Kit/Machine test gives an unclear answer, since a Manifest cap demonstrably parses at project level.
"""

