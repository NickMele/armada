[settings.port-range-ceiling]
name = "Port range ceiling"
scope = "Machine"
default = "Detected — the platform's ephemeral port floor minus one. 32767 if the read fails."
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet, store"
notes = """
Read once at daemon start — net.inet.ip.portrange.first via sysctl on macOS, net.ipv4.ip_local_port_range in /proc on Linux. Detection supplies the default; an explicit value still wins, so a lower cap survives and Doctor has a value to show. Never guess high: a ceiling above the real floor hands out spans the kernel will also assign, which is the collision class the ceiling exists to prevent. 32767 is one below Linux's ephemeral floor, so storing it as the value stores the answer rather than the rule.
"""

