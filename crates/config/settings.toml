# Every setting Armada has decided it will have.
#
# Authored here. This is the list the `config` crate reads and, once each
# owning crate declares the keys it reads, the list it generates — at which
# point `read_by` stops being a design decision and becomes an observation.
# That is why the field is named for what it claims rather than what it knows.
#
# `notes` carries the argument for a value, including where a classification is
# the least confident one in the table. That reasoning is the reason this moved
# out of a database and into the repository: it is read while writing the code
# that obeys it.
#
# The rules these obey — the tiering test, how Kit and Manifest merge, what
# peer polarity is for — are in docs/contracts/configuration.md.
#
# `lifetime = "Frozen for the Job"` was `"Frozen at spawn"` until Focus. A Drone
# belongs to a workflow step, so a Job spawns one per step and "at spawn" would
# mean re-resolved at every boundary — which is the thing the snapshot rule
# forbids, because a step boundary has no person in it. The snapshot is taken
# once, at Job creation, and every Drone of that Job boots from it.


[settings.cpu-mem-headroom-threshold-for-spawning]
name = "CPU/mem headroom threshold for spawning"
scope = "Machine"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced.** `fleet::headroom::Headroom` carries it and `Fleet::room_for_another` is the predicate: `admit_next` opens with it, and a Job approved onto a machine short of it stays `queued` with `waiting_on_resources` as its reason — the same predicate, so a Board cannot say a Job is blocked while Fleet is starting it. It read as unparsed until Throughput.

**One share, for CPU and memory only.** Disk is the third signal the same predicate reads and it is not held against a percentage — `disk-headroom-floor-for-spawning` below is its own row for that reason, and carries the argument.

Machine constraint. Also sets Doctor's System stats warn boundary — below threshold is warn, since Drones queue rather than spawn. System stats is the one Doctor module whose warn is live degradation rather than "works now, will break later".

It has no value here for the reason none of Fleet's other dials does — `crates/armada/src/serve.rs` resolves it, and carries the argument for the number. It ships at a sixth of the machine: nothing has measured what a Drone costs in CPU or memory, and what the number is for is refusing to start work on a machine that is already saturated.
"""

[settings.disk-headroom-floor-for-spawning]
name = "Disk headroom floor for spawning"
scope = "Machine"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced**, through the same predicate as the row above — `Fleet::room_for_another`, which `admit_next` opens with and which the Board's `waiting_on_resources` label is answered from. The volume read is the repository root, because every worktree is cut beneath it.

**Bytes, and not a share, which is why it is its own row.** The row above is a percentage and a percentage cannot carry this: a tenth of a 4 TB volume reserves 400 GB against a worktree that needs three, and a tenth of a 60 GB volume leaves less than one build. What a Job costs in disk is absolute — a cut worktree plus its build output — so it is held against a number of gigabytes.

**It exists because of a measured failure, not for symmetry with CPU and memory.** On 31 Aug 2026 a volume filled during a parallel agent run: 220 GB across 74 worktrees, roughly three gigabytes each, and three agents died at zero bytes free holding uncommitted work. Nothing saw it coming, nothing reported it, and the first symptom was tool calls failing with `ENOSPC`.

It has no value here for the reason none of Fleet's other dials does — `crates/armada/src/serve.rs` resolves it, as part of `PROVISIONAL_HEADROOM`, and carries the argument for the number. It ships at ten gibibytes, which is about three worktrees' worth: enough that the Job being started can finish and a person has warning before the next one.
"""

[settings.fleet-health-check-resource-poll-interval]
name = "Fleet health-check / resource-poll interval"
scope = "Machine"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced**, as a freshness bound rather than as a second timer. `fleet::headroom::Polling` carries it and `Fleet::room_for_another` refreshes the machine reading only once it is older than this — a background poll and a lazily refreshed reading are the same number and the same staleness, and the bound costs nothing while Fleet is idle.

A reading is three short-lived processes and about eighty milliseconds, so taking one on every turn — four a second — would be a measurable share of a core spent on a number that does not move that fast. It ships at five seconds, which is twenty turns.

Daemon-level. Distinct from Drone silence threshold (quiet_after), which is per-Drone silence rather than Fleet's own polling.
"""

