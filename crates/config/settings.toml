[settings.judge-model]
name = "Judge model"
scope = "Kit → Manifest"
default = "haiku"
lifetime = "Frozen for the Job"
merge_strategy = "REPLACE"
peer_polarity = "Member of the Kit set"
owner = "Judge"
read_by = "adapters, verification"
notes = """
Added by the Aug 2026 config review. Judge had no row among the original 45: the only tier in the system that measures correctness was unconfigured, unbudgeted and unversioned. Runs through ModelClient — one-shot, no tools, cheap model, tight latency budget.

DECIDED 28 Aug 2026: haiku. It was already the value in the adapter, written there as a stand-in for this row; it is now this row's decision and the adapter derives it rather than stating it. What changed is not the string but who owns it.

Why the cheapest tier is the right floor, rather than the safe-looking stronger one. The Judge is veto-only and one-shot: no tools, no repository, one turn, and one narrow yes/no about a diff it was handed. That is the smallest question in the system, and the tier that answers it is the cheapest one that can read a patch. A stronger default would not make the Judge see more — it cannot go looking, by construction — it would only make every criterion cost more and take longer.

Why it must be a floor and not a middle. Model is a deliberate per-step dial and the reference Bug workflow already varies it: four steps on haiku, review on sonnet. A dial is only meaningful against a default it moves away from, and a default already at the middle of the roster leaves the cheap direction unreachable — the step that wants rigour can no longer be told apart from the step that got it by inheritance.

Latency, not money, is what the value is chosen against. The calls sit at a gate a person is waiting behind, and criteria x panel_size multiplies them: four criteria at panel_size 3 is twelve calls in series at one gate. v1 measured a judgment at roughly 4k input / 300 output tokens, which is under a cent at this tier, so twelve of them is cents either way — the difference the default makes is seconds of wait, and it is paid on every gate of every Job.

Member of the Kit set is load-bearing here, and is why the value lives where it does. The alias is a vendor's spelling, so gate rule six keeps it inside adapters; the adapter reads it as the last entry of the model roster it already states, the roster running strongest-first, so the default is a member of the offered set by construction rather than by a check. A test pins that derivation to this row's value, so a roster reordering breaks the build rather than silently redeciding this setting.
"""

