[settings.aggregate-attempt-cap-default-gate-policy]
name = "Aggregate attempt cap (default_gate_policy)"
scope = "Kit → Manifest"
default = "retry_limit x iteration_cap at today's values; unbounded is a legal value"
lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "Lower is stricter"
owner = "Workflow"
read_by = "verification"
notes = """
Total attempts across all iterations of a step, overridable per step. Exists because retry_count resets on a loop return by design, so at defaults fifteen attempts pass unobserved and completed_failed is unreachable on a looping step. Defaulted to today's effective product so nothing changes behaviour - the point is that the product becomes stated rather than emergent. A runaway guard for unattended work, not a safety limit: a human watching a loop kills a Job that is not converging. A workflow that legitimately loops many times sets unbounded and accepts that completed_failed is then unreachable on that step. Named in a WorkflowDef default_gate_policy with no row behind it until now.
"""

