read_by = "adapters, fleet"
notes = """
Added with the Job proposer. Its own row rather than a second reading of judge-model: the two are the same shape of call and are raised for opposite reasons, and a machine that raised one by raising the other would pay the raise on every dispatch as well as on every criterion. One turn, no tools, no directory — the same shape as a Judge call. Overridden by ARMADA_PROPOSER_MODEL, resolved at the composition root, and nothing below Fleet reads it. Carries no value yet, so the default is the adapter's own stand-in. judge-model was in the same arrangement until 28 Aug 2026 and is now decided; this row was left where it was rather than being carried along, because the two are raised for different reasons and the proposer's own reasons have not been worked through.
"""

[settings.judge-confidence-threshold]
name = "Judge confidence threshold"
scope = "Kit → Manifest"
default = "n/a — superseded"
lifetime = "Frozen for the Job"
merge_strategy = "REPLACE"
peer_polarity = "Higher is stricter"
owner = "Judge"
read_by = "verification"
notes = """
SUPERSEDED Aug 21 2026 — this setting has no referent and should be deleted or repurposed. Added by the Aug 2026 config review on the assumption that a Judge returns a graded confidence. It does not. Decided Aug 21: the gate auto_if_judge_high_confidence is renamed auto_if_judge_passes and the confidence notion is dropped — a veto-only Judge either refuses or it does not, the question it is asked is a narrow yes/no, and a panel requires unanimity rather than a score. There is nothing for a threshold to threshold. Original note, kept for the reasoning: 'Floor rather than cap: a Manifest may demand more confidence than the Guild, never less. A threshold that a Manifest could lower is a veto a repo can switch off.' Aug 22 2026: the never-less half of that instinct was the config direction rule and is withdrawn. What survives and relocates to judge_check.panel_size is the shape — raising the panel is how a Manifest demands more rigour, and higher-is-stricter is the correct peer polarity for it — but nothing now stops a Manifest lowering it. Same finding as the Judge trigger set row.
"""

[settings.judge-cost-cap-per-check]
name = "Judge cost cap per check"
scope = "Machine"
default = "undecided"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Judge"
read_by = "fleet, verification"
notes = """
Added by the Aug 2026 config review. Without it a Judge Check bills against the Job budget with no sub-limit, so verification competes for spend with the work it verifies.

STAYS OPEN 28 Aug 2026, and the reason is now written rather than absent. It was reviewed alongside judge-model, which was decided in the same pass; a number was deliberately not invented for this one.

Nothing can read what a Judge call cost. A Judge is rendered with --output-format text and --max-turns 1, so the call answers in prose and emits no result envelope. The cost figure this cap would be compared against — total_cost_usd, read as cost_micros — reaches Armada only on a Drone's stream-json transcript, which a Judge call deliberately is not. So a dollar written into this row today would be enforced by nothing while reading, to anyone who found it, as a limit that was set. That is the failure this row is more dangerous than useful in: an unenforced cap is worse than an absent one, because only one of the two is visible as missing.

What is actually open has therefore changed, and is no longer 'what is the number'. It is: does a Judge call get a cost readout at all — which means an output format that carries a result line, and a reader for it, in adapters and fleet — and if it does, is a per-check dollar cap the right shape, given that the two bounds that exist today are both shaped differently. judge-call-count-ceiling bounds criteria x panel_size per step and needs no price to enforce; budget-cost-cap-per-job bounds the Job, enforced at admission. The Manifest budget cap this used to name is gone: a Manifest has no budget. Between them the product is already bounded, and v1's measurement of a judgment at roughly 4k input / 300 output tokens puts a fully fanned-out step in cents.

Judge is also not where verification's spend risk concentrates. Cost is not the driver on this tier and the Judge concept says so outright — latency is, because the calls queue at a gate a person is waiting behind. That bound is real and is enforced today, provisionally and by wall clock, in the composition root.
"""

