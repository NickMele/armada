# Every setting Armada has decided it will have.
#
# Authored here. This is the list the `config` crate reads and, once each
# owning crate declares the keys it reads, the list it generates — at which
# point `read_by` stops being a design decision and becomes an observation.
# That is why the field is named for what it claims rather than what it knows.
#
# `notes` carries the argument for a value, including where a classification is
# the least confident one in the table. That reasoning is the reason this moved
# out of a database and into the repository: it is read while writing the code
# that obeys it.
#
# The rules these obey — the tiering test, how Kit and Manifest merge, what
# peer polarity is for — are in docs/contracts/configuration.md.
#
# `lifetime = "Frozen for the Job"` was `"Frozen at spawn"` until Focus. A Drone
# belongs to a workflow step, so a Job spawns one per step and "at spawn" would
# mean re-resolved at every boundary — which is the thing the snapshot rule
# forbids, because a step boundary has no person in it. The snapshot is taken
# once, at Job creation, and every Drone of that Job boots from it.


