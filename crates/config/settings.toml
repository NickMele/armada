[settings.concurrency-cap]
name = "Concurrency cap"
scope = "Machine"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced.** It bounds how many Drones Fleet runs at once: `fleet::slots::Slots::room` is the predicate, `admit_next` opens with it, and a Job approved past it stays `queued` with `waiting_on_resources` as its reason — the same predicate, so a Board cannot say a Job is blocked while Fleet is starting it. It read "informational per brief" until Throughput, when the working slot stopped being one.

**It bounds Drones and never approvals.** Every Job-level dispatch is still approved explicitly and one by one; this decides how many approved Jobs run together.

It has no value here for the reason none of Fleet's other dials does — `crates/armada/src/serve.rs` resolves it, as `PROVISIONAL_CONCURRENCY`, and carries the argument for the number. It ships at two: the attribution beneath it was measured at five, and what is unbuilt is everything else about running five — write-scope reservation, and any reading of the machine's headroom.
"""

[settings.budget-cost-cap-per-job]
name = "Budget: $ cost cap per Job"
scope = "Machine"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced, and it refuses the next dispatch rather than stopping a Drone that is spending.** That is the whole of what it does and it has to be read that way: `cost_micros` reaches Armada on the final result line of a Drone's session and nowhere else, so there is no mid-session figure to interrupt on. A ceiling that reads as "spending stops here" and means "nothing new starts after here" is worse than no ceiling, because it is believed. The case it does catch is the one that matters — a runaway is a sequence of Jobs rather than a single Drone, and the sequence is what admission sees.

**Per Job, and the slash in the old name is gone.** A Drone belongs to a workflow step, so a four-step Job is four Drones; a per-Drone ceiling on that Job is four times the number anybody thought they set, and the Job is what a person approved. `store::job_drone_spend` is the join — one row per Drone, keyed on the Drone so recording twice is recording once, summed per Job.

**It is one of two rows and not one number.** `docs/spikes/005-what-does-a-job-cost.md` priced three identical, identically successful runs of one Job at $0.063, $0.087 and $0.146 — a 2.31x spread on cache warmth alone, with almost none of it attributable to the work. A dollar ceiling tight enough to catch a runaway kills a healthy Job that started cold, so this one is deliberately wide and `budget-turn-cap-per-job` below is what catches what it misses. Whatever refuses a Job says which of the two it was: `queued_reason` reads `over_budget` for both and the Job's detail carries the figures beside the caps, because "over budget" and "took four times as many turns as any other run" take opposite remedies.

**Notional dollars.** Spike 5 established that `total_cost_usd` is what a run would have cost at API list price, and a subscription account is not billed per token. The figure is arithmetically exact and denominated in a currency nothing here spends, which makes it a runaway detector rather than an invoice.

**A Manifest has no budget cap.** Budget is Machine-level and that is what the Kit/Machine split is for; the Manifest row that used to sit beside this one declared `scope = "Manifest only"` for a setting that is not a Manifest's to hold, and it is gone. There is no precedence question because there is only one cap. Verification does not read this row either — a budget refusal is a Job state, decided by Fleet at admission, and never a gate verdict.

It has no value here for the reason none of Fleet's other dials does — `crates/armada/src/serve.rs` resolves it, as part of `PROVISIONAL_ALLOWANCE`, and carries the argument for the number. It ships at five dollars, which is roughly fifty of the dearest Job spike 5 measured: not a Job going slightly over, but one that has stopped making progress and kept paying.
"""

[settings.budget-turn-cap-per-job]
name = "Budget: turn cap per Job"
scope = "Machine"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Enforced, through the same predicate as the row above** — `fleet::allowance::Fleet::overspent`, which admission asks before it starts a Drone and which the Board's `over_budget` label is answered from. It refuses the next dispatch and stops nothing that is running, for that row's reason.

**The second signal, and the one that actually catches a Drone going wrong.** Spike 5's three runs of one Job turned 7, 7 and 4 times while their prices spread 2.31x, so turns are the steady reading the price is not. The remedies differ too: over the dollar cap, a person raises the cap or accepts the spend; over this one, the Drone is going in circles and the brief is what needs rewriting.

Turns are summed across every terminating line of every Drone of the Job. A stream carries one such line per invocation rather than one per process, and `num_turns` on each is that invocation's — which is why turns are added and the cost is not. Measured: `docs/spikes/004-transcript-idle-session.ndjson`.

**A new row, added with the Throughput milestone.** The registry had no turn ceiling; the only nearby rows are `loop_cap`, which bounds a step deliberately redone, and the thrashing norms, which bound one step against `StepNorms`. Neither counts across a whole Job.

It has no value here for the reason the row above does not — `crates/armada/src/serve.rs` resolves it, as part of `PROVISIONAL_ALLOWANCE`. It ships at three hundred: a four-step Job at a generous thirty turns a step is 120, so three hundred leaves room for a workflow twice that long and still stops a Drone that has been going round for hours.
"""

[settings.budget-quota-floor-for-interactive-use]
name = "Budget: quota % floor for interactive use"
scope = "Machine"
lifetime = "Live"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
**Not enforced, and it cannot be from what a Drone's stream carries.** The row read "enforced by Fleet" and that was never true. `docs/spikes/005-what-does-a-job-cost.md` captured fifteen `rate_limit_event`s across three spikes and every one of them is byte-identical: a status, a window kind, a reset instant and three overage flags. None of them is a quantity, so there is no percentage to hold a floor against.

**The number exists and is on a channel a headless Drone cannot reach.** The service sends per-window utilization on every response, and Claude Code hands it to the statusline — which does not run in `-p` mode; that was tested directly and the script never fired. Three routes to it are named in the spike and none is measured end to end.

Armada does not gate on quota, decided 23 Aug 2026 on that evidence: none of the routes is worth building against a third-party surface that may expose the number properly in a later release. **What that costs, stated so it is not a surprise:** the five-hour window is what will actually stop a fleet on a subscription, dollars stop nothing because nothing is billed per token, and the fleet will meet its real limit as a hard failure with no approach warning. `rate_limit_event` is still worth recording on the Job timeline as the post-mortem evidence.

The row stays rather than being deleted, because it is where that reasoning lives and because the change is small if `used_percentage` ever reaches the headless stream. It says unenforced out loud for `judge-cost-cap-per-check`'s reason: an unenforced cap is worse than an absent one, because only one of the two is visible as missing.

Also sets Doctor's Claude warn boundary — quota below this floor is warn, since dispatch is gated but the CLI still works. Not authenticated or CLI absent is fail. Doctor does not exist either.
"""

