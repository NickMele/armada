Added by the Aug 2026 config review. Judge is veto-only and blind to the Drone. The row previously read that a Manifest may add triggers and never remove them, because a repo that could remove them could opt out of semantic verification entirely while every other signal still reads green. That guarantee was the config direction rule and it was withdrawn Aug 22 2026 — a Manifest may now extend or restrict the trigger set. The risk the original wording named is real and now reachable; filed as an open finding rather than replaced with a new mechanism. Peer polarity is unchanged: across a Convoy's gating Manifests the set unions, because a trigger is a gate and adding one narrows.
"""

