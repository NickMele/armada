[settings.held-span-reminder-threshold]
name = "Held-span reminder threshold"
scope = "Machine"
lifetime = "Daemon start"
merge_strategy = "n/a — single layer"
peer_polarity = "n/a — single layer"
owner = "Fleet"
read_by = "fleet"
notes = """
How long an interrupted Job may hold a port span before Fleet surfaces it. Crossing it releases nothing and changes no state — it only stops the hold being silent, because the alternative is discovering the accumulation at exhaustion. A reminder rather than a lease: releasing a span whose process may still be bound is the collision the bind-and-connect probe exists to prevent, and a timer would also put Fleet in the business of deciding an interrupted Job is over. Where the reminder renders is governed by How does a person learn the port range is degrading?, and the Doctor precedent argues it is a standing condition rather than a queued decision — a health strip rather than an Alerts row.
"""
