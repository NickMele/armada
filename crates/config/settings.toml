lifetime = "Live"
merge_strategy = "REPLACE"
peer_polarity = "Lower is stricter"
owner = "Fleet"
read_by = "fleet"
notes = """
Ceiling on how many times a step is redone as designed via a loop return; reaching it escalates as loop_cap. Not the retry limit — an iteration is not a failure, never consumes the retry budget, never trips a gate-failure escalation. Set per step on the step that emits the verdict, defaulted from default_gate_policy.iteration_cap. Named in the Escalation Taxonomy since it was written; no row until Aug 21 2026.
"""

[settings.review-gate-policy-manifest-rule-review-gate]
name = "Review gate policy (manifest_rule:review_gate)"
scope = "Manifest only"
default = "human_always"
