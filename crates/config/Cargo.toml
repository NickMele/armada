[package]
name = "config"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
core-model = { path = "../core-model" }
store = { path = "../store" }
# `armada.yml` is YAML and a WorkflowDef is authored beside it, so this is where
# bytes enter the process for the configuration tier. Gate rule five scopes
# untyped JSON reading to `store` and `ipc`; nothing here parses JSON, and the
# document is walked as an untyped `Value` rather than deserialized into a
# struct — see `yaml.rs` for why a `#[derive(Deserialize)]` could not carry the
# refusals this crate has to produce.
serde_yaml_ng = "0.10"

[dev-dependencies]
# `tests/shipped.rs` only, and only for the model roster. Its subject is the
# definitions under `.armada/workflows/` **as this machine would load them**,
# and which models a machine offers is the adapter's knowledge — a list written
# out in the test would let a shipped step name something no Drone could be
# spawned as, which is the failure the roster exists to catch. Nothing in
# `src/` reaches for this, and the parser still takes the roster as a
# parameter: see `src/roster.rs`.
adapters = { path = "../adapters" }
