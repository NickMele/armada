[package]
name = "armada"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
core-model = { path = "../core-model" }
adapter-traits = { path = "../adapter-traits" }
store = { path = "../store" }
config = { path = "../config" }
ipc = { path = "../ipc" }
verification = { path = "../verification" }
checks-runner = { path = "../checks-runner" }
adapters = { path = "../adapters" }
fleet = { path = "../fleet" }
api = { path = "../api" }
# The composition root owns the runtime, and it is the only crate that does.
# `net` for the one listener, `signal` because a clean exit is what removes the
# runtime file and a signal is how a daemon is told to take one.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# `api::router` hands back an `axum::Router` and stops there — serving one over
# a listener is `axum::serve`, and the composition root is where the listener
# is. It adds no crate to the graph: `api` already brings axum in.
axum = "0.7"
# Watching `armada.yml` for an edit — `#430`. **No default features, and one
# platform backend anyway**: `src/watching.rs` uses `PollWatcher` and says why,
# but notify 8.2 will not compile on macOS with every backend off, so
# `macos_fsevent` is named to satisfy its own `cfg` rather than because
# anything here subscribes to FSEvents. It adds `notify-types`, `walkdir`,
# `same-file` and `fsevent-sys` to the graph, and no async runtime.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }

# **Declared dev-only, against the crate table, deliberately.** The table lists
# `testkit` among the composition root's dependencies, and this is the
# composition root of the shipping binary — a normal dependency there puts the
# fake harness, the fake VCS and the fake secrets provider inside the product.
# Recorded as a deviation rather than followed silently.
[dev-dependencies]
testkit = { path = "../testkit" }
# `test-util` only, and only for `src/tests/watching.rs`: the debounce is a
# window measured in seconds, and a test that waited one would be a test
# nobody runs. Paused time advances it when every task is idle, which is also
# what makes the assertion exact rather than a race.
tokio = { version = "1", features = ["test-util"] }
