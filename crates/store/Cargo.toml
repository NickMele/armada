[package]
name = "store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# `wreckage` compiles one method that damages a store, for the tests that
# recover from one. Only `testkit` turns it on, and nothing that ships does.
[features]
wreckage = []

[dependencies]
# The reading a footprint record holds. `adapter-traits` has no dependencies of
# its own, and taking the vocabulary that produced the reading is what keeps the
# stored `change` column and the wire spelling one set of words rather than a
# third written out here.
adapter-traits = { path = "../adapter-traits" }
core-model = { path = "../core-model" }
rusqlite = { version = "0.32", features = ["bundled"] }
# The one crate allowed to parse untyped JSON, and this is why it needs to:
# three of `jobs`' columns are typed `array<...>` by the field registry and
# stored as one column each. `core-model` carries no serde derives — adding
# them would put a dependency under every crate — so the shapes are written
# and read by hand here, in `columns.rs`, where both directions sit together.
serde_json = "1"
