[package]
name = "store"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
core-model = { path = "../core-model" }
rusqlite = { version = "0.32", features = ["bundled"] }
# The one crate allowed to parse untyped JSON, and this is why it needs to:
# three of `jobs`' columns are typed `array<...>` by the field registry and
# stored as one column each. `core-model` carries no serde derives — adding
# them would put a dependency under every crate — so the shapes are written
# and read by hand here, in `columns.rs`, where both directions sit together.
serde_json = "1"
