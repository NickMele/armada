[package]
name = "xtask"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

# Dev tooling only. Never a dependency of a shipped crate, and never in the
# binary. Kept deliberately thin: this must not become a place where charkit's
# real dependencies are chosen by accident.
[dependencies]
serde = "1"
serde_yaml_ng = "0.10"
serde_json = "1"
regex = "1"
