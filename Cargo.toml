# Armada v2 — Cargo workspace.
#
# `crates/*` is deliberately absent until the crates exist: this file is written
# in the same commit as `cargo xtask verify-ground-zero`, which is written
# before any crate (M0 step 7). The gate reports those crates missing; adding
# them to the members list is what step 7's second half does.
[workspace]
resolver = "2"
members = ["xtask"]

[workspace.package]
edition = "2021"
rust-version = "1.90"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
