[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/manifest",
    "crates/guild",
    "crates/fleet",
    "crates/helm",
    "xtask",
]

# Dependencies point inward (ARCHITECTURE.md §1.5) and nothing points upward
# (§1.9): `core` is pure; `manifest` and `guild` — two modules' imperative
# shells — depend on core only and are siblings that may not name each other;
# and `helm` is the only crate that depends on all of them and wires them
# together. The crate graph is the enforcement for the direction; `cargo xtask
# boundaries` is the enforcement for who may name whom.

[workspace.package]
edition = "2021"
# The toolchain this workspace is verified against, not an aspirational floor
# (ARCHITECTURE.md §3). Lowering it needs something that actually compiles and
# tests the lower version — the same deliberateness raising it takes.
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/NickMele/armada"

# One version of the YAML parser for the whole repo, and it is deliberately the
# same crate the binary reads `armada.yml` with (PLAN.md §4.1.1, decision 5).
# `xtask doclint` parses the corpus's examples with it, so a doc example that
# Armada would reject is a finding rather than a discovery in phase 3. Stating it
# once here is what keeps that true — a comment asking two manifests to agree
# does not.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
regex = "1"
# The failure signature is `blake3(normalised tail of output)` (PLAN.md §3.4).
# Named by the specification rather than chosen here, and pinned at workspace
# level for the same reason the YAML parser is: one hash, or two runs of one bug
# stop matching across a version boundary.
blake3 = "1"

# **Line tables, not full debug info.** Measured on this workspace: the dev
# profile's default `debug = 2` is the single biggest cost in a rebuild, because
# twenty test binaries each link a full copy of it. `line-tables-only` keeps
# what a backtrace actually needs — file and line for every frame — and drops
# the type and variable descriptions a debugger would use.
[profile.dev]
debug = "line-tables-only"
