# Armada's own Manifest, read by a running Fleet. A Job dispatched here runs
# these commands verbatim.
#
# Every section the Manifest concept page describes but this file omits is
# refused by name: a key nothing reads is a promise the system does not keep.

version: 1

# Written rather than minted, so renaming the directory does not orphan a Job.
id: armada

# Optional. Absent, Armada infers one and says so in the pull request.
base: main

# Checks gate advancement. A step naming one not declared here is refused.
checks:
  build:
    # `--locked`: a Check that updates the lockfile changed what it measured.
    run: cargo build --workspace --locked

  test:
    # `--exclude acceptance`: a milestone's claim is read on its own. See
    # docs/practices/acceptance-tests.md. `nextest` measured 3x `cargo test`.
    run: cargo nextest run --workspace --exclude acceptance

  # The Bridge half — `build` and `test` say nothing about `apps/` or
  # `packages/`. Three, because none subsumes another. All need `node_modules`,
  # which `bootstrap` below puts in the worktree before any of them run. Left
  # to install on demand, the three race each other into one empty tree and
  # whichever loses reports a missing module — #227.
  typecheck:
    # Two commands, because neither config reaches the other's files and there
    # is no third that covers both. `apps/desktop` needs `-b --force`: its
    # tsconfig owns only referenced projects, and stale build info would skip
    # the one just edited. The library is one project that writes no build
    # info, so `--noEmit -p` is the whole job and `--force` has nothing to
    # force.
    #
    # Named rather than left to `pnpm -r`, which skips a package that declares
    # no `typecheck` — silently, which is how the library went unchecked for as
    # long as it existed. `storybook` below is not a substitute: Vite
    # transpiles per file and typechecks none of it, and desktop's own pass
    # reaches only the components it imports, never a story. A `ShieldMinus`
    # used without importing it threw on render, on main, until #235.
    #
    # **The names are in a `package.json` script and not here, because a `run`
    # gets no shell.** This line was `pnpm -C … && pnpm -C …`; the runner
    # passed `&&` as an argument and `tsc` died on `Unknown build option
    # '-C'`, so the Check could never pass and every Job dispatched against
    # this repository failed on it. A script is where a chain of commands can
    # be written, and the list stays explicit inside it.
    run: pnpm typecheck
    # `domain/**` and `protocol-version.toml`: codegen emits TypeScript from
    # them, so a change there is a change to compiled code.
    when:
      - "apps/**"
      - "packages/**"
      - "crates/core-model/domain/**"
      - "protocol-version.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  bridge_build:
    # Catches what `typecheck` cannot: an import that resolves in the editor
    # and not in the bundle.
    run: pnpm -C apps/desktop build
    when:
      - "apps/**"
      - "packages/**"
      - "crates/core-model/domain/**"
      - "protocol-version.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  storybook:
    run: pnpm -C packages/components build-storybook
    # Shorter than the two above: nothing under `apps/` concerns it.
    when:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  bridge_test:
    # The Bridge half had no test runner at all until this Check. `test` above
    # is `cargo`, `typecheck` compiles TypeScript without running any of it, and
    # `storybook` proves the stories build rather than that any of them renders
    # what it claims. A component could be wrong in every way that is not a type
    # error and nothing here would say so.
    #
    # **Four runners under one name, and none subsumes another.** The split is
    # by what is being checked, not by package.
    #
    # `packages/screens` runs its pure modules in node — which tab a Job is in,
    # which render it takes — where a hundred cases cost what one costs. It also
    # runs its screens in a browser, in a second project, because a screen
    # cannot be storied: `xtask/src/rules_layers.rs` puts `@armada/components`
    # below `@armada/screens` and refuses the import the other way, so no story
    # can mount `OverruleControl`. What a screen wires is checked where the
    # screen is.
    #
    # `apps/desktop` runs main's own state machines in node, against a `ws`
    # server on a loopback port. Everything main holds is a socket's messages
    # folded into state, and no Check here could reach any of it: `typecheck`
    # compiles main without running it and `bridge_build` bundles it, so a
    # `failed` that dropped the rows it had already received was invisible until
    # #324.
    #
    # `packages/components` runs every story in a real browser through
    # `@storybook/addon-vitest`: rendering at all is the smoke test, and a story
    # with a `play` function has its assertions run. So the drawing, the wiring,
    # the arithmetic and the wire are each checked by the thing that can check
    # them.
    #
    # **The chain is in a `package.json` script, for the reason `typecheck`
    # above gives at length: a `run` gets no shell.** `apps/desktop` first,
    # because it is now the only one that starts no browser: screens answered in
    # under a second until it gained a browser project of its own, and the
    # sentence that used to be here said so. The order is the order they answer
    # in — 6s, 40s, then the stories — so a failure surfaces as early as it can.
    run: pnpm bridge-test
    when:
      - "apps/**"
      - "packages/**"
      - "crates/core-model/domain/**"
      - "protocol-version.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  # `format`, not `fmt`: that name is a Command below and both registries
  # refuse a collision — the Command writes, this reads. No `clippy` beside it;
  # `[clippy-as-a-check]` in docs/OPEN.md is why.
  #
  # **`requires: [fmt]` is here because of a Job that burned its whole retry
  # budget without it.** Every other Check passed on all three `implement`
  # attempts; this one failed each time at a different unformatted line, while
  # the Command that fixes it sat below in this same file. Fleet now runs `fmt`
  # once per gate evaluation before this reads, and a failure in it is reported
  # as `fmt`'s rather than as this Check's. #387.
  format:
    run: cargo fmt --all --check
    requires:
      - fmt

# Commands gate nothing — they are what a Drone is given to run.
commands:
  # `setup.requires` names this; a Drone is never given it. `--frozen-lockfile`
  # so preparation writes nothing the Drone's diff would carry.
  bootstrap:
    run: pnpm install --frozen-lockfile

  # The browser `bridge_test` mounts stories in. `setup.requires` names this
  # too, after `bootstrap` — the binary it runs is installed by it.
  #
  # **A machine-level cache, not a worktree one.** Playwright puts the shell in
  # the user's cache directory, so this is a fetch on a machine that has never
  # run it and a version check on every one after. Left out of setup, the first
  # Job on a fresh machine would fail `bridge_test` on a missing executable and
  # report it as a broken test.
  #
  # `--only-shell`: the headless shell is what a headless run launches, and it
  # is a third of the full browser download.
  #
  # One install for two packages. `packages/screens` pins the same Playwright as
  # `packages/components` and the shell is cached per machine, so this covers
  # both — a second line here would download nothing and would go stale the
  # first time the pins differed.
  browsers:
    run: pnpm -C packages/components exec playwright install chromium --only-shell

  fmt:
    run: cargo fmt --all

  gate:
    # Exits non-zero on purpose, which is why it is not a Check.
    run: cargo xtask verify-foundations

# What has to have run before any step starts in a fresh worktree. Names a
# Command above; a name nothing declares is refused at load. Fleet runs it once
# where the worktree is cut, not once per Drone, and has no opinion about what
# it runs. A failure here is not a step failure — no step has started.
setup:
  requires:
    - bootstrap
    - browsers
