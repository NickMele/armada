# Armada's own Manifest, read by a running Fleet. A Job dispatched here runs
# these commands verbatim.
#
# Every section the Manifest concept page describes but this file omits is
# refused by name: a key nothing reads is a promise the system does not keep.
#
# The two exceptions are `auto_merge` and `review_gate`, which have defaults
# rather than refusals — they are `Manifest only`, so an absent key has no tier
# above it to defer to and means `never` and `human_always`. This repository
# writes neither, which is those two answers: no machine lands Armada's own work
# and a person signs every review step off.

version: 1

# Written rather than minted, so renaming the directory does not orphan a Job.
id: armada

# Optional. Absent, Armada infers one and says so in the pull request.
base: main

# Checks gate advancement. A step naming one not declared here is refused.
#
# **The order below is the order they start in.** A step that says
# `every_manifest_check` takes it from this file, and `fleet::checking` starts
# four at a time off it, refilling as each finishes — so the first four declared
# are the four that start. There is no `order:` key to state it with, for the
# reason a workflow's `steps[]` has none: order is already the semantics, and
# two statements of it can disagree.
#
# **It does not decide what a Drone is told first, and this once said it did.**
# Nothing here stops early — `checking`'s own note is that a failing Check
# cancels none of the others, because whoever reads a failed step wants every
# result — and the report is written into slots sized from the declaration, so
# what comes back is in this order however the four raced. What the order
# actually decides is the schedule, and on that reading it is not tuned: the
# classic answer is slowest first, which would put `bridge_test` at the top
# rather than at the bottom. `typecheck`, `storybook` and `bridge_build` have
# never been timed on their own, so there is nothing to tune it against yet.
checks:
  build:
    # `--locked`: a Check that updates the lockfile changed what it measured.
    run: cargo build --workspace --locked
    # What a Drone gets when it asks about its own change rather than the whole
    # tree. `--workspace` is gone rather than joined by `-p`: cargo reads the
    # two together as the whole workspace and drops the `-p` silently, so a
    # narrowed run would have been the whole run wearing a shorter command.
    #
    # `under: crates` is this repository declaring its own layout, and it is
    # the only Cargo fact anywhere in the chain. `xtask` sits at the root
    # rather than under `crates`, so a change to it narrows to nothing and this
    # Check is not run — the gate still reads it whole.
    #
    # No `except`, unlike `test` below: `--workspace` builds `acceptance` too,
    # so `-p acceptance` measures nothing the whole run does not.
    narrow:
      run: cargo build --locked
      each: "-p {}"
      under: crates

  test:
    # `--exclude acceptance`: a milestone's claim is read on its own. See
    # docs/practices/acceptance-tests.md. `nextest` measured 3x `cargo test`.
    run: cargo nextest run --workspace --exclude acceptance
    # `--exclude` goes with `--workspace`, and cargo refuses it without one —
    # so the exclusion is restated as `except`, and it is the same exclusion
    # for the same reason. A milestone's claim is read on its own, so a
    # narrowed run that pulled `acceptance` back in would show a Drone a bar
    # the gate deliberately does not apply to it, and a Drone shown a red test
    # chases it green.
    narrow:
      run: cargo nextest run
      each: "-p {}"
      under: crates
      except:
        - acceptance

  # The Bridge half — `build` and `test` say nothing about `apps/` or
  # `packages/`. Three, because none subsumes another. All need `node_modules`,
  # which `bootstrap` below puts in the worktree before any of them run. Left
  # to install on demand, the three race each other into one empty tree and
  # whichever loses reports a missing module — #227.
  typecheck:
    # Two commands, because neither config reaches the other's files and there
    # is no third that covers both. `apps/desktop` needs `-b --force`: its
    # tsconfig owns only referenced projects, and stale build info would skip
    # the one just edited. The library is one project that writes no build
    # info, so `--noEmit -p` is the whole job and `--force` has nothing to
    # force.
    #
    # Named rather than left to `pnpm -r`, which skips a package that declares
    # no `typecheck` — silently, which is how the library went unchecked for as
    # long as it existed. `storybook` below is not a substitute: Vite
    # transpiles per file and typechecks none of it, and desktop's own pass
    # reaches only the components it imports, never a story. A `ShieldMinus`
    # used without importing it threw on render, on main, until #235.
    #
    # **The names are in a `package.json` script and not here, because a `run`
    # gets no shell.** This line was `pnpm -C … && pnpm -C …`; the runner
    # passed `&&` as an argument and `tsc` died on `Unknown build option
    # '-C'`, so the Check could never pass and every Job dispatched against
    # this repository failed on it. A script is where a chain of commands can
    # be written, and the list stays explicit inside it.
    run: pnpm typecheck
    # **No `narrow`, and that is an answer rather than an omission.** A project
    # is the unit a TypeScript compilation has: `tsc` reads the files its
    # tsconfig references whatever is handed to it, so there is nothing
    # narrower to run. A Check that declares none runs whole, which is what the
    # three below do too.
    #
    # `domain/**` and `protocol-version.toml`: codegen emits TypeScript from
    # them, so a change there is a change to compiled code.
    when:
      - "apps/**"
      - "packages/**"
      - "crates/core-model/domain/**"
      - "protocol-version.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  bridge_build:
    # Catches what `typecheck` cannot: an import that resolves in the editor
    # and not in the bundle.
    run: pnpm -C apps/desktop build
    when:
      - "apps/**"
      - "packages/**"
      - "crates/core-model/domain/**"
      - "protocol-version.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  storybook:
    run: pnpm -C packages/components build-storybook
    # Shorter than the two above: nothing under `apps/` concerns it.
    when:
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  bridge_test:
    # The Bridge half had no test runner at all until this Check. `test` above
    # is `cargo`, `typecheck` compiles TypeScript without running any of it, and
    # `storybook` proves the stories build rather than that any of them renders
    # what it claims. A component could be wrong in every way that is not a type
    # error and nothing here would say so.
    #
    # **Four runners under one name, and none subsumes another.** The split is
    # by what is being checked, not by package.
    #
    # `packages/screens` runs its pure modules in node — which tab a Job is in,
    # which render it takes — where a hundred cases cost what one costs. It also
    # runs its screens in a browser, in a second project, because a screen
    # cannot be storied: `xtask/src/rules_layers.rs` puts `@armada/components`
    # below `@armada/screens` and refuses the import the other way, so no story
    # can mount `OverruleControl`. What a screen wires is checked where the
    # screen is.
    #
    # `apps/desktop` runs main's own state machines in node, against a `ws`
    # server on a loopback port. Everything main holds is a socket's messages
    # folded into state, and no Check here could reach any of it: `typecheck`
    # compiles main without running it and `bridge_build` bundles it, so a
    # `failed` that dropped the rows it had already received was invisible until
    # #324.
    #
    # `packages/components` runs every story in a real browser through
    # `@storybook/addon-vitest`: rendering at all is the smoke test, and a story
    # with a `play` function has its assertions run. So the drawing, the wiring,
    # the arithmetic and the wire are each checked by the thing that can check
    # them.
    #
    # **The chain is in a `package.json` script, for the reason `typecheck`
    # above gives at length: a `run` gets no shell.** `apps/desktop` first,
    # because it is now the only one that starts no browser: screens answered in
    # under a second until it gained a browser project of its own, and the
    # sentence that used to be here said so. The order is the order they answer
    # in — 6s, 40s, then the stories — so a failure surfaces as early as it can.
    run: pnpm bridge-test
    when:
      - "apps/**"
      - "packages/**"
      - "crates/core-model/domain/**"
      - "protocol-version.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

  # `format`, not `fmt`: that name is a Command below and both registries
  # refuse a collision — the Command writes, this reads. No `clippy` beside it;
  # `[clippy-as-a-check]` in docs/OPEN.md is why.
  #
  # **No `requires: [fmt]`, on purpose, and it once had one.** #387 gave it
  # that, for a Job that burned its whole retry budget failing `format` at a
  # different unformatted line each attempt while the Command that fixes it
  # sat right below in this file. It read as a fix: every gate evaluation ran
  # `fmt` and then read what `fmt` had just written, so `format` passed every
  # time it ran and unformatted Rust merged unnoticed —
  # `xtask/src/rules_stories.rs` on `main`, until this line was found. A Check
  # that writes what it then reads is not a check, whoever runs it: `armada check
  # format` and a person's own run inside a Job read the same Manifest and are
  # owed the same answer the gate gives, by this file's own rule at `declared`
  # in `crates/armada` — so this could not be fixed for a Drone alone without
  # the two disagreeing. A failure here says `armada run fmt`. A Drone already
  # holds that Command as a Bash grant on every step, `fmt` being
  # non-destructive — Spike 011 — so nothing here is protecting a retry
  # budget it cannot also protect by running the fix itself.
  format:
    run: cargo fmt --all --check
    # The other shape of narrowing: the changed paths, verbatim, with no
    # derivation at all. `from` keeps everything but Rust out — rustfmt exits
    # non-zero on a file it cannot parse, so a changed `.md` would fail this
    # Check for a reason that is not the work.
    #
    # `rustfmt` and not `cargo fmt`, because `cargo fmt -- <path>` passes what
    # follows `--` to rustfmt as options and computes its own file list from
    # the workspace's targets: the paths are ignored and the whole tree is read.
    # Measured here on 8 Sep 2026, on a file this repository does not compile.
    narrow:
      run: rustfmt --check --edition 2021
      each: "{}"
      from:
        - "**/*.rs"

# Commands gate nothing — they are what a Drone is given to run.
commands:
  # `setup.requires` names this; a Drone is never given it. `--frozen-lockfile`
  # so preparation writes nothing the Drone's diff would carry.
  bootstrap:
    run: pnpm install --frozen-lockfile

  # The browser `bridge_test` mounts stories in. `setup.requires` names this
  # too, after `bootstrap` — the binary it runs is installed by it.
  #
  # **A machine-level cache, not a worktree one.** Playwright puts the shell in
  # the user's cache directory, so this is a fetch on a machine that has never
  # run it and a version check on every one after. Left out of setup, the first
  # Job on a fresh machine would fail `bridge_test` on a missing executable and
  # report it as a broken test.
  #
  # `--only-shell`: the headless shell is what a headless run launches, and it
  # is a third of the full browser download.
  #
  # One install for two packages. `packages/screens` pins the same Playwright as
  # `packages/components` and the shell is cached per machine, so this covers
  # both — a second line here would download nothing and would go stale the
  # first time the pins differed.
  browsers:
    run: pnpm -C packages/components exec playwright install chromium --only-shell

  fmt:
    run: cargo fmt --all

  gate:
    # Exits non-zero on purpose, which is why it is not a Check.
    run: cargo xtask verify-foundations

# How patient Fleet is with a Drone working here. Both keys are optional and
# each falls back on its own: what is not written is what Fleet was started
# with, and a workflow step may override either again.
drone:
  # 300, against a shipped 120, because one command here is longer than the
  # whole of what the threshold was measured against. Spike 009 saw a longest
  # honest silence of 79s on a repository with a warm cache and small changes.
  # Measured here into an empty target directory on 3 Sep 2026, each a single
  # tool call a Drone makes no sound during: `build` 37.6s, `test` 41s, and
  # `bridge_test` 6s then 40s before a browser starts. A Drone that runs two of
  # them before it speaks is past 120s while nothing is wrong.
  #
  # 300 is the top of the band that spike named as separating every stuck step
  # it saw from every honest one, so this is still a tripwire. Raise it again
  # only with a silence somebody measured.
  quiet_after_seconds: 300
  # No `poke_limit`. Nothing here wants more or fewer nudges than Fleet's two,
  # and a number written without a reason is one the next person deletes.

# No `after_merge:`. The key exists and this repository does not set it — see
# docs/concepts/manifest.md, *Proving what merged*. What it would buy is a run of
# `build` and `test` against the commit each merge leaves on `main`; what it
# costs is those two on the machine somebody is working on, cold, for an event
# nobody is waiting for. docs/practices/rust.md section 8 names a hook that
# rebuilt on merge as the cause of v1's four-minute cold build and says outright
# not to reintroduce one. Turning it on is two lines and is a decision somebody
# takes deliberately, which is the whole reason absent means off.

# What has to have run before any step starts in a fresh worktree. Names a
# Command above; a name nothing declares is refused at load. Fleet runs it once
# where the worktree is cut, not once per Drone, and has no opinion about what
# it runs. A failure here is not a step failure — no step has started.
setup:
  requires:
    - bootstrap
    - browsers
