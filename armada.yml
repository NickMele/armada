# Armada's own config — the dogfood target (ARCHITECTURE.md §2.6).
#
# **This is a test subject, not the merge gate.** Through phase 6 the gate runs
# the raw tools and one integration test asserts `armada manifest check --json` agrees with
# them, so a bug in a half-built tool cannot lock its own repository. Phase 6 is
# where `armada manifest check` becomes the gate; the raw commands below are the ones the
# README keeps as the fallback afterwards.
#
# **A caveat that belongs next to the file rather than only in the document.**
# This config is one component, pure Rust, no services, no ports and no
# secrets — structurally the *simplest* shape the schema can express, so
# dogfooding pulls the design toward it. "It works on Armada" is not evidence
# the abstraction generalises; the six fixtures under `tests/fixtures/` and
# phase 8 are.
#
# Every check is `scope: component`, and that is a property of cargo rather
# than a default being dodged: `cargo clippy`, `cargo fmt --check` and
# `cargo test` take a workspace, not a file list, so a file-scoped spelling
# would declare a `${files}` none of them could receive. `${files}` is
# exercised by the fixtures, which model repos whose tools do take one.

manifest:
  version: 1

  components:

    armada:
      # No `root:` and no `match:`: the component *is* the repo, so the default
      # (`**`, PLAN.md §4.1.1) is the correct glob rather than an omission.
      # **`cargo fetch` and the test runner, because a check a Drone cannot run
      # is a check that does not exist.** `manifest init` runs this in every new
      # worktree, so a Job spawned on a fresh machine gets `cargo-nextest`
      # before its first gate calls `armada manifest check`. `--locked` so the
      # runner is the same build everywhere, and installing an already-present
      # version is a no-op rather than a rebuild.
      setup: cargo fetch && cargo install cargo-nextest --locked

      owns:
        # Removed only by `clean --artifacts` (PLAN.md §3.3.1). It costs disk and
        # leaks nothing machine-global, and deleting it makes the next `init` pay
        # a full rebuild.
        files: [target]

      checks:
        fmt:
          cmd: cargo fmt --all --check
          fix: cargo fmt --all
          scope: component

        lint:
          cmd: cargo clippy --all-targets -- -D warnings
          scope: component
          cost: 2

        # **`nextest` rather than `cargo test`, measured at 3x.** `cargo test`
        # runs each of the twenty test binaries to completion before starting
        # the next; `nextest` pools every test across all of them. Warm, on this
        # workspace: 83s against 27s for the same 2034 tests, with 35s of CPU
        # inside that 83s — most of the old number was one binary blocking while
        # the rest waited their turn.
        #
        # **It does not touch the cold number**, which is larger and is
        # compilation: ~4 minutes after a merge, because the install hook
        # rebuilds and invalidates the cache. That is a separate problem and
        # this is not a fix for it.
        test:
          cmd: cargo nextest run --workspace
          scope: component
          cost: 2

        # `cargo xtask doclint` is item 6 of the gate's six: the ARCHITECTURE.md
        # §2.4 contamination grep and the privacy gate, plus the § cross-reference
        # and fenced-block checks over the corpus.
        docs:
          cmd: cargo xtask doclint
          scope: component

        # The ARCHITECTURE.md §1.5 layers contract, read off the crate graph.
        boundaries:
          cmd: cargo xtask boundaries
          scope: component
