# design — explore, articulate, hand over.
#
# Ends at you. Design has no automated pass condition: no command can tell you
# an approach is right, so this workflow deliberately has no step that closes
# itself (PLAN.md §14.6).
#
# This file is a starter. `guild init` copied it once and Armada does not touch
# it again — `armada guild edit workflows/design.yml` is how it changes.
name: design
description: Explore a problem space and write down an approach, for you to judge.
ends_at: human

budget:
  iterations: 15
  tokens: 500000
  wall_clock: 90m
  # Exhaustion is an outcome, never a silent stop (PLAN.md §14.3).
  on_exhausted: needs_human

steps:
  # `always` advances; it does not pass. This step's output is the next step's
  # input, and there is nothing to verify about having read the code.
  - id: explore
    skill: explore-codebase
    verify: { must: always }

  # The artifact is the point of the workflow, so its existence is the one
  # mechanical thing worth checking before you are asked to read it.
  - id: articulate
    skill: write-design
    verify:
      must: artifact_exists
      artifact: docs/design/*.md

  - id: hand-over
    verify: { must: human_approves }
