# plan — research, write a plan, hand over.
#
# Ends at you, **before anything builds**. The expensive failure is not bad
# code, it is correct code solving the wrong problem, and the cheapest moment to
# catch that is before the work exists (PLAN.md §14.6).
#
# Run on its own, `plan` terminates at approval. As `feature`'s first step it
# continues past it — which is why `feature` names this workflow rather than
# splicing its steps in. Textual inclusion would have made those two the same
# thing and quietly changed what `plan` means.
name: plan
description: Research a task and write a plan, for you to approve before anything is built.
ends_at: human

budget:
  iterations: 15
  cost: 5.00
  wall_clock: 90m
  on_exhausted: needs_human

steps:
  - id: research
    skill: explore-codebase
    verify: { must: always }

  - id: write-plan
    skill: write-plan
    verify:
      must: artifact_exists
      artifact: PLAN.md

  - id: approve
    verify: { must: human_approves }
