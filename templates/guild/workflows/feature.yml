# feature — plan, approval, implement, review, land.
#
# Ends on a local branch, but only after you approved the approach.
#
# The first step runs `plan` as a **sub-Job** — its own uuid, worktree, budget
# and record — so the plan you approved is a durable artifact you can point at
# later rather than a paragraph buried in a longer Job's transcript. The
# parent's ceilings are suspended while it runs, because approval can take
# hours and a wall clock that kept ticking would kill a Job because you went to
# lunch (PLAN.md §14.6).
name: feature
description: Plan it, get your approval, build it, have it reviewed, land it on a branch.
ends_at: branch

budget:
  iterations: 20
  tokens: 600000
  wall_clock: 90m
  on_exhausted: needs_human

steps:
  - id: plan
    workflow: plan
    verify: { must: subjob_passed }

  # The stop that makes the workflow worth running. Everything after this is
  # expensive and everything before it is cheap.
  - id: approval
    verify: { must: human_approves }

  - id: implement
    skill: implement-change
    scope: changed
    verify: { must: check_passes }

  # No `skill:` — Fleet satisfies this one by spawning a reviewer Job with the
  # diff and the original task, in its own context. The Drone under review never
  # calls `fleet.spawn`: a worker able to spawn workers is a fork bomb with a
  # budget. An independent context is also the point — a reviewer sharing the
  # implementer's context shares its blind spots.
  - id: review
    verify: { must: review_clean }

  - id: land
    skill: land-branch
    verify: { must: branch_exists }
